alidated with originators.", "A stakeholder map with engagement route per group."], "derived_from": ["AA1000AP-2018.INC", "AA1000AP-2018.RES", "GRI-2-2021.2-29"]}, {"stage": 3, "label": "Verify it", "entry_band": "established", "moves": ["Measure how well your engagement works and use the result to change how you do it.", "Make conversation, not judgment, the first route for settling disputes.", "Have the governing body see the pattern of issues, not only the ones passed up to it."], "evidence": ["An engagement effectiveness measure with a change made in response.", "Periodic issue-pattern reporting to the governing body."], "derived_from": ["AA1000AP-2018.INC", "UNGP-2011.GP31.h", "ISO-37000-2021.P5"]}, {"stage": 4, "label": "Show it", "entry_band": "rolemodel", "moves": ["Give the people affected a role in designing the feedback process itself.", "Publish what you heard, what you did, and what you chose not to do and why.", "Put the governing body's commitment to being accountable to those affected in writing."], "evidence": ["A published 'you said / we did / we did not' account.", "Stakeholder participation in mechanism design."], "derived_from": ["UNGP-2011.GP31.h", "AA1000AP-2018.INC", "AA1000AP-2018.RES"]}], "strength": {"statement": "A raised issue reliably acquires an owner, a response and a way back to the person who raised it.", "protect": ["Naming a person, never a team, at the moment an issue is raised.", "Reporting back to the originator as a required step rather than a courtesy."]}, "pillar": "conditions"}, {"id": "decisions", "name": "Responsible Decisions & Consequences", "definition": "Whether people decide in time, within their authority and under uncertainty, whether the organization tells apart judgment, skill, process and conduct before responding to a failure, and whether the response is proportionate.", "provisions": ["REASON-1997.TREE", "REASON-1997.SUB", "ISO-37000-2021.P8", "OECD-MNE-2023.DD3", "OECD-MNE-2023.DD6", "GRI-2-2021.2-25", "ESRS-G1.G1-3", "PMBOK-7.P10"], "questions": [{"id": "Q22", "text": "People make timely decisions within their authority, even when complete certainty is unavailable.", "provisions": ["ISO-37000-2021.P8", "PMBOK-7.P10"], "mini": true}, {"id": "Q23", "text": "Before responding to a failure, the organization distinguishes among judgment, capability, process, and conduct issues.", "provisions": ["REASON-1997.TREE", "REASON-1997.SUB"]}, {"id": "Q24", "text": "Coaching, process correction, investigation, or consequences are proportional to the issue.", "provisions": ["REASON-1997.TREE", "GRI-2-2021.2-25", "ESRS-G1.G1-3"]}], "diagnosis": {"foundational": "Responses to failure depend on who is available to blame and how visible the failure was, not on what caused it. This does the most damage of any pattern here, because it teaches people to hide problems.", "developing": "People understand the difference between an honest error and a violation, but not everyone applies it the same way. Similar failures get different responses depending on seniority or timing.", "established": "Responses are mostly proportionate. What is usually missing is a written record: the reasoning is sound but not recorded, so consistency cannot be shown.", "rolemodel": "Fair treatment of failures is built into how the organization works. The next step is remedy: not only responding fairly inside, but putting things right where harm reached other people."}, "reflection_questions": ["Take your last two comparable failures. Were the responses comparable? What explains the difference?", "Who decides whether something was error or violation — and is that person independent of the outcome?"], "anti_patterns": ["Consequence severity correlating with how public the failure became.", "Investigation used as the default first step for every failure, including obvious system faults."], "ladder": [{"stage": 1, "label": "Write it down", "entry_band": "foundational", "moves": ["Adopt a written way to sort failures into honest error, risky behavior, and reckless or deliberate violation.", "Work through the sort in order: deliberate harm first, then incapacity, then ignoring a known risk. Only last ask whether another equally qualified person would have decided the same way.", "Define what a timely decision means for each type of decision, so delay is visible as a choice."], "evidence": ["A written culpability framework in use.", "A worked culpability sequence for at least one real case, showing each test in turn."], "derived_from": ["REASON-1997.TREE", "REASON-1997.SUB"]}, {"stage": 2, "label": "Put it to use", "entry_band": "developing", "moves": ["Record why significant decisions were made at the time, including what was not known.", "Match the response to the cause: coaching for skill gaps, redesign for process faults, and investigation only for misconduct.", "Stop, prevent or reduce the harm first, before arguing about who is to blame."], "evidence": ["Decision records capturing known uncertainty.", "A response log showing category-to-response matching."], "derived_from": ["ISO-37000-2021.P8", "OECD-MNE-2023.DD3"]}, {"stage": 3, "label": "Verify it", "entry_band": "established", "moves": ["Compare how similar cases were handled across cases and across levels of seniority, and publish what you find inside the organization.", "Put in place ways to put things right when people outside the organization are harmed.", "Track confirmed incidents, including corruption where relevant, and what followed."], "evidence": ["A consistency review across comparable cases.", "A documented remediation process and incident record."], "derived_from": ["GRI-2-2021.2-25", "ESRS-G1.G1-3", "ISO-37000-2021.P5"]}, {"stage": 4, "label": "Show it", "entry_band": "rolemodel", "moves": ["Provide for or take part in putting things right where you caused or contributed to harm, and say so publicly.", "Disclose data on incidents and how you responded, not only policy.", "Offer your way of sorting failures to partners, so the same standard applies along the chain."], "evidence": ["Disclosed incident and response data.", "Public remediation commitment and record."], "derived_from": ["OECD-MNE-2023.DD6", "ESRS-G1.G1-3", "UNGP-2011.GP31.f"]}], "strength": {"statement": "The response to failure is set by what caused it rather than by how visible it was or who was involved. This is the hardest item on the instrument to fake.", "protect": ["The culpability sequence worked in order before any consequence decision.", "Consistency across levels of seniority, checked rather than assumed."]}, "pillar": "conditions"}, {"id": "roles", "name": "Roles, Authority & Decision Rights", "definition": "Whether every critical outcome has one named owner, whether roles, limits, decision rights and routes for raising problems are understood by everyone, and whether authority matches the accountability given.", "provisions": ["ISO-37000-2021.P4", "ISO-26000-2010.PR1", "ISO-21502-2020.4.5", "ISO-21502-2020.4.5.4", "OECD-CG-2023.V", "GRI-2-2021.2-13", "GRI-2-2021.2-9"], "questions": [{"id": "Q25", "text": "A clearly accountable owner is identified for each critical outcome.", "provisions": ["ISO-37000-2021.P4", "ISO-21502-2020.4.5.4"], "mini": true}, {"id": "Q26", "text": "Roles, boundaries, decision rights, and escalation paths are mutually understood.", "provisions": ["ISO-21502-2020.4.5", "GRI-2-2021.2-13"]}, {"id": "Q27", "text": "Authority is aligned with the level of accountability assigned.", "provisions": ["ISO-37000-2021.P4", "ISO-21502-2020.4.5.4"]}], "diagnosis": {"foundational": "Accountability is spread too thin. When more than one person is accountable for an outcome, no one is, and this only shows when the outcome fails.", "developing": "Owners are named but have no authority to act. This is the most common structural fault. It looks like ownership but has none of the substance.", "established": "Roles and decision rights are clear and understood. What is usually missing is the gap between roles: who owns the space between two clear owners.", "rolemodel": "Decision rights are clear. The next step is the ISO 37000 point that delegating a task never passes on the governing body's own responsibility to answer for it."}, "reflection_questions": ["For your three most critical outcomes, can you name one person each — and would they name themselves?", "Where does an owner lack a lever they need, and who holds it instead?"], "anti_patterns": ["A RACI with multiple 'A's for the same deliverable.", "Escalation paths that exist on a chart but have never been used."], "ladder": [{"stage": 1, "label": "Write it down", "entry_band": "foundational", "moves": ["Name exactly one accountable owner for each critical outcome, and have them accept it explicitly.", "Define how the project or unit is organized: the roles, their limits, and the authority given to each.", "Where an outcome has a sponsor, make clear who the sponsor answers to, covering objectives, outputs, outcomes and benefits."], "evidence": ["An accountability register: one outcome, one owner, accepted.", "A role and authority definition per named role."], "derived_from": ["ISO-37000-2021.P4", "ISO-21502-2020.4.5", "ISO-21502-2020.4.5.4"]}, {"stage": 2, "label": "Put it to use", "entry_band": "developing", "moves": ["Match authority to accountability line by line and close every gap, by raising the authority or lowering the accountability.", "Document how responsibility for managing impacts passes down from the governing body.", "Test the route for passing problems up by using it on purpose at least once."], "evidence": ["A reconciliation showing authority matched to each accountability.", "A documented delegation chain from the governing body."], "derived_from": ["ISO-37000-2021.P4", "GRI-2-2021.2-13"]}, {"stage": 3, "label": "Verify it", "entry_band": "established", "moves": ["Map the gaps: for each point where two owners meet, name who owns that point.", "Have the governing body check whether it is truly overseeing delegated work or only receiving reports.", "Manage conflicts of interest openly where authority is concentrated."], "evidence": ["An interface ownership map.", "A conflicts-of-interest process covering key decision roles."], "derived_from": ["ISO-37000-2021.P5", "OECD-CG-2023.V", "GRI-2-2021.2-15"]}, {"stage": 4, "label": "Show it", "entry_band": "rolemodel", "moves": ["Disclose how the governing body is structured and made up, and how responsibility for impacts is delegated.", "State publicly what the governing body remains answerable for, even after delegating.", "Apply the same decision-rights discipline to joint arrangements and major suppliers."], "evidence": ["Published governance structure and delegation disclosure.", "Decision rights defined in major partner arrangements."], "derived_from": ["GRI-2-2021.2-9", "GRI-2-2021.2-13", "ISO-37000-2021.TRUST"]}], "strength": {"statement": "Every critical outcome has one owner who would name themselves, with the authority to match the accountability.", "protect": ["One accountable owner per outcome. Resist the second 'A'.", "Re-checking authority against accountability after every reorganization."]}, "pillar": "structures"}, {"id": "capability", "name": "Capability, Support & Resources", "definition": "Whether people given accountability have the skills to meet it, whether teams get the resources, information and leadership support to deliver, and whether skill gaps are found early and closed.", "provisions": ["ISO-21502-2020.4.5.4", "GRI-2-2021.2-17", "GRI-2-2021.2-24", "OECD-MNE-2023.DD1", "ISO-26000-2010.CS1", "PMBOK-7.P2"], "questions": [{"id": "Q28", "text": "People assigned accountability have the skills and knowledge required to fulfill it.", "provisions": ["ISO-21502-2020.4.5.4", "GRI-2-2021.2-17"], "mini": true}, {"id": "Q29", "text": "Teams receive the resources, information, and leadership support needed to deliver.", "provisions": ["ISO-21502-2020.4.5.4", "GRI-2-2021.2-24"]}, {"id": "Q30", "text": "Capability gaps are identified early and addressed through training, coaching, or support.", "provisions": ["OECD-MNE-2023.DD1", "GRI-2-2021.2-24"]}], "diagnosis": {"foundational": "People are made accountable without the skills or support to deliver. That is not accountability, it leaves them exposed. It leads to failure and, understandably, to resentment.", "developing": "Skills are checked when people are hired and rarely after. Gaps are found through failure and not ahead of time.", "established": "Competence is confirmed and supported. What is usually missing is at the top: the governing body's own collective knowledge is the least-examined skill in most organizations.", "rolemodel": "Skills are managed actively. The next step is to make sure commitments are backed by the right skills across the whole supply chain, not just in-house."}, "reflection_questions": ["Who is currently accountable for something they have never been trained to do?", "When was the collective knowledge of your governing body last assessed against what the organization now faces?"], "anti_patterns": ["Training treated as the remedy for what is actually a resource or authority problem.", "Sponsors who confirm team competence by assumption rather than by check."], "ladder": [{"stage": 1, "label": "Write it down", "entry_band": "foundational", "moves": ["Before confirming any accountability, check that the person has the skills to carry it out, and record the check.", "For each critical outcome, list the resources and information the owner needs but does not control.", "Fix the most serious mismatch between skills and accountability first, even if that means giving the accountability to someone else."], "evidence": ["Competence confirmation records per accountable owner.", "A resource-gap list per critical outcome."], "derived_from": ["ISO-21502-2020.4.5.4", "ISO-37000-2021.P4"]}, {"stage": 2, "label": "Put it to use", "entry_band": "developing", "moves": ["Review skills on a r function citeRow(ids) {
  return `<div class="cite">` + ids.map(id => {
    const p = prov(id), s = srcOf(id);
    return `<a href="${s.url}" target="_blank" rel="noopener" title="${esc(p.statement)}">${esc(s.id)} &middot; ${esc(p.ref)}</a>`;
  }).join('') + `</div>`;
}

      const pv=prov(id), sr=srcOf(id); return pv?`<a href="${sr.url}" target="_blank" rel="noopener">${esc(sr.id)} &middot; ${esc(pv.ref)}</a>`:''}).join('')}</div>
  </div>`).join('')}
  ${CU.sources.map(s=>`<div class="card"><span class="tier">${s.tier}</span>
    <b style="margin-left:8px"><a class="src" href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a></b>
    <div class="def" style="margin-top:6px">${esc(s.issuer)} &middot; verified: ${esc(s.verified_via)}</div>
    ${s.finding?`<div class="note"><b>Finding.</b> ${esc(s.finding)}</div>`:''}
    ${s.stated_caveat?`<div class="note"><b>Stated caveat.</b> ${esc(s.stated_caveat)}</div>`:''}
    ${s.why_it_matters_here?`<div class="note"><b>Why it matters here.</b> ${esc(s.why_it_matters_here)}</div>`:''}
  </div>`).join('')}`;

// ---------- GEC community tab
if (REPO.community) { const CM = REPO.community;
  document.getElementById('tab-gec').innerHTML = `<h2 class="vh">PMI community recommendations</h2><div class="card">
    <span class="tier">${esc(CM.source.tier)}</span>
    <b style="margin-left:8px">${esc(CM.element.name)}</b>
    <p class="def">${esc(CM.element.what_it_is)}</p>
    <div class="note"><b>Why it is a separate element.</b> ${esc(CM.element.why_it_is_separate)}</div>
    <div class="note"><b>How it is used.</b> ${esc(CM.element.how_it_is_used)}</div>
    <h3>Source</h3><table>
      <tr><td style="width:150px">Issuer</td><td>${esc(CM.source.issuer)}</td></tr>
      <tr><td>Edition</td><td>${esc(CM.source.edition)}</td></tr>
      <tr><td>Verified</td><td>${esc(CM.source.verified_via)} &mdash; ${esc(CM.source.verification_note)}</td></tr>
      <tr><td>Access</td><td>${esc(CM.source.access||'open')} &mdash; ${esc(CM.source.note)}</td></tr>
      <tr><td>Tier ${esc(CM.source.tier)}</td><td>${esc(REPO.tier_definitions[CM.source.tier]||'')}</td></tr>
    </table></div>
  <div class="card"><h3>Across every dimension</h3>
    <ul>${CM.cross_cutting.findings.map(f=>`<li>${esc(f.statement)} <span style="color:var(--mid)">&mdash; ${esc(f.ref)}</span></li>`).join('')}</ul></div>
  ${Object.entries(CM.by_dimension).map(([did,g])=>{ const d=REPO.dimensions.find(x=>x.id===did);
    const col = d ? COL[d.pillar] : 'var(--mid)';
    return `<div class="card" style="border-left:3px solid ${col}">
      <b>${esc(d?d.name:did)}</b>
      <p style="font-weight:600;margin:8px 0 8px">${esc(g.headline)}</p>
      <p class="def" style="margin-top:0">${esc(g.spotlight.practice)}</p>
      <p class="def" style="font-style:italic">&mdash; ${esc(g.spotlight.contributor)}</p>
      <div style="margin-top:var(--s3)">${g.provisions.map(id=>{ const cp=prov(id); if(!cp) return '';
        const rel = cp.relation;
        return `<div class="item">
          ${rel?`<span class="rel rel-${esc(rel)}">${esc(CM.convergence.relations[rel].label)}</span> `:''}
          <b style="font-size:var(--t-sm)">${esc(cp.ref)}</b>
          <p class="def" style="margin:var(--s2) 0 0">${esc(cp.statement||'')}</p>
          ${cp.counterpart&&cp.counterpart.length
            ? `<p class="def" style="margin:var(--s2) 0 0"><b>Against:</b> ${cp.counterpart.map(x=>{
                 const q=prov(x), sr=srcOf(x);
                 return q&&sr?`<a class="src" href="${sr.url}" target="_blank" rel="noopener">${esc(sr.id)} ${esc(q.ref)}</a>`:esc(x);
               }).join(' &middot; ')}</p>`
            : `<p class="def" style="margin:var(--s2) 0 0">No instrument in the corpus addresses this.</p>`}
          ${cp.relation_note?`<p class="def" style="margin:var(--s2) 0 0">${esc(cp.relation_note)}</p>`:''}
        </div>`; }).join('')}</div>
    </div>`}).join('')}`;
}

// ---------- how tab
document.getElementById('tab-how').innerHTML = `<h2 class="vh">How it works</h2><div class="card">
  <h3>The rule that makes this a source of truth</h3>
  <p class="def">A recommendation with an empty <code>derived_from</code> array does not build. <code>build.py</code>
  exits with an error. There is no path by which unsourced advice reaches a customer.</p>
  <h3>What the corpus holds</h3>
  <table>
   <tr><td style="width:130px"><b>Sources</b></td><td>${REPO.stats.sources} instruments, each with issuer, edition, tier, applicability and verification status.</td></tr>
   <tr><td><b>Provisions</b></td><td>${REPO.stats.provisions} atomic citable units. One idea each. ${REPO.stats.provisions_mapped} are mapped to a dimension; the rest mark what the model does not assess.</td></tr>
   <tr><td><b>Crosswalk</b></td><td>Which provisions authorise recommendations for which dimension and which of the 36 questions.</td></tr>
   <tr><td><b>Ladders</b></td><td>${REPO.stats.recommendation_stages} stages, ${REPO.stats.distinct_moves} moves. Four graded stages per dimension: ${MD.steps.names.map(esc).join(' &rarr; ')}.</td></tr>
   <tr><td><b>Jurisdictions</b></td><td>${REPO.stats.regimes} legal regimes across ${REPO.stats.jurisdictions} jurisdictions, each gated so it resolves against a declared profile.</td></tr>
   <tr><td><b>Context</b></td><td>${REPO.stats.cultural_adaptations} cultural adaptations, keyed to four calibration questions rather than to national culture scores.</td></tr>
   <tr><td><b>PMI community</b></td><td>${REPO.stats.community_provisions} provisions and ${REPO.stats.community_spotlights} spotlight practices from the GEC Lisbon tabletop conversations, kept as a distinct element so practitioner experience never borrows the authority of a standard.</td></tr>
  </table>
  <h3>Bands select the entry point, not a separate body of advice</h3>
  <table>${REPO.bands.map(b => `<tr><td class="band" style="width:150px">${esc(b.label)}</td>
    <td style="width:90px;color:var(--mid)">${b.min}&ndash;${b.max}</td>
    <td>enters at stage ${b.entry_stage}, and sees stages ${b.entry_stage} to 4 as a roadmap</td></tr>`).join('')}</table>
  <h3>Version</h3>
  <p class="def"><code>${esc(REPO.version)}</code> &middot; built ${esc(REPO.built)} &middot; ${esc(REPO.model)}.
  Stamp this version into any report you issue, so a past assessment can always be reproduced.</p>
</div>`;

// ---------- tabs
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['dims','src','law','cult','gec','how'].forEach(t => {
    const el = document.getElementById('tab-' + t);
    el.classList.toggle('hide', t !== b.dataset.tab);
    if (t === 'dims' && t === b.dataset.tab) el.style.display = 'grid';
  });
});

render(location.hash.slice(1) || 'vision');
</script></body></html>
