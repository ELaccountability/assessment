k management that contribute to the corporation's sustainability and resilience, with board evaluation of material sustainability risks, coherent lobbying, and externally assured sustainability disclosure.", "new_in_edition": true}, {"id": "ISO-26000-2010.PR1", "source": "ISO-26000-2010", "ref": "Principle 1", "statement": "Accountability — the organization accepts answerability for its impacts on society, the economy and the environment."}, {"id": "ISO-26000-2010.PR2", "source": "ISO-26000-2010", "ref": "Principle 2", "statement": "Transparency — the organization is open about decisions and activities that affect society and the environment."}, {"id": "ISO-26000-2010.PR3", "source": "ISO-26000-2010", "ref": "Principle 3", "statement": "Ethical behaviour."}, {"id": "ISO-26000-2010.PR4", "source": "ISO-26000-2010", "ref": "Principle 4", "statement": "Respect for stakeholder interests."}, {"id": "ISO-26000-2010.CS1", "source": "ISO-26000-2010", "ref": "Core subject 1", "statement": "Organizational governance — the decision-making processes and structures through which all other core subjects are acted on."}, {"id": "AA1000AP-2018.INC", "source": "AA1000AP-2018", "ref": "Principle — Inclusivity", "statement": "People should have a say in the decisions that impact them. Requires a formal governing-body commitment, engagement embedded in strategy, identified stakeholders, and measurement of engagement effectiveness."}, {"id": "AA1000AP-2018.MAT", "source": "AA1000AP-2018", "ref": "Principle — Materiality", "statement": "Decision makers should identify and be clear about the sustainability topics that matter, through a systematic, senior-owned determination process with explicit criteria."}, {"id": "AA1000AP-2018.RES", "source": "AA1000AP-2018", "ref": "Principle — Responsiveness", "statement": "Organizations should act transparently on material sustainability topics and their related impacts, with responses integrated into risk management and strategy, validated with stakeholders, and reported timely."}, {"id": "AA1000AP-2018.IMP", "source": "AA1000AP-2018", "ref": "Principle — Impact", "statement": "Organizations should monitor, measure and be accountable for how their actions affect their broader ecosystems, using credible and replicable metrics covering positive and negative, direct and indirect effects."}, {"id": "GRI-2-2021.2-9", "source": "GRI-2-2021", "ref": "Disclosure 2-9", "statement": "Governance structure and composition."}, {"id": "GRI-2-2021.2-12", "source": "GRI-2-2021", "ref": "Disclosure 2-12", "statement": "Role of the highest governance body in overseeing the management of impacts."}, {"id": "GRI-2-2021.2-13", "source": "GRI-2-2021", "ref": "Disclosure 2-13", "statement": "Delegation of responsibility for managing impacts."}, {"id": "GRI-2-2021.2-15", "source": "GRI-2-2021", "ref": "Disclosure 2-15", "statement": "Conflicts of interest."}, {"id": "GRI-2-2021.2-16", "source": "GRI-2-2021", "ref": "Disclosure 2-16", "statement": "Communication of critical concerns — how concerns are raised to the highest governance body, and how many were raised."}, {"id": "GRI-2-2021.2-17", "source": "GRI-2-2021", "ref": "Disclosure 2-17", "statement": "Collective knowledge of the highest governance body."}, {"id": "GRI-2-2021.2-18", "source": "GRI-2-2021", "ref": "Disclosure 2-18", "statement": "Evaluation of the performance of the highest governance body."}, {"id": "GRI-2-2021.2-19", "source": "GRI-2-2021", "ref": "Disclosure 2-19", "statement": "Remuneration policies."}, {"id": "GRI-2-2021.2-20", "source": "GRI-2-2021", "ref": "Disclosure 2-20", "statement": "Process to determine remuneration."}, {"id": "GRI-2-2021.2-22", "source": "GRI-2-2021", "ref": "Disclosure 2-22", "statement": "Statement on sustainable development strategy."}, {"id": "GRI-2-2021.2-23", "source": "GRI-2-2021", "ref": "Disclosure 2-23", "statement": "Policy commitments."}, {"id": "GRI-2-2021.2-24", "source": "GRI-2-2021", "ref": "Disclosure 2-24", "statement": "Embedding policy commitments throughout activities and business relationships."}, {"id": "GRI-2-2021.2-25", "source": "GRI-2-2021", "ref": "Disclosure 2-25", "statement": "Processes to remediate negative impacts."}, {"id": "GRI-2-2021.2-26", "source": "GRI-2-2021", "ref": "Disclosure 2-26", "statement": "Mechanisms for seeking advice and raising concerns."}, {"id": "GRI-2-2021.2-29", "source": "GRI-2-2021", "ref": "Disclosure 2-29", "statement": "Approach to stakeholder engagement."}, {"id": "UNGP-2011.GP31.a", "source": "UNGP-2011", "ref": "Guiding Principle 31(a)", "statement": "Legitimate — trusted by the stakeholder groups it serves, and accountable for the fair conduct of grievance processes."}, {"id": "UNGP-2011.GP31.b", "source": "UNGP-2011", "ref": "Guiding Principle 31(b)", "statement": "Accessible — known to all intended user groups, with assistance for those facing barriers such as language, literacy, cost, location or fear of reprisal."}, {"id": "UNGP-2011.GP31.c", "source": "UNGP-2011", "ref": "Guiding Principle 31(c)", "statement": "Predictable — a clear known procedure with an indicative timeframe for each stage."}, {"id": "UNGP-2011.GP31.d", "source": "UNGP-2011", "ref": "Guiding Principle 31(d)", "statement": "Equitable — aggrieved parties have reasonable access to the information, advice and expertise needed to engage on fair terms."}, {"id": "UNGP-2011.GP31.e", "source": "UNGP-2011", "ref": "Guiding Principle 31(e)", "statement": "Transparent — parties to a grievance are kept informed of its progress, and enough information about the mechanism's performance is provided to build confidence in its effectiveness and to meet any public interest at stake."}, {"id": "UNGP-2011.GP31.f", "source": "UNGP-2011", "ref": "Guiding Principle 31(f)", "statement": "Rights-compatible — outcomes and remedies accord with internationally recognised human rights."}, {"id": "UNGP-2011.GP31.g", "source": "UNGP-2011", "ref": "Guiding Principle 31(g)", "statement": "A source of continuous learning — patterns are analysed to identify lessons and prevent future harm."}, {"id": "UNGP-2011.GP31.h", "source": "UNGP-2011", "ref": "Guiding Principle 31(h)", "statement": "Based on engagement and dialogue — stakeholder groups participate in design and performance review, and dialogue is the route to resolution."}, {"id": "UNGPRF-2015.A", "source": "UNGPRF-2015", "ref": "Part A — Governance of respect", "statement": "How the organization publicly commits, and how that commitment is embedded in governance and daily decision-making."}, {"id": "UNGPRF-2015.B", "source": "UNGPRF-2015", "ref": "Part B — Defining the focus of reporting", "statement": "Identify the salient issues — the most severe potential impacts — and report against those rather than everything."}, {"id": "UNGPRF-2015.C", "source": "UNGPRF-2015", "ref": "Part C — Management of salient issues", "statement": "For each salient issue: policy, engagement, impact assessment, integration, tracking and remediation."}, {"id": "ISO-37002-2021.TRUST", "source": "ISO-37002-2021", "ref": "Guiding principle — Trust", "statement": "Create conditions in which people believe reporting is safe and worthwhile."}, {"id": "ISO-37002-2021.IMP", "source": "ISO-37002-2021", "ref": "Guiding principle — Impartiality", "statement": "Reports are handled without bias, with conflicts of interest managed."}, {"id": "ISO-37002-2021.PROT", "source": "ISO-37002-2021", "ref": "Guiding principle — Protection", "statement": "Reporters and others involved are protected from detrimental treatment and retaliation."}, {"id": "ISO-21502-2020.4.5", "source": "ISO-21502-2020", "ref": "Clause 4.5 — Project organization and roles", "statement": "Project roles, their boundaries and the authority delegated to each are defined as part of the project organization."}, {"id": "ISO-21502-2020.4.5.4", "source": "ISO-21502-2020", "ref": "Clause 4.5.4 — Project sponsor", "statement": "The sponsor holds overall accountability to a higher authority for objectives, outputs, outcomes and benefits; owns the business case; confirms team competence; decides within delegated authority; escalates beyond it; and sets cultural and ethical standards for the project."}, {"id": "GS-CSO.C8", "source": "GS-CSO", "ref": "Commitment 8", "statement": "Be transparent about who we are, what we do, and our successes and failures."}, {"id": "GS-CSO.C10", "source": "GS-CSO", "ref": "Commitment 10", "statement": "Handle resources responsibly to reach our goals and serve the public good."}, {"id": "GS-CSO.C11", "source": "GS-CSO", "ref": "Commitment 11", "statement": "Ensure decisions are responsive to feedback from the people affected by our work, partners, volunteers and staff."}, {"id": "GS-CSO.C12", "source": "GS-CSO", "ref": "Commitment 12", "statement": "Ensure our management and governing body are accountable."}, {"id": "ESRS-G1.G1-1", "source": "ESRS-G1", "ref": "Disclosure Requirement G1-1", "statement": "Business conduct policies and corporate culture, including mechanisms for reporting ethical concerns and how reports are handled."}, {"id": "ESRS-G1.G1-3", "source": "ESRS-G1", "ref": "Disclosure Requirement G1-3", "statement": "Prevention and detection of corruption and bribery, including training and confirmed incidents during the reporting period."}, {"id": "ESRS-G1.G1-6", "source": "ESRS-G1", "ref": "Disclosure Requirement G1-6", "statement": "Payment practices, including average payment terms and the proportion of payments made beyond agreed terms."}, {"id": "PMBOK-7.P1", "source": "PMBOK-7", "ref": "Principle 1 — Stewardship", "statement": "Be a diligent, respectful and caring steward."}, {"id": "PMBOK-7.P2", "source": "PMBOK-7", "ref": "Principle 2 — Team", "statement": "Build a culture of accountability and respect within the project team."}, {"id": "PMBOK-7.P3", "source": "PMBOK-7", "ref": "Principle 3 — Stakeholders", "statement": "Engage stakeholders effectively, inclusively and transparently."}, {"id": "PMBOK-7.P4", "source": "PMBOK-7", "ref": "Principle 4 — Value", "statement": "Focus on value as the ultimate indicator of success."}, {"id": "PMBOK-7.P6", "source": "PMBOK-7", "ref": "Principle 6 — Leadership", "statement": "Demonstrate leadership behaviours regardless of formal role."}, {"id": "PMBOK-7.P10", "source": "PMBOK-7", "ref": "Principle 10 — Risk", "statement": "Optimise risk responses; anticipate rather than react."}, {"id": "PMBOK-7.P11", "source": "PMBOK-7", "ref": "Principle 11 — Adaptability and resilience", "statement": "Build adaptability and resilience into the way work is organised."}, {"id": "EDMONDSON-1999.PS", "source": "EDMONDSON-1999", "ref": "Core finding", "statement": "Team psychological safety — a shared belief that the team is safe for interpersonal risk-taking — predicts learning behaviour, which in turn predicts team performance. It is a team-level, not an individual-level, property."}, {"id": "REASON-1997.SUB", "source": "REASON-1997", "ref": "Substitution test: would a peer have done the same?", "statement": "The substitution test is the last of four sequential tests in the culpability decision tree, after deliberate harm, incapacity and foresight: only once those are cleared, ask whether a similarly qualified peer in the same circumstances would likely have acted the same way. If yes, the cause is systemic rather than personal."}, {"id": "REASON-1997.TREE", "source": "REASON-1997", "ref": "Culpability decision tree: four checks before blame", "statement": "Separate honest error, at-risk behaviour and reckless or knowing violation before deciding on a response, so that the response is proportionate and consistent."}, {"id": "GRI-2-2021.2-21", "source": "GRI-2-2021", "ref": "Disclosure 2-21", "statement": "Annual total compensation ratio — the ratio of the highest-paid individual's total compensation to the median, and the ratio of the percentage increase in each."}, {"id": "PMI-GEC-LISBON-2026.SHARED-MEANING", "ref": "Anna & JP, main point 1", "statement": "Accountability means different things to different people. The starting point is defining what it means, clarifying expectations and setting ground rules — and educating sponsors and leaders on what they themselves are accountable for.", "relation": "extends", "counterpart": [], "relation_note": "No instrument in the corpus treats 'accountability' as a contested word that an organization must first agree on.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.THRESHOLDS", "ref": "Carolyn & Martina, setting expectations and vision", "statement": "Align accountability thresholds: a clear, consistent, organization-wide understanding of what constitutes accountability and the standards expected.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P4", "ISO-37000-2021.P3"], "relation_note": "Turns the principle into an organization-wide agreed threshold rather than a definition on paper.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.TOR", "ref": "Ritesh, question 1 — clarity of roles", "statement": "Provide Terms of Reference at the start of every assignment. It is routinely treated as a nice-to-have and skipped, which erodes accountability over time.", "relation": "operationalises", "counterpart": ["ISO-21502-2020.4.5"], "relation_note": "Names the artifact the clause implies: a written Terms of Reference at every assignment start.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.THREE-LAYERS", "ref": "Ritesh, question 1 — accountability across all levels", "statement": "Define accountability at three distinct levels — individual PM, PMO, senior leadership — cascading coherently from leadership's long-term vision, rather than reducing it to a box on an org chart.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P4", "GRI-2-2021.2-13"], "relation_note": "Gives the delegation chain three concrete tiers — individual, PMO, leadership.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.VISION-BUYIN", "ref": "Carolyn & Martina, setting expectations and vision", "statement": "Drive purpose by communicating vision and mission through leadership engagement, change management, internal channels and events — not by publishing the statement.", "relation": "challenges", "counterpart": ["GRI-2-2021.2-22"], "relation_note": "A published strategy statement is not communication; the table says buy-in comes from engagement, not disclosure.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.AUTHORITY-CHAIN", "ref": "Misbah, key takeaway 3", "statement": "Authority, autonomy and accountability must function as a connected chain. Autonomy without accountability, or accountability without authority, breaks the system.", "relation": "corroborates", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Practitioners reached ISO 37000's definition from experience: authority and accountability are one chain.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.CALIBRATED-TRUST", "ref": "Ritesh, question 1 — trust and its limits", "statement": "Verification should be proportional to decision severity. High stakes warrant closer oversight; routine work should default to autonomy. Uniform 'trust but verify' reads as distrust and erodes the empowerment that drives performance.", "relation": "extends", "counterpart": [], "relation_note": "No standard scales verification to the stakes of the decision; the corpus treats oversight as uniform.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.EMPOWER-SOLUTIONS", "ref": "Carolyn & Martina, culture of trust, autonomy and ownership", "statement": "Leaders should empower teams to devise their own action plans and solutions rather than dictating them.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Delegation means the team writes the plan, not that it executes someone else's.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.EMPOWERMENT-TRADEOFF", "ref": "Ritesh, question 1 — balancing accountability with empowerment", "statement": "You cannot hold a team rigidly accountable for every micro-decision if you have genuinely empowered them to operate autonomously. Managers must accept that trade-off.", "relation": "challenges", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Genuine delegation limits what you may hold someone to — a trade-off the principle does not acknowledge.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.ACCOUNTABILITY-PARTNERS", "ref": "Carolyn & Martina, culture of trust, autonomy and ownership", "statement": "Accountability partners: individuals share plans and progress with a peer before completion, creating mutual commitment to finishing.", "relation": "extends", "counterpart": [], "relation_note": "Peer-to-peer commitment before completion has no analogue in any instrument.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.TRUTHFUL-REPORTING", "ref": "Cecilia, question 2 — transparency and truthful reporting", "statement": "Accountability includes reporting what is really happening, making issues visible, and ensuring the right stakeholders know when something is off track. An accountable person should never assume someone else has escalated.", "relation": "operationalises", "counterpart": ["ISO-26000-2010.PR2", "GRI-2-2021.2-16"], "relation_note": "Adds the duty not to assume someone else escalated.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.VISIBLE-ACCOUNTABILITY", "ref": "Misbah, key takeaway 2; Ritesh, key findings — transparency", "statement": "Visible accountability: when people can see who is accountable for what, cross-functional ownership and partnership improve. Lack of visibility into roles, responsibilities and ownership was the most cited barrier across the organizations surveyed.", "relation": "corroborates", "counterpart": ["ISO-37000-2021.P4", "ISO-26000-2010.PR2"], "relation_note": "Independently names invisible ownership as the most cited barrier across the organizations in the room.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.NO-WHISPER", "ref": "Yasser, communication strategy and ways of working", "statement": "Address problems directly within the team rather than whispering to neighbours. Lengthy emails leave room to misread tone and can serve as a shield to pass off accountability — 'well, I sent the email'. Quick direct conversations resolve issues better.", "relation": "extends", "counterpart": [], "relation_note": "No standard governs channel choice; the table found email itself becomes a shield against accountability.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.COLLAB-PROBLEM-SOLVING", "ref": "Carolyn & Martina, transparency and collaboration", "statement": "Leaders should facilitate collaboration, prompting teams to resolve issues locally before escalation. This avoids finger-pointing and builds collective responsibility.", "relation": "operationalises", "counterpart": ["GRI-2-2021.2-16"], "relation_note": "Resolve locally first, so escalation carries signal rather than blame.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.WASTEFUL-COMPETITION", "ref": "Ritesh, key findings — low accountability", "statement": "Without clear ownership teams compete instead of partnering, duplicating resources, time and spend.", "relation": "corroborates", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Supplies the cost case for clear ownership: without it teams duplicate rather than partner.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.MODEL-FROM-TOP", "ref": "Yasser, cultivating psychological safety and culture", "statement": "Accountability must be modeled by executives. Where leadership does not practice what it preaches or stays unapproachable, employees hide mistakes rather than bring them forward, producing worse delays and overruns.", "relation": "corroborates", "counterpart": ["ISO-37000-2021.P7"], "relation_note": "Leadership behavior as a governance instrument, reached from practice.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.FAILURE-DAY", "ref": "Carolyn & Martina, transparency and collaboration", "statement": "Normalize learning from failure with rituals where leaders share their own mistakes first — a practice the table described as a NASA-inspired 'failure day' in which a document passes from top leaders downward and each person adds their own failures, showing that senior people failed too and still got there.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P7"], "relation_note": "A repeatable ritual that makes the leadership principle observable.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.OPEN-HONEST-CHARTER", "ref": "Yasser, making the implicit explicit", "statement": "An 'Open and Honest Charter': a tangible one-page values statement signed by leadership, setting bidirectional behavioral expectations, with teams recognized and rewarded for shifting toward those behaviors.", "relation": "operationalises", "counterpart": ["ESRS-G1.G1-1"], "relation_note": "A one-page signed artifact where the standard asks only for a policy and a culture.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.ASSUME-POSITIVE-INTENT", "ref": "Yasser, communication strategy and ways of working", "statement": "Assume positive intent: pause before reacting to bad news and ask curious questions — 'what was your thought process here?' — rather than assigning blame.", "relation": "extends", "counterpart": [], "relation_note": "A conversational rule for receiving bad news; no instrument reaches this level.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.VISIBLE-PRESENCE", "ref": "Carolyn & Martina, empowering PMs", "statement": "Leaders should be actively present and engaged, particularly in remote or digital environments, to foster connection and demonstrate commitment to accountability.", "relation": "extends", "counterpart": [], "relation_note": "Remote and digital presence as an accountability condition is absent from the corpus.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.BE-BRAVE", "ref": "Inês, summary", "statement": "Accountability starts with the courage to step up, make decisions and own the outcome — while not becoming an excuse for carelessness or poor preparation. The point is not to celebrate mistakes but to create an environment where people are willing to act, learn and improve.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P9"], "relation_note": "Governed risk-taking expressed as individual courage, bounded against carelessness.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.FEAR-BLOCKS", "ref": "Anna & JP, main point 3", "statement": "People avoid accountability because they fear blame or punishment. Fear prevents escalation and people hide problems instead of raising them. The focus should be on fixing the process, not blaming individuals.", "relation": "corroborates", "counterpart": ["EDMONDSON-1999.PS"], "relation_note": "Arrives at the psychological safety finding without citing it.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.FEARLESSNESS", "ref": "Cecilia, question 1", "statement": "Accountability only works when people feel safe enough to admit mistakes, own consequences, speak honestly and raise concerns early — balanced by being responsible enough to own the outcome, so that it does not become 'anything goes'.", "relation": "corroborates", "counterpart": ["EDMONDSON-1999.PS", "ISO-37002-2021.TRUST"], "relation_note": "Adds the balance condition: safe to speak, still responsible for the outcome.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.SHADOW-COMMITTEE", "ref": "Carolyn & Martina, psychological safety", "statement": "Informal 'shadow steering committees' or peer discussion forums where people can discuss accountability challenges and concerns openly with peers without pressure, countering the loneliness of carrying a difficult accountability decision alone.", "relation": "operationalises", "counterpart": ["GRI-2-2021.2-26"], "relation_note": "A named forum answering a problem the standard does not diagnose: isolation, not ignorance.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.BOTTOM-UP-HARDER", "ref": "Ritesh, question 2 — culture and the bottom-up challenge", "statement": "Accountability flows naturally top-down but is much harder to enforce bottom-up. People are reluctant to hold a superior accountable even when it is warranted, and that reluctance is a significant barrier.", "relation": "extends", "counterpart": [], "relation_note": "The directional asymmetry of accountability is in no instrument in the corpus.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.PROGRESS-OVER-PERFECTION", "ref": "Yasser, cultivating psychological safety and culture", "statement": "Consistent bi-weekly sessions where teams openly share past mistakes help normalize failure as part of learning rather than a negative mark.", "relation": "operationalises", "counterpart": ["EDMONDSON-1999.PS"], "relation_note": "A cadence — bi-weekly mistake sharing — for a construct the research only measures.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.LESSONS-IMPLEMENTED", "ref": "Carolyn & Martina, learning mindset", "statement": "Move beyond identifying 'lessons learned' to 'lessons implemented'.", "relation": "operationalises", "counterpart": ["OECD-MNE-2023.DD4"], "relation_note": "Renames the artifact so that tracking implementation becomes the test.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.CROSS-FUNCTIONAL-LESSONS", "ref": "Ritesh, question 2 — lessons learned; Cecilia, question 2", "statement": "Cross-functional sharing of failures is a major gap: a safety failure never reaches the finance team facing the same issue, and teams in separate programs recycle the same failures in silos. Lessons should run through the lifecycle, not only at close-out, and in an environment of psychological safety.", "relation": "operationalises", "counterpart": ["UNGP-2011.GP31.g"], "relation_note": "Names the failure mode the criterion leaves implicit: lessons that never cross a function.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.SAFETY-TEAM-PRACTICE", "ref": "Carolyn & Martina, learning mindset; Cecilia, question 2", "statement": "Replicate the systematic, rigorous accountability processes used by safety-critical teams, whose focus is already accountability.", "relation": "extends", "counterpart": [], "relation_note": "Borrowing wholesale from safety-critical practice is a move no instrument suggests.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.LEARNING-NOT-ENOUGH", "ref": "Cecilia, fit into the Lisbon Bridge Model", "statement": "A learning mindset is necessary but not sufficient. If everything is framed only as learning, serious failures get softened and the system fails to act where stronger accountability is needed.", "relation": "challenges", "counterpart": ["REASON-1997.TREE"], "relation_note": "Pushes back on a learning-only reading: some failures need consequences, or the system never acts.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.FEEDBACK-TIMING", "ref": "Anna & JP, main point 7", "statement": "Feedback should be honest and timely; timing matters when emotions are high; anonymous or structured feedback may help in sensitive situations; feedback can be registered and followed up with action plans.", "relation": "operationalises", "counterpart": ["AA1000AP-2018.RES"], "relation_note": "Adds timing, anonymity in sensitive cases, and follow-up action plans.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.REALTIME-IDEAS", "ref": "Carolyn & Martina, promoting innovation", "statement": "Simple structured mechanisms to capture ideas and suggestions in real time at the point of work — one company places cards beside operational tasks so operators can write suggestions as they occur — embedding innovation into everyday work.", "relation": "extends", "counterpart": [], "relation_note": "Capturing suggestions at the point of work has no counterpart in the corpus.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.EXPLAIN-DECISIONS", "ref": "Anna & JP, main point 8", "statement": "Not every suggestion can be implemented, so leaders should explain clearly why a decision was made.", "relation": "operationalises", "counterpart": ["UNGP-2011.GP31.h"], "relation_note": "Closes the dialogue loop where a suggestion is declined.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.KAIZEN", "ref": "Anna & JP, main point 8", "statement": "Kaizen-style improvement sessions give team members a voice, alongside regular meetings that track actions, decisions and risks.", "relation": "operationalises", "counterpart": ["AA1000AP-2018.INC"], "relation_note": "A forum through which inclusivity actually reaches the people doing the work.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.TEAM-SOLVES", "ref": "Carolyn & Martina, notes", "statement": "Promote the team to work together and reach a solution themselves; gaps get filled by the team figuring it out together.", "relation": "extends", "counterpart": [], "relation_note": "Letting the team reach its own solution is a leadership restraint no standard asks for.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.ACCOUNTABILITY-MATRIX", "ref": "Cecilia, question 2 — accountability matrix", "statement": "An accountability matrix applied after incidents or quality issues: investigate what happened; determine whether it came from a human behavior issue, a knowledge or training issue, or a process or system issue; respond accordingly with coaching, training, process correction, or stronger consequences in cases of negligence. It exists to avoid jumping to blame.", "relation": "operationalises", "counterpart": ["REASON-1997.TREE"], "relation_note": "The clearest operationalization in the layer: the culpability model as an after-incident procedure.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.NOT-ALL-FAILURES", "ref": "Cecilia, summary point 5", "statement": "Not all failures should be handled the same way. Some require coaching and learning, some process change, some formal investigation, and some real consequences.", "relation": "corroborates", "counterpart": ["REASON-1997.TREE"], "relation_note": "Reproduces the culpability distinction from field experience.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.SAFETY-OVERRIDES", "ref": "Cecilia, question 2 — safety-critical accountability", "statement": "Safety must override schedule pressure. Organizations have paused programs, stopped work, sent teams home and launched investigations after near misses — accountability applied visibly and consistently. Where schedule pressure dominates, incidents and near misses go unreported.", "relation": "extends", "counterpart": [], "relation_note": "Stop-work authority and safety over schedule are absent from the corpus.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.ACT-UNDER-UNCERTAINTY", "ref": "Inês, summary", "statement": "The most successful managers decide without complete certainty, using judgment and taking calculated risks. Fear of getting it wrong should not stop thoughtful action, and people should not wait to be told what to do every time a challenge arises.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P8"], "relation_note": "Decision-making under incomplete information, as a management expectation.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.INVESTIGATE-FIRST", "ref": "Cecilia, question 2 — investigation before action", "statement": "Investigate what went wrong, understand root cause, and distinguish human from process failure before deciding what accountability action is appropriate.", "relation": "corroborates", "counterpart": ["REASON-1997.SUB"], "relation_note": "Root cause before attribution, reached independently.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.SINGLE-OWNER", "ref": "Misbah, key takeaway 1", "statement": "Shared accountability risks becoming no accountability. When responsibility is distributed too broadly ownership becomes diffuse; clear assignment of who is ultimately accountable remains essential even in collaborative models.", "relation": "corroborates", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "The sharpest restatement of the keystone: shared accountability risks becoming none.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.UPFRONT-ALLOCATION", "ref": "Yasser, operational hurdles", "statement": "Assign a specific owner to every single piece of a project's scope at the very beginning.", "relation": "operationalises", "counterpart": ["ISO-21502-2020.4.5"], "relation_note": "Every piece of scope gets an owner at the start, not when it fails.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.RACI-ALIGNMENT", "ref": "Matt, key takeaways; Yasser, operational hurdles", "statement": "Complete a RACI at project start and align on it at kickoff. In consultancy and multi-project environments the front-end commercial team, the client, the supplier and the back-end delivery team routinely interpret the same matrix differently.", "relation": "extends", "counterpart": [], "relation_note": "No instrument addresses the same matrix being read differently by client, supplier and delivery.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.LAYERS", "ref": "Cecilia, question 1", "statement": "Everyone is accountable for something, but no one is accountable for everything. Those layers have to be really clear.", "relation": "corroborates", "counterpart": ["GRI-2-2021.2-13"], "relation_note": "Delegation as tiers: everyone accountable for something, nobody for everything.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.NO-TRANSFER", "ref": "Misbah, key takeaway 6", "statement": "Accountability does not transfer during absences. The original accountable person retains ownership; teams create coverage through dynamic support rather than by formally reassigning accountability.", "relation": "extends", "counterpart": [], "relation_note": "What happens to accountability during an absence is in no instrument.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.REEVALUATE", "ref": "Yasser, adapting to change", "statement": "Accountability is not static. As long programs evolve — shifting from a business focus to a product focus over three or four years — leadership roles and ownership matrices must be re-evaluated, or stakeholders disengage.", "relation": "extends", "counterpart": [], "relation_note": "Ownership as a living artifact that decays over a multi-year program.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.REPORTING-LINES", "ref": "Matt, key takeaways", "statement": "Reporting lines must always be clear in case of issues, which is hard when team members report to functional managers rather than to the project manager.", "relation": "operationalises", "counterpart": ["ISO-21502-2020.4.5"], "relation_note": "Names the matrix problem the clause assumes away.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.RIGHT-PEOPLE", "ref": "Matt, key takeaways", "statement": "You cannot hold people accountable if they are not able to do the job. Right people in the right role, with the correct training in place — is the company setting people up to be accountable?", "relation": "corroborates", "counterpart": ["ISO-21502-2020.4.5.4"], "relation_note": "The sponsor's duty to confirm competence, stated as a precondition for holding anyone to anything.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.SKILL-MAP", "ref": "Matt, key takeaways", "statement": "Create a skill map at project start-up to identify where people have the skill sets that make accountability possible.", "relation": "operationalises", "counterpart": ["ISO-21502-2020.4.5.4"], "relation_note": "An artifact for the competence check the clause requires.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.NETWORKS", "ref": "Anna & JP, main point 6", "statement": "Project and portfolio managers rarely solve every problem themselves. Accountability becomes easier when people know who can help; strong internal networks reduce the weight of accountability.", "relation": "extends", "counterpart": [], "relation_note": "Relationships as a load-bearing accountability asset appear in no instrument.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.SUPPORTED-NOT-ALONE", "ref": "Cecilia, question 1", "statement": "The accountable person may be the point of contact but still needs an empowered team behind them. Accountability should be supported by the team, not carried alone.", "relation": "challenges", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Single ownership can read as sole carriage; the table insists the owner still needs a team.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.CAPABILITY-GAPS", "ref": "Misbah, key takeaway 8", "statement": "Capability gaps, multi-layered structures and shifting organizational contexts make accountability hard to sustain; external resources and strong leadership sponsorship are often needed.", "relation": "extends", "counterpart": [], "relation_note": "The sustainability of accountability under capability constraint is unaddressed in the corpus.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.WEEKLY-BACKBONE", "ref": "Ritesh, question 2 — weekly reporting", "statement": "Weekly executive summary reports with red/amber/green indicators are the primary accountability mechanism across most participating organizations, creating a time-stamped record of project health. If a project suddenly deteriorates with no prior warning flags, that reflects on the PM — signalling hidden problems or lack of awareness.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P5"], "relation_note": "What oversight looks like weekly, with deterioration-without-warning as the tell.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.FOLLOW-THROUGH", "ref": "Ritesh, question 2 — weekly reporting", "statement": "A weekly report was periodically moved so that executives could not reach it automatically, and nobody noticed or pushed back. That absence of follow-through is itself an accountability failure.", "relation": "challenges", "counterpart": ["ISO-37000-2021.P5"], "relation_note": "Oversight that does not notice its own absence is not oversight — the story proves the gap.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.HANDOVER", "ref": "Matt, key takeaways", "statement": "When a project is handed from one PM to another, a consistent handover is needed for the next PM to be accountable at all.", "relation": "extends", "counterpart": [], "relation_note": "Continuity between successive accountable people is not addressed anywhere in the corpus.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.URGENT-INFORMAL", "ref": "Anna & JP, main point 8", "statement": "Weekly meetings track actions, decisions and risks, but urgent issues also need informal channels.", "relation": "extends", "counterpart": [], "relation_note": "The informal channel alongside the routine has no standard analogue.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.AI-HUMAN-IN-LOOP", "ref": "Ritesh, AI and the future of accountability", "statement": "If AI generates the report and AI provides the feedback, the human connection is lost entirely. The value of a project manager is in the conversations, judgment and decisions technology cannot replicate. AI should augment accountability frameworks with a human in the loop at critical decision points — PMs submit, AI analyses and flags patterns, the PM interprets and acts.", "relation": "extends", "counterpart": [], "relation_note": "The newest material in the repository, and the only forward-looking item: no instrument contemplates AI in the accountability loop.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.PEER-ACCOUNTABILITY", "ref": "Matt, key takeaways", "statement": "Peer-to-peer accountability defined by a social contract shares the load across the team, but a single point of contact for escalation is still needed.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Distributed load with a single escalation point preserved.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.INCENTIVES-OVER-REPERCUSSIONS", "ref": "Ritesh, question 2 — incentives over repercussions", "statement": "Promoting accountability works better through a targeted incentive-based approach than through punishment. The critical foundation is goal clarity in a common language.", "relation": "corroborates", "counterpart": ["OECD-CG-2023.VI"], "relation_note": "Incentivizing the behavior, reached independently of the 2023 revision.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.RECOGNISE-OWNERSHIP", "ref": "Anna & JP, main point 9; JP notes", "statement": "Recognition should include taking responsibility and ownership, not only successful results.", "relation": "operationalises", "counterpart": ["OECD-CG-2023.VI"], "relation_note": "Makes the incentive attach to taking responsibility, not only to the result.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.CALIBRATED-RECOGNITION", "ref": "Ritesh, question 2 — recognition", "statement": "Recognition need not be financial — acknowledging a milestone, a thank-you email or a personal phone call can be equally powerful. But over-praising people for doing their basic job drains recognition of meaning. Calibrate it to the level of impact.", "relation": "extends", "counterpart": [], "relation_note": "Recognition saturation — praise for the basic job draining the currency — is in no instrument.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.VISIBILITY-MOTIVATES", "ref": "Anna & JP, main point 9", "statement": "People become more accountable when given visibility and exposure. Team members rather than only project managers should present updates, including junior employees presenting to leadership or customers — it helps people feel connected to outcomes.", "relation": "extends", "counterpart": [], "relation_note": "Exposure as a motivator, including juniors presenting upward, is absent from the corpus.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.RECOGNITION-PROGRAMMES", "ref": "Carolyn & Martina, rewards and incentives", "statement": "Formal and informal recognition initiatives such as 'hero of the month' awards, celebrating successes and reinforcing desired behaviors; sharing small success stories with small trophies.", "relation": "operationalises", "counterpart": ["OECD-CG-2023.VI"], "relation_note": "Named schemes through which the incentive becomes visible.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.ELEPHANT-AWARD", "ref": "Cecilia, question 1 — practical examples", "statement": "An 'elephant in the room award': peer recognition given to people willing to name difficult issues others were avoiding, used as positive informal reinforcement of courage and openness.", "relation": "extends", "counterpart": [], "relation_note": "Peer recognition for naming what others avoid rewards the behavior accountability depends on.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.POLICIES-NOT-ENOUGH", "ref": "Misbah, key takeaway 5", "statement": "Written policies alone are insufficient. Accountability frameworks require active recognition, political support and cultural reinforcement to take hold.", "relation": "challenges", "counterpart": ["ESRS-G1.G1-1"], "relation_note": "A disclosed policy is not a working system without recognition and political backing.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}, {"id": "PMI-GEC-LISBON-2026.HIGHER-ROLES", "ref": "Carolyn & Martina, notes", "statement": "Accountability can be promoted by opening opportunities for higher roles to those who take it on.", "relation": "extends", "counterpart": [], "relation_note": "Advancement as a form of recognition for taking accountability is unaddressed.", "source": "PMI-GEC-LISBON-2026", "layer": "community"}], "dimensions": [{"id": "vision", "name": "Vision & Expectations", "definition": "Whether people share one view of what success means, what cannot be traded away, and how their own work connects to it, especially after priorities change.", "provisions": ["ISO-37000-2021.P1", "ISO-37000-2021.P2", "ISO-37000-2021.P3", "PMBOK-7.P4", "GRI-2-2021.2-22", "AA1000AP-2018.MAT", "ISO-21502-2020.4.5.4"], "questions": [{"id": "Q01", "text": "People understand how their work contributes to the value and outcomes the organization seeks to deliver.", "provisions": ["ISO-37000-2021.P2", "PMBOK-7.P4"]}, {"id": "Q02", "text": "Expected outcomes, priorities, and standards of accountability are clearly communicated.", "provisions": ["ISO-37000-2021.P3", "GRI-2-2021.2-23"], "mini": true}, {"id": "Q03", "text": "When priorities change, leaders clarify what must change and what remains non-negotiable.", "provisions": ["ISO-37000-2021.P3", "ISO-21502-2020.4.5.4", "PMBOK-7.P11"]}], "diagnosis": {"foundational": "Goals are written down, but people do not share one meaning of them. Different teams probably work toward different ideas of success, and nobody has noticed because the disagreement never comes up.", "developing": "People near the top understand the direction, and that understanding fades with distance. It usually breaks when priorities change: the new one is announced, the old one is never formally dropped, and both stay on the list.", "established": "Expectations hold up in normal conditions. What is usually missing is a way to check: people can state the goal but cannot say what would show it has been met.", "rolemodel": "Shared understanding survives a change of priorities. The risk now is drift. The goal is stated so well that nobody checks whether it is still true."}, "reflection_questions": ["Where do expectations become open to more than one honest interpretation?", "When priorities last changed, what was explicitly declared non-negotiable — and who heard it?"], "anti_patterns": ["A strategy document that no operational decision has ever been traced back to.", "Priorities that are added but never subtracted, so the real priority becomes whatever was mentioned most recently."], "ladder": [{"stage": 1, "label": "Write it down", "entry_band": "foundational", "moves": ["Write each critical outcome down with four things: the outcome, who owns it, how success will be judged, and the evidence that will show it is done.", "Test understanding sideways, not downwards. Ask two teams that depend on each other to state the same goal separately, then compare their answers.", "Write down the three things that do not change, whatever the pressure."], "evidence": ["A one-page outcome definition per critical outcome, with owner and success criteria.", "A record of the comprehension check and what it revealed."], "derived_from": ["ISO-37000-2021.P3", "PMBOK-7.P4"]}, {"stage": 2, "label": "Put it to use", "entry_band": "developing", "moves": ["Make a priority change trigger a restatement: what changed, what did not, and what is now lower priority.", "Attach the accountability to the outcome and not to the role, so it survives a reorganization.", "Report against the success criteria you published, including where they were not met."], "evidence": ["Change notices that state what was deprioritized, not only what was added.", "Periodic reporting mapped to the published success criteria."], "derived_from": ["ISO-37000-2021.P3", "ISO-21502-2020.4.5.4", "GRI-2-2021.2-22"]}, {"stage": 3, "label": "Verify it", "entry_band": "established", "moves": ["Review what really matters to the organization, using stated criteria and senior ownership. Do not just carry over last year's priority list.", "Ask someone who is not part of delivery to check whether the stated priorities match where budget, staff and leadership attention actually went.", "Report publicly on last period's commitments before setting new ones."], "evidence": ["A variance review comparing stated priorities against actual resource allocation.", "A documented materiality or priority-determination process with named criteria and owner."], "derived_from": ["AA1000AP-2018.MAT", "ISO-37000-2021.P5"]}, {"stage": 4, "label": "Show it", "entry_band": "rolemodel", "moves": ["Publish the outcomes and the standard of evidence outside the organization, so people there can test what success means.", "Have the way you set priorities reviewed from outside, at regular intervals.", "Teach the method to partners and suppliers, so shared outcomes are defined the same way along the supply chain."], "evidence": ["Externally published outcome and success-criteria set.", "External review or assurance of the priority-determination process."], "derived_from": ["OECD-MNE-2023.III", "AA1000AP-2018.RES", "OECD-CG-2023.IV"]}], "strength": {"statement": "People can state the goal and what would count as having met it, and that survives a change in priorities.", "protect": ["The discipline of formally retiring a priority when a new one is added.", "Testing understanding sideways between dependent functions, not only cascading it downwards."]}, "pillar": "environment"}, {"id": "trust", "name": "Trust, Autonomy & Ownership", "definition": "Whether people are given real room to decide within clear limits, take ownership of results and not only tasks, and are backed when a well-made decision turns out badly.", "provisions": ["ISO-37000-2021.P4", "ISO-37000-2021.P9", "ISO-21502-2020.4.5", "PMBOK-7.P2", "OECD-CG-2023.V"], "questions": [{"id": "Q04", "text": "People are trusted to make decisions within clearly defined boundaries.", "provisions": ["ISO-37000-2021.P4", "ISO-21502-2020.4.5"], "mini": true}, {"id": "Q05", "text": "Individuals take ownership of outcomes rather than limiting responsibility to assigned tasks.", "provisions": ["ISO-37000-2021.P4", "PMBOK-7.P2"]}, {"id": "Q06", "text": "Leaders support responsible decisions even when the result differs from what was expected.", "provisions": ["REASON-1997.SUB", "ISO-37000-2021.P9"]}], "diagnosis": {"foundational": "Responsibility and authority have come apart. People are held answerable for results they had no power to decide, so they follow instructions and stop taking ownership.", "developing": "The limits exist, but people learn them by crossing them, not by being told. Delegation is real until something goes wrong, and then it is quietly taken back.", "established": "Delegation holds. The next test is a good decision with a bad outcome: do leaders defend the way the decision was made, or only judge the result?", "rolemodel": "People have real autonomy, and it survives failure. Watch for the opposite risk: delegation without the oversight that ISO 37000 says should go with it."}, "reflection_questions": ["What is the largest decision a person two levels down can make without seeking approval — and do they know that number?", "The last time a well-reasoned decision produced a bad result, what happened to the person who made it?"], "anti_patterns": ["Delegated authority that is retracted informally after the first bad outcome, without ever being formally changed.", "'Ownership' language used where the owner controls neither budget, sequencing, nor the people doing the work."], "ladder": [{"stage": 1, "label": "Write it down", "entry_band": "foundational", "moves": ["For each accountable role, write down which decisions it can take alone, which it must discuss first, and which it must pass up. Use amounts or levels of risk, not vague words.", "Check each accountability against the authority that comes with it, and fix any mismatch first.", "Agree each accountability with the person who accepts it, instead of assigning it in a document they never saw."], "evidence": ["A delegation-of-authority schedule with thresholds.", "Signed or minuted acceptance of accountability by each named owner."], "derived_from": ["ISO-37000-2021.P4", "ISO-21502-2020.4.5"]}, {"stage": 2, "label": "Put it to use", "entry_band": "developing", "moves": ["Publish how much risk people may take, so autonomy has a stated limit and not a guessed one.", "Review how good a decision was separately from how it turned out, and record both.", "Give owners the means that match their accountability, or reduce the accountability."], "evidence": ["A stated risk appetite or tolerance per decision class.", "Decision records that capture the basis at the time, not only the result."], "derived_from": ["ISO-37000-2021.P9", "ISO-37000-2021.P8"]}, {"stage": 3, "label": "Verify it", "entry_band": "established", "moves": ["Before asking whether another equally qualified person would have decided the same way, rule out deliberate harm, incapacity and ignoring a known risk. Ask it last, not first.", "Have the governing body check a sample of delegated decisions, looking at the quality of the reasoning and not the outcome.", "Track whether the delegation limits are actually used, or whether everything is passed up anyway."], "evidence": ["An oversight sample of delegated decisions reviewed by the governing body.", "A written record, in at least one real case, of asking whether another equally qualified person would have decided the same way."], "derived_from": ["REASON-1997.SUB", "ISO-37000-2021.P5", "OECD-CG-2023.V"]}, {"stage": 4, "label": "Show it", "entry_band": "rolemodel", "moves": ["Report outside the organization on how delegated authority is governed, including what the governing body stays accountable for.", "Apply the same clear decision rights to joint ventures, partners and major suppliers.", "Publish an account of a decision that went wrong, and what was and was not blamed on the individual."], "evidence": ["A published case study of a defended decision.", "Disclosure describing delegation and retained accountability."], "derived_from": ["GRI-2-2021.2-13", "ISO-37000-2021.TRUST", "OECD-MNE-2023.DD1"]}], "strength": {"statement": "Decision latitude is real and it survives a bad outcome. This is the strongest single indicator that accountability here is not being run as punishment.", "protect": ["Defending the quality of a decision separately from its result, visibly.", "Keeping delegated thresholds explicit, so they cannot be quietly withdrawn after an incident."]}, "pillar": "environment"}, {"id": "transparency", "name": "Transparency & Collaboration", "definition": "Whether risks, delays and mistakes come to light early enough to act on, whether issues that cross teams are faced and not passed along, and whether decisions come with the information needed to understand them.", "provisions": ["ISO-26000-2010.PR2", "OECD-CG-2023.IV", "OECD-MNE-2023.III", "GRI-2-2021.2-16", "AA1000AP-2018.RES", "GS-CSO.C8"], "questions": [{"id": "Q07", "text": "Risks, delays, and mistakes are made visible early enough for others to act.", "provisions": ["GRI-2-2021.2-16", "PMBOK-7.P10"], "mini": true}, {"id": "Q08", "text": "Cross-functional teams address difficult issues directly rather than shifting responsibility.", "provisions": ["ISO-37000-2021.P4", "PMBOK-7.P3"]}, {"id": "Q09", "text": "Important decisions are explained to the people they affect.", "provisions": ["OECD-CG-2023.IV", "ISO-26000-2010.PR2", "GS-CSO.C8"], "revised": {"date": "2026-10-20", "previous_text": "Stakeholders explain important decisions and share the information needed to understand them.", "reason": "The statement reversed the direction of accountability. It asked whether stakeholders explain decisions, when the three provisions it tests all require the opposite: that the organization is open about decisions affecting others. It was also double-barrelled, asking about explanation and about sharing information in one item. Reported by a reviewer at the PMI Lisbon Emerging Leaders review, 20 October 2026.", "affects_comparability": "Responses recorded against layer versions before 3.1.0 answered a different statement for Q09 and should not be pooled with later ones on this item."}}], "diagnosis": {"foundational": "Bad news travels slowly and arrives softened. By the time an issue reaches someone who can act on it, the cheap time to fix it has passed.", "developing": "Information flows well inside a team and breaks down between teams. Issues that cross teams get relabeled as someone else's problem instead of being owned together.", "established": "Problems get raised and passed up. What is usually missing is the reasoning: decisions are shared as conclusions without the basis, so they are hard to question or to apply to similar cases.", "rolemodel": "Problems are visible early as a matter of course. The next step is to be as open about failures as about successes outside the organization, which the Global Standard for CSO Accountability asks for directly."}, "reflection_questions": ["How long does a serious problem take to travel from the person who first sees it to the person who can fix it?", "When was the last time a decision was communicated together with the reasoning and the options that were rejected?"], "anti_patterns": ["Status reporting where nothing is ever amber, and items move directly from green to red.", "Escalation treated as an admission of failure by the escalator."], "ladder": [{"stage": 1, "label": "Write it down", "entry_band": "foundational", "moves": ["Define what must be passed up, to whom, and how fast. Make it a rule, not a judgment call.", "Create one route for a serious concern to reach the governing body without passing through the person it is about.", "State that raising a problem early is not punished, in the same document that sets out how to raise it."], "evidence": ["A written escalation threshold and route.", "A count of critical concerns raised and where they went."], "derived_from": ["GRI-2-2021.2-16", "ISO-37000-2021.P5"]}, {"stage": 2, "label": "Put it to use", "entry_band": "developing", "moves": ["Give every issue that crosses teams one named owner at the moment it is raised, before anyone argues about whose problem it is.", "Publish decisions with their reasons: what was decided, why, what was turned down, and what would make you look at it again.", "Track how long it takes for a problem to become visible, and treat that as a measure in its own right."], "evidence": ["Decision records including rejected options.", "An issue log where every open item has one named owner."], "derived_from": ["ISO-37000-2021.P8", "OECD-CG-2023.IV"]}, {"stage": 3, "label": "Verify it", "entry_band": "established", "moves": ["Ask someone independent to check whether what was reported up matches what was really happening.", "Report serious problems alongside serious achievements, in the same document.", "Ask the people affected whether what you disclosed answered what they needed to know."], "evidence": ["An independent review of escalation completeness.", "Stakeholder validation of disclosure adequacy."], "derived_from": ["AA1000AP-2018.RES", "OECD-MNE-2023.III", "ISO-37000-2021.P5"]}, {"stage": 4, "label": "Show it", "entry_band": "rolemodel", "moves": ["Where possible, have the responsible-conduct information you disclose checked by an outside party, as the OECD Guidelines expect.", "Publish failures and how they were put right, not only performance.", "Extend your disclosure expectations to the business relationships where your impacts actually occur."], "evidence": ["Published account of a failure and its remedy.", "Assurance statement covering non-financial disclosure."], "derived_from": ["OECD-MNE-2023.III", "OECD-CG-2023.VI", "GS-CSO.C8"]}], "strength": {"statement": "Problems surface while they are still cheap to fix, and decisions arrive with their reasoning attached.", "protect": ["Treating early escalation as competence rather than as an admission of failure.", "Publishing the rejected options alongside the chosen one."]}, "pillar": "environment"}, {"id": "leadership", "name": "Leadership & Responsible Innovation", "definition": "Whether leaders visibly own their decisions and mistakes, whether people are encouraged to take calculated risks, and whether accountability is felt as support for taking initiative and not as control.", "provisions": ["ISO-37000-2021.P7", "ISO-37000-2021.P9", "PMBOK-7.P1", "PMBOK-7.P6", "PMBOK-7.P11", "OECD-CG-2023.VI", "ESRS-G1.G1-1"], "questions": [{"id": "Q10", "text": "Leaders openly own their decisions, commitments, and mistakes.", "provisions": ["ISO-37000-2021.P7", "PMBOK-7.P1"], "mini": true}, {"id": "Q11", "text": "People are encouraged to propose improvements and take thoughtful, calculated risks.", "provisions": ["ISO-37000-2021.P9", "PMBOK-7.P10"]}, {"id": "Q12", "text": "Accountability enables initiative and innovation rather than unnecessary control.", "provisions": ["ISO-37000-2021.P7", "PMBOK-7.P11", "OECD-CG-2023.VI"]}], "diagnosis": {"foundational": "Accountability is being used to find someone to blame. The result is defensive behavior: narrow job scopes, heavy paperwork, and nobody volunteering.", "developing": "Leaders own results selectively, usually the ones others already know about. People are told to take risks, but are penalized when they do.", "established": "Leaders mostly set a consistent example. The unfinished work is the level of control, which should match the real risk and not the leaders' anxiety.", "rolemodel": "Accountability helps people take initiative here. The next step is to set out how much risk is acceptable, where the limits are and what rewards apply, so it does not depend on having good leaders."}, "reflection_questions": ["When did a leader last publicly change their mind, and what did it cost them?", "Which controls exist because of a real risk, and which exist because of a single past incident nobody has revisited?"], "anti_patterns": ["Post-incident control accretion: every failure adds a checkpoint, none are ever removed.", "'Fail fast' as a slogan in an organization where no failure has ever been described in writing by the person responsible."], "ladder": [{"stage": 1, "label": "Write it down", "entry_band": "foundational", "moves": ["Have the senior team publicly own one specific decision that did not work, and say what they would do differently. Name it, date it and be specific.", "State in the business conduct policy that raising a problem is expected, and describe how reports are handled.", "Review your controls: list them, name the risk each one covers, and remove those where no real risk remains."], "evidence": ["A minuted or published leadership account of a decision that failed.", "A control register mapping each control to a named risk."], "derived_from": ["ISO-37000-2021.P7", "ESRS-G1.G1-1"]}, {"stage": 2, "label": "Put it to use", "entry_band": "developing", "moves": ["Set how much risk is acceptable for each kind of decision, so a \"calculated risk\" has a real calculation behind it.", "Build a route for improvement ideas to get an answer within a stated time: accepted, turned down with reasons, or tried as a pilot.", "Make leaders reviewing their own performance a regular agenda item, not something done only in a crisis."], "evidence": ["An improvement pipeline with decision timestamps.", "Documented risk appetite statements."], "derived_from": ["ISO-37000-2021.P9", "PMBOK-7.P10"]}, {"stage": 3, "label": "Verify it", "entry_band": "established", "moves": ["Have the governing body assess the major sustainability and resilience risks and how well it has handled them.", "Check that lobbying, public positions and internal decisions fit together.", "Evaluate how the governing body performed, including how it responded to bad news."], "evidence": ["Board-level evaluation of material risks and of its own performance.", "A coherence check across public positions and internal decisions."], "derived_from": ["OECD-CG-2023.VI", "GRI-2-2021.2-18", "GRI-2-2021.2-12"]}, {"stage": 4, "label": "Show it", "entry_band": "rolemodel", "moves": ["Reward decision-making that supports long-term resilience, and disclose how.", "Publish how leadership accountability works, so others can copy it and challenge it.", "Invite outside scrutiny of how leaders behave, not only of their results."], "evidence": ["A published account of how leaders are held to account.", "Disclosed link between incentives and long-term resilience.", "External review covering leadership conduct."], "derived_from": ["OECD-CG-2023.VI", "ISO-37000-2021.P11", "GRI-2-2021.2-19"]}], "strength": {"statement": "Leaders account for themselves in public, which is what makes accountability credible for everyone below them.", "protect": ["Removing controls that no longer map to a live risk, not only adding new ones after incidents.", "Senior people describing their own failures specifically, by name and in writing."]}, "pillar": "environment"}, {"id": "safety", "name": "Psychological Safety & Speak-up", "definition": "Whether people can challenge a decision whatever their rank, whether asking for help or raising a problem early is seen as responsible, and whether admitting a mistake leads to a review and not to blame.", "source_note": "No international standard defines psychological safety. This element is anchored on the peer-reviewed evidence base (Edmondson 1999) for the behavioural construct, and on ISO 37002, GRI 2 and UNGP 31 for the reporting machinery that makes speak-up real. The repository states this distinction rather than dressing research as a standard.", "provisions": ["EDMONDSON-1999.PS", "ISO-37002-2021.TRUST", "ISO-37002-2021.IMP", "ISO-37002-2021.PROT", "GRI-2-2021.2-26", "GRI-2-2021.2-16", "UNGP-2011.GP31.a", "UNGP-2011.GP31.b", "UNGP-2011.GP31.f", "ESRS-G1.G1-1"], "questions": [{"id": "Q13", "text": "People can raise concerns or challenge a decision respectfully, regardless of hierarchy.", "provisions": ["EDMONDSON-1999.PS", "GRI-2-2021.2-26"], "mini": true}, {"id": "Q14", "text": "Asking for help or escalating a risk early is treated as responsible behavior.", "provisions": ["EDMONDSON-1999.PS", "ISO-37002-2021.TRUST"]}, {"id": "Q15", "text": "People can acknowledge mistakes without expecting an automatic blame response.", "provisions": ["REASON-1997.SUB", "ISO-37002-2021.PROT"]}], "diagnosis": {"foundational": "The organization is not learning what it most needs to know. Where speaking up costs people personally, the information reaching decision-makers is filtered, and leaders at the top cannot see the filtering.", "developing": "Safety depends on the team. It varies sharply by manager: some teams speak openly and others in the same organization do not, and leaders only see the average.", "established": "People do speak up. What is usually missing is protection under pressure: does the reporting route still work when the concern is about someone senior?", "rolemodel": "Speaking up is reliable and protected. The next step is to report what the reporting route has produced, so others can trust it. UNGP 31(e) asks for this, scaled to the public interest involved."}, "reflection_questions": ["In which team would a junior person most readily contradict a senior one — and what is different about that team?", "What happens to a concern that names someone in the senior team?"], "anti_patterns": ["A speak-up channel that routes to the line manager, i.e. often to the subject of the concern.", "Zero reports treated as good news rather than as a diagnostic."], "ladder": [{"stage": 1, "label": "Write it down", "entry_band": "foundational", "moves": ["Provide at least one way to report that bypasses the line manager, and say in plain terms what protection from retaliation means in practice.", "Measure safety team by team, not only for the whole organization, and give each manager their own team's result.", "Have leaders answer the first hard question in public and not in private, so people can see how they respond."], "evidence": ["A documented reporting route independent of line management.", "Team-level safety measurement with results returned to each team."], "derived_from": ["GRI-2-2021.2-26", "ISO-37002-2021.PROT", "EDMONDSON-1999.PS"]}, {"stage": 2, "label": "Put it to use", "entry_band": "developing", "moves": ["Publish the procedure and a rough timeframe for each stage, so people know what happens after they report.", "Handle reports fairly: declare conflicts of interest, and use a handler who is outside the reporting line.", "Report to the governing body how many serious concerns were raised and how they were resolved."], "evidence": ["A published speak-up procedure with stage timeframes.", "A concerns register reported to the governing body."], "derived_from": ["UNGP-2011.GP31.c", "ISO-37002-2021.IMP", "GRI-2-2021.2-16"]}, {"stage": 3, "label": "Verify it", "entry_band": "established", "moves": ["Test deliberately whether everyone can use the route, looking at language, literacy, location, contractor status and fear of reprisal. Remove the barriers you find.", "Give people who report access to information and advice, so they can take part on fair terms.", "Track retaliation as a result in its own right, separately from the number of reports."], "evidence": ["An accessibility barrier assessment with remediation actions.", "A retaliation outcome measure with trend."], "derived_from": ["UNGP-2011.GP31.b", "UNGP-2011.GP31.d", "ISO-37002-2021.PROT"]}, {"stage": 4, "label": "Show it", "entry_band": "rolemodel", "moves": ["Share enough about how the reporting route performs for people to trust it, scaled to the public interest involved.", "Involve the people who use the route in reviewing and redesigning it.", "Extend protected reporting to contractors, suppliers and affected communities."], "evidence": ["Public effectiveness reporting for the speak-up mechanism.", "User participation in mechanism review, documented."], "derived_from": ["UNGP-2011.GP31.e", "UNGP-2011.GP31.h", "ESRS-G1.G1-1"]}], "strength": {"statement": "People raise concerns across hierarchy, which means decision-makers are receiving information that has not been filtered on the way up.", "protect": ["At least one reporting route that bypasses line management.", "Reading a fall in report volume as a warning sign rather than as success."]}, "pillar": "conditions"}, {"id": "learning", "name": "Learning & Continuous Improvement", "definition": "Whether setbacks are examined for their causes and not for a person to blame, whether lessons are discussed during the work and not only after it, and whether lessons turn into changes that spread beyond the team that learned them.", "provisions": ["UNGP-2011.GP31.g", "OECD-MNE-2023.DD4", "ISO-37000-2021.P11", "AA1000AP-2018.IMP", "REASON-1997.TREE", "PMBOK-7.P11"], "questions": [{"id": "Q16", "text": "Teams examine setbacks to understand root causes rather than immediately identifying someone to blame.", "provisions": ["REASON-1997.SUB", "REASON-1997.TREE"], "mini": true}, {"id": "Q17", "text": "Lessons are discussed throughout the work, not only after a project has ended.", "provisions": ["OECD-MNE-2023.DD4", "PMBOK-7.P11"]}, {"id": "Q18", "text": "Important lessons are converted into implemented changes and shared beyond the immediate team.", "provisions": ["UNGP-2011.GP31.g", "ISO-37000-2021.P11"]}], "diagnosis": {"foundational": "The organization keeps repeating failures it has already paid for. When the first move after a setback is to find a person, the cause is never reached and the same conditions stay in place.", "developing": "Lessons are written down but not acted on. The lessons-learned list exists, entries are added, and nothing downstream changes.", "established": "Learning happens and leads to change in the team. What is usually missing is passing it on: the change stays with the team that earned it.", "rolemodel": "Learning is routine and it spreads. The next step is to treat patterns in complaints and incidents as information about the system itself, which UNGP 31(g) asks for."}, "reflection_questions": ["Name one process that changed in the last year because of a lesson learned. What was the lesson?", "How would a team in a different function find out what you learned last quarter?"], "anti_patterns": ["Retrospectives held only at project close, when the people who could act have already moved on.", "A lessons register with no owner and no link to any process document."], "ladder": [{"stage": 1, "label": "Write it down", "entry_band": "foundational", "moves": ["Keep the analysis of causes separate from any decision about consequences, in time and in who takes part.", "Run the review during the work at set points, not only at the end.", "End every review with an owner and a date for each change, or an explicit decision to change nothing."], "evidence": ["A review method that documents causal factors before any attribution.", "In-flight review points scheduled in the plan."], "derived_from": ["REASON-1997.TREE", "OECD-MNE-2023.DD4"]}, {"stage": 2, "label": "Put it to use", "entry_band": "developing", "moves": ["Close the loop: track each lesson to the procedure, control or training it changed.", "Track whether the changes were carried out and what they achieved, not just the decision to make them.", "Publish lessons in a form other teams can search and use."], "evidence": ["A traceable link from lesson to changed artifact.", "Implementation tracking for agreed changes."], "derived_from": ["OECD-MNE-2023.DD4", "UNGP-2011.GP31.g"]}, {"stage": 3, "label": "Verify it", "entry_band": "established", "moves": ["Look for patterns across incidents, complaints and near-misses, instead of treating each one as a one-off.", "Track whether the changes worked, including where they did not. The due diligence cycle already requires this step.", "Have oversight check whether repeat problems are actually falling."], "evidence": ["Cross-case pattern analysis.", "Recurrence-rate trend reported to oversight."], "derived_from": ["UNGP-2011.GP31.g", "OECD-MNE-2023.DD4", "ISO-37000-2021.P5"]}, {"stage": 4, "label": "Show it", "entry_band": "rolemodel", "moves": ["Say publicly how impacts and failures are being addressed, as the due diligence cycle expects.", "Share lessons across your sector, including ones that are uncomfortable for the business.", "Check over time that the way you learn is still working as the organization changes."], "evidence": ["Lessons from problems shared with peers outside the organization.", "External communication of how issues were addressed.", "Periodic review of the learning system's own effectiveness."], "derived_from": ["OECD-MNE-2023.DD5", "ISO-37000-2021.P11"]}], "strength": {"statement": "Setbacks actually change something: lessons reach process documents and controls rather than only a register.", "protect": ["Separating causal analysis from any consequence decision, in time and in participants.", "Closing every lesson to a named artifact with a named owner."]}, "pillar": "conditions"}, {"id": "feedback", "name": "Feedback & Problem Solving", "definition": "Whether feedback is honest, respectful and timely enough to be useful, whether there are regular meetings to discuss actions, risks and decisions, and whether a raised issue reliably gets an owner, a response and a follow-up.", "provisions": ["AA1000AP-2018.INC", "AA1000AP-2018.RES", "UNGP-2011.GP31.h", "GRI-2-2021.2-29", "ISO-37000-2021.P6", "GS-CSO.C11", "PMBOK-7.P3"], "questions": [{"id": "Q19", "text": "Feedback is honest, respectful, and sufficiently timely to support improvement.", "provisions": ["AA1000AP-2018.RES", "PMBOK-7.P2"]}, {"id": "Q20", "text": "Teams have regular forums to discuss actions, risks, decisions, and improvement opportunities.", "provisions": ["ISO-37000-2021.P6", "GRI-2-2021.2-29"]}, {"id": "Q21", "text": "When an issue is raised, the team agrees on a clear owner, response, and follow-up.", "provisions": ["UNGP-2011.GP31.c", "GS-CSO.C11"], "mini": true}], "diagnosis": {"foundational": "Feedback comes too late to use, or not at all. Issues raised in one meeting do not come up again anywhere, so raising them stops feeling worthwhile.", "developing": "Meetings exist, but follow-through is weak. Issues are discussed, no single owner is named, and the item drifts from meeting to meeting until it fixes itself or blows up.", "established": "Issues get owners and responses. What is usually missing is the loop back: the person who raised the concern rarely hears what happened.", "rolemodel": "Feedback loops are complete. The next step is to give the people affected by decisions a structured say in them, not just a place to comment. This is what AA1000 means by inclusivity."}, "reflection_questions": ["When someone raises an issue, how do they find out what was done about it?", "Which stakeholder group has the least structured route into your decisions?"], "anti_patterns": ["Actions assigned to a team rather than a person, which means assigned to nobody.", "Feedback collected in a survey once a year and never referenced in any decision."], "ladder": [{"stage": 1, "label": "Write it down", "entry_band": "foundational", "moves": ["Give every raised issue one named person, one agreed response and one review date, at the moment it is raised.", "Hold a regular meeting with a fixed agenda covering actions, risks, decisions and improvements.", "Make it a required step to report back to whoever raised the issue."], "evidence": ["An issue log with named owners and review dates.", "A standing forum with minutes showing closure."], "derived_from": ["UNGP-2011.GP31.c", "GS-CSO.C11"]}, {"stage": 2, "label": "Put it to use", "entry_band": "developing", "moves": ["Name the groups of people affected by your work and record how each group's input reaches decisions.", "Build responses into risk management and planning, instead of handling them on a separate track.", "Check proposed responses with the people who raised the issue before you carry them out."], "evidence": ["Evidence of responses v
