ested in the cited literature"}]}, "community": {"schema": "accountability-repository/community@1", "updated": "2026-09-30", "element": {"name": "PMI community recommendations (GEC Lisbon 26)", "short_name": "GEC Lisbon 26", "what_it_is": "Practitioner consensus captured in the GEC Lisbon tabletop conversations — the discussions the Lisbon Bridge Model itself came out of. It sits alongside the standards rather than inside them, because it is a different kind of evidence: not what an instrument requires, but what practitioners running real portfolios found actually works.", "why_it_is_separate": "A standard tells you what is expected. This tells you what a room of practitioners did about it. Blending the two would let community practice borrow authority it does not have, and would let the standards lose the specificity that makes them citable. Keeping it a distinct element means a reader can always see which is which — and means this layer can be removed, replaced or re-run after the next council without touching the standards corpus.", "how_it_is_used": "Each of the 12 elements gets a set of community provisions and one spotlight practice: a concrete, attributable thing somebody actually does. The spotlight is the most quotable output of this layer — it turns a recommendation from 'establish a reporting route' into 'this is what a real organization built, and who described it'.", "how_to_cite": "Tier E. Cite as experience, not as a requirement: \"practitioners at the GEC Lisbon tables described …\", never \"organizations must …\". Where a provision below is phrased as an imperative, that is the table's advice in its own voice, not an obligation this repository asserts."}, "source": {"id": "PMI-GEC-LISBON-2026", "title": "PMI community recommendations (GEC Lisbon 26)", "issuer": "PMI Global Executive Council — Lisbon Emerging Leaders tabletop conversations", "edition": "GEC Lisbon 2026", "tier": "E", "applies_to": ["any-organization", "project", "programme", "team"], "url": "https://docs.google.com/document/d/1Pa8O2xDtJRuvJeuR_SZI20xEhoengw7JspbKf97hras/edit", "verified": true, "verified_via": "primary", "verification_note": "Read directly from the source document 'Tabletop Conversations – Notes, Transcripts & Summaries'. Contributing tables: Yasser; Inês; Anna & JP; Ritesh; Misbah; Matt; Cecilia; Carolyn & Martina. Ritesh's notes record the broader workshop as covering 10 organizations across 9 countries.", "note": "This is the only source in the repository that is not publicly retrievable. The URL is a Google Doc; anyone outside the group following a citation will hit a permissions wall. Before this layer is used with customers, the conversations need a citable public form — a published paper, a council deliverable, or a stable page — and the URL here should be repointed at it.", "access": "restricted", "release_blocker": true}, "tier_definition": {"E": "Practitioner community consensus. Recorded discussion among named practitioners; evidence of what works in practice, not a normative instrument and not a peer-reviewed finding. Cite it as experience, never as a requirement."}, "provisions": [{"id": "PMI-GEC-LISBON-2026.SHARED-MEANING", "ref": "Anna & JP, main point 1", "statement": "Accountability means different things to different people. The starting point is defining what it means, clarifying expectations and setting ground rules — and educating sponsors and leaders on what they themselves are accountable for.", "relation": "extends", "counterpart": [], "relation_note": "No instrument in the corpus treats 'accountability' as a contested word that an organization must first agree on."}, {"id": "PMI-GEC-LISBON-2026.THRESHOLDS", "ref": "Carolyn & Martina, setting expectations and vision", "statement": "Align accountability thresholds: a clear, consistent, organization-wide understanding of what constitutes accountability and the standards expected.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P4", "ISO-37000-2021.P3"], "relation_note": "Turns the principle into an organization-wide agreed threshold rather than a definition on paper."}, {"id": "PMI-GEC-LISBON-2026.TOR", "ref": "Ritesh, question 1 — clarity of roles", "statement": "Provide Terms of Reference at the start of every assignment. It is routinely treated as a nice-to-have and skipped, which erodes accountability over time.", "relation": "operationalises", "counterpart": ["ISO-21502-2020.4.5"], "relation_note": "Names the artifact the clause implies: a written Terms of Reference at every assignment start."}, {"id": "PMI-GEC-LISBON-2026.THREE-LAYERS", "ref": "Ritesh, question 1 — accountability across all levels", "statement": "Define accountability at three distinct levels — individual PM, PMO, senior leadership — cascading coherently from leadership's long-term vision, rather than reducing it to a box on an org chart.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P4", "GRI-2-2021.2-13"], "relation_note": "Gives the delegation chain three concrete tiers — individual, PMO, leadership."}, {"id": "PMI-GEC-LISBON-2026.VISION-BUYIN", "ref": "Carolyn & Martina, setting expectations and vision", "statement": "Drive purpose by communicating vision and mission through leadership engagement, change management, internal channels and events — not by publishing the statement.", "relation": "challenges", "counterpart": ["GRI-2-2021.2-22"], "relation_note": "A published strategy statement is not communication; the table says buy-in comes from engagement, not disclosure."}, {"id": "PMI-GEC-LISBON-2026.AUTHORITY-CHAIN", "ref": "Misbah, key takeaway 3", "statement": "Authority, autonomy and accountability must function as a connected chain. Autonomy without accountability, or accountability without authority, breaks the system.", "relation": "corroborates", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Practitioners reached ISO 37000's definition from experience: authority and accountability are one chain."}, {"id": "PMI-GEC-LISBON-2026.CALIBRATED-TRUST", "ref": "Ritesh, question 1 — trust and its limits", "statement": "Verification should be proportional to decision severity. High stakes warrant closer oversight; routine work should default to autonomy. Uniform 'trust but verify' reads as distrust and erodes the empowerment that drives performance.", "relation": "extends", "counterpart": [], "relation_note": "No standard scales verification to the stakes of the decision; the corpus treats oversight as uniform."}, {"id": "PMI-GEC-LISBON-2026.EMPOWER-SOLUTIONS", "ref": "Carolyn & Martina, culture of trust, autonomy and ownership", "statement": "Leaders should empower teams to devise their own action plans and solutions rather than dictating them.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Delegation means the team writes the plan, not that it executes someone else's."}, {"id": "PMI-GEC-LISBON-2026.EMPOWERMENT-TRADEOFF", "ref": "Ritesh, question 1 — balancing accountability with empowerment", "statement": "You cannot hold a team rigidly accountable for every micro-decision if you have genuinely empowered them to operate autonomously. Managers must accept that trade-off.", "relation": "challenges", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Genuine delegation limits what you may hold someone to — a trade-off the principle does not acknowledge."}, {"id": "PMI-GEC-LISBON-2026.ACCOUNTABILITY-PARTNERS", "ref": "Carolyn & Martina, culture of trust, autonomy and ownership", "statement": "Accountability partners: individuals share plans and progress with a peer before completion, creating mutual commitment to finishing.", "relation": "extends", "counterpart": [], "relation_note": "Peer-to-peer commitment before completion has no analogue in any instrument."}, {"id": "PMI-GEC-LISBON-2026.TRUTHFUL-REPORTING", "ref": "Cecilia, question 2 — transparency and truthful reporting", "statement": "Accountability includes reporting what is really happening, making issues visible, and ensuring the right stakeholders know when something is off track. An accountable person should never assume someone else has escalated.", "relation": "operationalises", "counterpart": ["ISO-26000-2010.PR2", "GRI-2-2021.2-16"], "relation_note": "Adds the duty not to assume someone else escalated."}, {"id": "PMI-GEC-LISBON-2026.VISIBLE-ACCOUNTABILITY", "ref": "Misbah, key takeaway 2; Ritesh, key findings — transparency", "statement": "Visible accountability: when people can see who is accountable for what, cross-functional ownership and partnership improve. Lack of visibility into roles, responsibilities and ownership was the most cited barrier across the organizations surveyed.", "relation": "corroborates", "counterpart": ["ISO-37000-2021.P4", "ISO-26000-2010.PR2"], "relation_note": "Independently names invisible ownership as the most cited barrier across the organizations in the room."}, {"id": "PMI-GEC-LISBON-2026.NO-WHISPER", "ref": "Yasser, communication strategy and ways of working", "statement": "Address problems directly within the team rather than whispering to neighbours. Lengthy emails leave room to misread tone and can serve as a shield to pass off accountability — 'well, I sent the email'. Quick direct conversations resolve issues better.", "relation": "extends", "counterpart": [], "relation_note": "No standard governs channel choice; the table found email itself becomes a shield against accountability."}, {"id": "PMI-GEC-LISBON-2026.COLLAB-PROBLEM-SOLVING", "ref": "Carolyn & Martina, transparency and collaboration", "statement": "Leaders should facilitate collaboration, prompting teams to resolve issues locally before escalation. This avoids finger-pointing and builds collective responsibility.", "relation": "operationalises", "counterpart": ["GRI-2-2021.2-16"], "relation_note": "Resolve locally first, so escalation carries signal rather than blame."}, {"id": "PMI-GEC-LISBON-2026.WASTEFUL-COMPETITION", "ref": "Ritesh, key findings — low accountability", "statement": "Without clear ownership teams compete instead of partnering, duplicating resources, time and spend.", "relation": "corroborates", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Supplies the cost case for clear ownership: without it teams duplicate rather than partner."}, {"id": "PMI-GEC-LISBON-2026.MODEL-FROM-TOP", "ref": "Yasser, cultivating psychological safety and culture", "statement": "Accountability must be modeled by executives. Where leadership does not practice what it preaches or stays unapproachable, employees hide mistakes rather than bring them forward, producing worse delays and overruns.", "relation": "corroborates", "counterpart": ["ISO-37000-2021.P7"], "relation_note": "Leadership behavior as a governance instrument, reached from practice."}, {"id": "PMI-GEC-LISBON-2026.FAILURE-DAY", "ref": "Carolyn & Martina, transparency and collaboration", "statement": "Normalize learning from failure with rituals where leaders share their own mistakes first — a practice the table described as a NASA-inspired 'failure day' in which a document passes from top leaders downward and each person adds their own failures, showing that senior people failed too and still got there.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P7"], "relation_note": "A repeatable ritual that makes the leadership principle observable."}, {"id": "PMI-GEC-LISBON-2026.OPEN-HONEST-CHARTER", "ref": "Yasser, making the implicit explicit", "statement": "An 'Open and Honest Charter': a tangible one-page values statement signed by leadership, setting bidirectional behavioral expectations, with teams recognized and rewarded for shifting toward those behaviors.", "relation": "operationalises", "counterpart": ["ESRS-G1.G1-1"], "relation_note": "A one-page signed artifact where the standard asks only for a policy and a culture."}, {"id": "PMI-GEC-LISBON-2026.ASSUME-POSITIVE-INTENT", "ref": "Yasser, communication strategy and ways of working", "statement": "Assume positive intent: pause before reacting to bad news and ask curious questions — 'what was your thought process here?' — rather than assigning blame.", "relation": "extends", "counterpart": [], "relation_note": "A conversational rule for receiving bad news; no instrument reaches this level."}, {"id": "PMI-GEC-LISBON-2026.VISIBLE-PRESENCE", "ref": "Carolyn & Martina, empowering PMs", "statement": "Leaders should be actively present and engaged, particularly in remote or digital environments, to foster connection and demonstrate commitment to accountability.", "relation": "extends", "counterpart": [], "relation_note": "Remote and digital presence as an accountability condition is absent from the corpus."}, {"id": "PMI-GEC-LISBON-2026.BE-BRAVE", "ref": "Inês, summary", "statement": "Accountability starts with the courage to step up, make decisions and own the outcome — while not becoming an excuse for carelessness or poor preparation. The point is not to celebrate mistakes but to create an environment where people are willing to act, learn and improve.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P9"], "relation_note": "Governed risk-taking expressed as individual courage, bounded against carelessness."}, {"id": "PMI-GEC-LISBON-2026.FEAR-BLOCKS", "ref": "Anna & JP, main point 3", "statement": "People avoid accountability because they fear blame or punishment. Fear prevents escalation and people hide problems instead of raising them. The focus should be on fixing the process, not blaming individuals.", "relation": "corroborates", "counterpart": ["EDMONDSON-1999.PS"], "relation_note": "Arrives at the psychological safety finding without citing it."}, {"id": "PMI-GEC-LISBON-2026.FEARLESSNESS", "ref": "Cecilia, question 1", "statement": "Accountability only works when people feel safe enough to admit mistakes, own consequences, speak honestly and raise concerns early — balanced by being responsible enough to own the outcome, so that it does not become 'anything goes'.", "relation": "corroborates", "counterpart": ["EDMONDSON-1999.PS", "ISO-37002-2021.TRUST"], "relation_note": "Adds the balance condition: safe to speak, still responsible for the outcome."}, {"id": "PMI-GEC-LISBON-2026.SHADOW-COMMITTEE", "ref": "Carolyn & Martina, psychological safety", "statement": "Informal 'shadow steering committees' or peer discussion forums where people can discuss accountability challenges and concerns openly with peers without pressure, countering the loneliness of carrying a difficult accountability decision alone.", "relation": "operationalises", "counterpart": ["GRI-2-2021.2-26"], "relation_note": "A named forum answering a problem the standard does not diagnose: isolation, not ignorance."}, {"id": "PMI-GEC-LISBON-2026.BOTTOM-UP-HARDER", "ref": "Ritesh, question 2 — culture and the bottom-up challenge", "statement": "Accountability flows naturally top-down but is much harder to enforce bottom-up. People are reluctant to hold a superior accountable even when it is warranted, and that reluctance is a significant barrier.", "relation": "extends", "counterpart": [], "relation_note": "The directional asymmetry of accountability is in no instrument in the corpus."}, {"id": "PMI-GEC-LISBON-2026.PROGRESS-OVER-PERFECTION", "ref": "Yasser, cultivating psychological safety and culture", "statement": "Consistent bi-weekly sessions where teams openly share past mistakes help normalize failure as part of learning rather than a negative mark.", "relation": "operationalises", "counterpart": ["EDMONDSON-1999.PS"], "relation_note": "A cadence — bi-weekly mistake sharing — for a construct the research only measures."}, {"id": "PMI-GEC-LISBON-2026.LESSONS-IMPLEMENTED", "ref": "Carolyn & Martina, learning mindset", "statement": "Move beyond identifying 'lessons learned' to 'lessons implemented'.", "relation": "operationalises", "counterpart": ["OECD-MNE-2023.DD4"], "relation_note": "Renames the artifact so that tracking implementation becomes the test."}, {"id": "PMI-GEC-LISBON-2026.CROSS-FUNCTIONAL-LESSONS", "ref": "Ritesh, question 2 — lessons learned; Cecilia, question 2", "statement": "Cross-functional sharing of failures is a major gap: a safety failure never reaches the finance team facing the same issue, and teams in separate programs recycle the same failures in silos. Lessons should run through the lifecycle, not only at close-out, and in an environment of psychological safety.", "relation": "operationalises", "counterpart": ["UNGP-2011.GP31.g"], "relation_note": "Names the failure mode the criterion leaves implicit: lessons that never cross a function."}, {"id": "PMI-GEC-LISBON-2026.SAFETY-TEAM-PRACTICE", "ref": "Carolyn & Martina, learning mindset; Cecilia, question 2", "statement": "Replicate the systematic, rigorous accountability processes used by safety-critical teams, whose focus is already accountability.", "relation": "extends", "counterpart": [], "relation_note": "Borrowing wholesale from safety-critical practice is a move no instrument suggests."}, {"id": "PMI-GEC-LISBON-2026.LEARNING-NOT-ENOUGH", "ref": "Cecilia, fit into the Lisbon Bridge Model", "statement": "A learning mindset is necessary but not sufficient. If everything is framed only as learning, serious failures get softened and the system fails to act where stronger accountability is needed.", "relation": "challenges", "counterpart": ["REASON-1997.TREE"], "relation_note": "Pushes back on a learning-only reading: some failures need consequences, or the system never acts."}, {"id": "PMI-GEC-LISBON-2026.FEEDBACK-TIMING", "ref": "Anna & JP, main point 7", "statement": "Feedback should be honest and timely; timing matters when emotions are high; anonymous or structured feedback may help in sensitive situations; feedback can be registered and followed up with action plans.", "relation": "operationalises", "counterpart": ["AA1000AP-2018.RES"], "relation_note": "Adds timing, anonymity in sensitive cases, and follow-up action plans."}, {"id": "PMI-GEC-LISBON-2026.REALTIME-IDEAS", "ref": "Carolyn & Martina, promoting innovation", "statement": "Simple structured mechanisms to capture ideas and suggestions in real time at the point of work — one company places cards beside operational tasks so operators can write suggestions as they occur — embedding innovation into everyday work.", "relation": "extends", "counterpart": [], "relation_note": "Capturing suggestions at the point of work has no counterpart in the corpus."}, {"id": "PMI-GEC-LISBON-2026.EXPLAIN-DECISIONS", "ref": "Anna & JP, main point 8", "statement": "Not every suggestion can be implemented, so leaders should explain clearly why a decision was made.", "relation": "operationalises", "counterpart": ["UNGP-2011.GP31.h"], "relation_note": "Closes the dialogue loop where a suggestion is declined."}, {"id": "PMI-GEC-LISBON-2026.KAIZEN", "ref": "Anna & JP, main point 8", "statement": "Kaizen-style improvement sessions give team members a voice, alongside regular meetings that track actions, decisions and risks.", "relation": "operationalises", "counterpart": ["AA1000AP-2018.INC"], "relation_note": "A forum through which inclusivity actually reaches the people doing the work."}, {"id": "PMI-GEC-LISBON-2026.TEAM-SOLVES", "ref": "Carolyn & Martina, notes", "statement": "Promote the team to work together and reach a solution themselves; gaps get filled by the team figuring it out together.", "relation": "extends", "counterpart": [], "relation_note": "Letting the team reach its own solution is a leadership restraint no standard asks for."}, {"id": "PMI-GEC-LISBON-2026.ACCOUNTABILITY-MATRIX", "ref": "Cecilia, question 2 — accountability matrix", "statement": "An accountability matrix applied after incidents or quality issues: investigate what happened; determine whether it came from a human behavior issue, a knowledge or training issue, or a process or system issue; respond accordingly with coaching, training, process correction, or stronger consequences in cases of negligence. It exists to avoid jumping to blame.", "relation": "operationalises", "counterpart": ["REASON-1997.TREE"], "relation_note": "The clearest operationalization in the layer: the culpability model as an after-incident procedure."}, {"id": "PMI-GEC-LISBON-2026.NOT-ALL-FAILURES", "ref": "Cecilia, summary point 5", "statement": "Not all failures should be handled the same way. Some require coaching and learning, some process change, some formal investigation, and some real consequences.", "relation": "corroborates", "counterpart": ["REASON-1997.TREE"], "relation_note": "Reproduces the culpability distinction from field experience."}, {"id": "PMI-GEC-LISBON-2026.SAFETY-OVERRIDES", "ref": "Cecilia, question 2 — safety-critical accountability", "statement": "Safety must override schedule pressure. Organizations have paused programs, stopped work, sent teams home and launched investigations after near misses — accountability applied visibly and consistently. Where schedule pressure dominates, incidents and near misses go unreported.", "relation": "extends", "counterpart": [], "relation_note": "Stop-work authority and safety over schedule are absent from the corpus."}, {"id": "PMI-GEC-LISBON-2026.ACT-UNDER-UNCERTAINTY", "ref": "Inês, summary", "statement": "The most successful managers decide without complete certainty, using judgment and taking calculated risks. Fear of getting it wrong should not stop thoughtful action, and people should not wait to be told what to do every time a challenge arises.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P8"], "relation_note": "Decision-making under incomplete information, as a management expectation."}, {"id": "PMI-GEC-LISBON-2026.INVESTIGATE-FIRST", "ref": "Cecilia, question 2 — investigation before action", "statement": "Investigate what went wrong, understand root cause, and distinguish human from process failure before deciding what accountability action is appropriate.", "relation": "corroborates", "counterpart": ["REASON-1997.SUB"], "relation_note": "Root cause before attribution, reached independently."}, {"id": "PMI-GEC-LISBON-2026.SINGLE-OWNER", "ref": "Misbah, key takeaway 1", "statement": "Shared accountability risks becoming no accountability. When responsibility is distributed too broadly ownership becomes diffuse; clear assignment of who is ultimately accountable remains essential even in collaborative models.", "relation": "corroborates", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "The sharpest restatement of the keystone: shared accountability risks becoming none."}, {"id": "PMI-GEC-LISBON-2026.UPFRONT-ALLOCATION", "ref": "Yasser, operational hurdles", "statement": "Assign a specific owner to every single piece of a project's scope at the very beginning.", "relation": "operationalises", "counterpart": ["ISO-21502-2020.4.5"], "relation_note": "Every piece of scope gets an owner at the start, not when it fails."}, {"id": "PMI-GEC-LISBON-2026.RACI-ALIGNMENT", "ref": "Matt, key takeaways; Yasser, operational hurdles", "statement": "Complete a RACI at project start and align on it at kickoff. In consultancy and multi-project environments the front-end commercial team, the client, the supplier and the back-end delivery team routinely interpret the same matrix differently.", "relation": "extends", "counterpart": [], "relation_note": "No instrument addresses the same matrix being read differently by client, supplier and delivery."}, {"id": "PMI-GEC-LISBON-2026.LAYERS", "ref": "Cecilia, question 1", "statement": "Everyone is accountable for something, but no one is accountable for everything. Those layers have to be really clear.", "relation": "corroborates", "counterpart": ["GRI-2-2021.2-13"], "relation_note": "Delegation as tiers: everyone accountable for something, nobody for everything."}, {"id": "PMI-GEC-LISBON-2026.NO-TRANSFER", "ref": "Misbah, key takeaway 6", "statement": "Accountability does not transfer during absences. The original accountable person retains ownership; teams create coverage through dynamic support rather than by formally reassigning accountability.", "relation": "extends", "counterpart": [], "relation_note": "What happens to accountability during an absence is in no instrument."}, {"id": "PMI-GEC-LISBON-2026.REEVALUATE", "ref": "Yasser, adapting to change", "statement": "Accountability is not static. As long programs evolve — shifting from a business focus to a product focus over three or four years — leadership roles and ownership matrices must be re-evaluated, or stakeholders disengage.", "relation": "extends", "counterpart": [], "relation_note": "Ownership as a living artifact that decays over a multi-year program."}, {"id": "PMI-GEC-LISBON-2026.REPORTING-LINES", "ref": "Matt, key takeaways", "statement": "Reporting lines must always be clear in case of issues, which is hard when team members report to functional managers rather than to the project manager.", "relation": "operationalises", "counterpart": ["ISO-21502-2020.4.5"], "relation_note": "Names the matrix problem the clause assumes away."}, {"id": "PMI-GEC-LISBON-2026.RIGHT-PEOPLE", "ref": "Matt, key takeaways", "statement": "You cannot hold people accountable if they are not able to do the job. Right people in the right role, with the correct training in place — is the company setting people up to be accountable?", "relation": "corroborates", "counterpart": ["ISO-21502-2020.4.5.4"], "relation_note": "The sponsor's duty to confirm competence, stated as a precondition for holding anyone to anything."}, {"id": "PMI-GEC-LISBON-2026.SKILL-MAP", "ref": "Matt, key takeaways", "statement": "Create a skill map at project start-up to identify where people have the skill sets that make accountability possible.", "relation": "operationalises", "counterpart": ["ISO-21502-2020.4.5.4"], "relation_note": "An artifact for the competence check the clause requires."}, {"id": "PMI-GEC-LISBON-2026.NETWORKS", "ref": "Anna & JP, main point 6", "statement": "Project and portfolio managers rarely solve every problem themselves. Accountability becomes easier when people know who can help; strong internal networks reduce the weight of accountability.", "relation": "extends", "counterpart": [], "relation_note": "Relationships as a load-bearing accountability asset appear in no instrument."}, {"id": "PMI-GEC-LISBON-2026.SUPPORTED-NOT-ALONE", "ref": "Cecilia, question 1", "statement": "The accountable person may be the point of contact but still needs an empowered team behind them. Accountability should be supported by the team, not carried alone.", "relation": "challenges", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Single ownership can read as sole carriage; the table insists the owner still needs a team."}, {"id": "PMI-GEC-LISBON-2026.CAPABILITY-GAPS", "ref": "Misbah, key takeaway 8", "statement": "Capability gaps, multi-layered structures and shifting organizational contexts make accountability hard to sustain; external resources and strong leadership sponsorship are often needed.", "relation": "extends", "counterpart": [], "relation_note": "The sustainability of accountability under capability constraint is unaddressed in the corpus."}, {"id": "PMI-GEC-LISBON-2026.WEEKLY-BACKBONE", "ref": "Ritesh, question 2 — weekly reporting", "statement": "Weekly executive summary reports with red/amber/green indicators are the primary accountability mechanism across most participating organizations, creating a time-stamped record of project health. If a project suddenly deteriorates with no prior warning flags, that reflects on the PM — signalling hidden problems or lack of awareness.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P5"], "relation_note": "What oversight looks like weekly, with deterioration-without-warning as the tell."}, {"id": "PMI-GEC-LISBON-2026.FOLLOW-THROUGH", "ref": "Ritesh, question 2 — weekly reporting", "statement": "A weekly report was periodically moved so that executives could not reach it automatically, and nobody noticed or pushed back. That absence of follow-through is itself an accountability failure.", "relation": "challenges", "counterpart": ["ISO-37000-2021.P5"], "relation_note": "Oversight that does not notice its own absence is not oversight — the story proves the gap."}, {"id": "PMI-GEC-LISBON-2026.HANDOVER", "ref": "Matt, key takeaways", "statement": "When a project is handed from one PM to another, a consistent handover is needed for the next PM to be accountable at all.", "relation": "extends", "counterpart": [], "relation_note": "Continuity between successive accountable people is not addressed anywhere in the corpus."}, {"id": "PMI-GEC-LISBON-2026.URGENT-INFORMAL", "ref": "Anna & JP, main point 8", "statement": "Weekly meetings track actions, decisions and risks, but urgent issues also need informal channels.", "relation": "extends", "counterpart": [], "relation_note": "The informal channel alongside the routine has no standard analogue."}, {"id": "PMI-GEC-LISBON-2026.AI-HUMAN-IN-LOOP", "ref": "Ritesh, AI and the future of accountability", "statement": "If AI generates the report and AI provides the feedback, the human connection is lost entirely. The value of a project manager is in the conversations, judgment and decisions technology cannot replicate. AI should augment accountability frameworks with a human in the loop at critical decision points — PMs submit, AI analyses and flags patterns, the PM interprets and acts.", "relation": "extends", "counterpart": [], "relation_note": "The newest material in the repository, and the only forward-looking item: no instrument contemplates AI in the accountability loop."}, {"id": "PMI-GEC-LISBON-2026.PEER-ACCOUNTABILITY", "ref": "Matt, key takeaways", "statement": "Peer-to-peer accountability defined by a social contract shares the load across the team, but a single point of contact for escalation is still needed.", "relation": "operationalises", "counterpart": ["ISO-37000-2021.P4"], "relation_note": "Distributed load with a single escalation point preserved."}, {"id": "PMI-GEC-LISBON-2026.INCENTIVES-OVER-REPERCUSSIONS", "ref": "Ritesh, question 2 — incentives over repercussions", "statement": "Promoting accountability works better through a targeted incentive-based approach than through punishment. The critical foundation is goal clarity in a common language.", "relation": "corroborates", "counterpart": ["OECD-CG-2023.VI"], "relation_note": "Incentivizing the behavior, reached independently of the 2023 revision."}, {"id": "PMI-GEC-LISBON-2026.RECOGNISE-OWNERSHIP", "ref": "Anna & JP, main point 9; JP notes", "statement": "Recognition should include taking responsibility and ownership, not only successful results.", "relation": "operationalises", "counterpart": ["OECD-CG-2023.VI"], "relation_note": "Makes the incentive attach to taking responsibility, not only to the result."}, {"id": "PMI-GEC-LISBON-2026.CALIBRATED-RECOGNITION", "ref": "Ritesh, question 2 — recognition", "statement": "Recognition need not be financial — acknowledging a milestone, a thank-you email or a personal phone call can be equally powerful. But over-praising people for doing their basic job drains recognition of meaning. Calibrate it to the level of impact.", "relation": "extends", "counterpart": [], "relation_note": "Recognition saturation — praise for the basic job draining the currency — is in no instrument."}, {"id": "PMI-GEC-LISBON-2026.VISIBILITY-MOTIVATES", "ref": "Anna & JP, main point 9", "statement": "People become more accountable when given visibility and exposure. Team members rather than only project managers should present updates, including junior employees presenting to leadership or customers — it helps people feel connected to outcomes.", "relation": "extends", "counterpart": [], "relation_note": "Exposure as a motivator, including juniors presenting upward, is absent from the corpus."}, {"id": "PMI-GEC-LISBON-2026.RECOGNITION-PROGRAMMES", "ref": "Carolyn & Martina, rewards and incentives", "statement": "Formal and informal recognition initiatives such as 'hero of the month' awards, celebrating successes and reinforcing desired behaviors; sharing small success stories with small trophies.", "relation": "operationalises", "counterpart": ["OECD-CG-2023.VI"], "relation_note": "Named schemes through which the incentive becomes visible."}, {"id": "PMI-GEC-LISBON-2026.ELEPHANT-AWARD", "ref": "Cecilia, question 1 — practical examples", "statement": "An 'elephant in the room award': peer recognition given to people willing to name difficult issues others were avoiding, used as positive informal reinforcement of courage and openness.", "relation": "extends", "counterpart": [], "relation_note": "Peer recognition for naming what others avoid rewards the behavior accountability depends on."}, {"id": "PMI-GEC-LISBON-2026.POLICIES-NOT-ENOUGH", "ref": "Misbah, key takeaway 5", "statement": "Written policies alone are insufficient. Accountability frameworks require active recognition, political support and cultural reinforcement to take hold.", "relation": "challenges", "counterpart": ["ESRS-G1.G1-1"], "relation_note": "A disclosed policy is not a working system without recognition and political backing."}, {"id": "PMI-GEC-LISBON-2026.HIGHER-ROLES", "ref": "Carolyn & Martina, notes", "statement": "Accountability can be promoted by opening opportunities for higher roles to those who take it on.", "relation": "extends", "counterpart": [], "relation_note": "Advancement as a form of recognition for taking accountability is unaddressed."}], "by_dimension": {"vision": {"provisions": ["PMI-GEC-LISBON-2026.SHARED-MEANING", "PMI-GEC-LISBON-2026.THRESHOLDS", "PMI-GEC-LISBON-2026.TOR", "PMI-GEC-LISBON-2026.THREE-LAYERS", "PMI-GEC-LISBON-2026.VISION-BUYIN"], "headline": "The word is used constantly and still means different things at the same table.", "spotlight": {"practice": "Terms of Reference at the start of every new assignment — a short written statement of responsibilities and expectations. It is routinely treated as a nice-to-have and skipped, and that omission is where accountability starts to erode.", "contributor": "Ritesh's table", "derived_from": ["PMI-GEC-LISBON-2026.TOR"]}}, "trust": {"provisions": ["PMI-GEC-LISBON-2026.AUTHORITY-CHAIN", "PMI-GEC-LISBON-2026.CALIBRATED-TRUST", "PMI-GEC-LISBON-2026.EMPOWER-SOLUTIONS", "PMI-GEC-LISBON-2026.EMPOWERMENT-TRADEOFF", "PMI-GEC-LISBON-2026.ACCOUNTABILITY-PARTNERS"], "headline": "Verification should scale with the stakes, not with the manager's anxiety.", "spotlight": {"practice": "Calibrate verification to decision severity: close oversight where safety, money or health are at stake, autonomy as the default everywhere else. Applying 'trust but verify' uniformly reads as distrust to experienced professionals and undoes the empowerment that produced the performance.", "contributor": "Ritesh's table", "derived_from": ["PMI-GEC-LISBON-2026.CALIBRATED-TRUST", "PMI-GEC-LISBON-2026.EMPOWERMENT-TRADEOFF"]}}, "transparency": {"provisions": ["PMI-GEC-LISBON-2026.TRUTHFUL-REPORTING", "PMI-GEC-LISBON-2026.VISIBLE-ACCOUNTABILITY", "PMI-GEC-LISBON-2026.NO-WHISPER", "PMI-GEC-LISBON-2026.COLLAB-PROBLEM-SOLVING", "PMI-GEC-LISBON-2026.WASTEFUL-COMPETITION"], "headline": "Visibility into who owns what was among the most cited barriers the tables returned to.", "spotlight": {"practice": "Two ground rules that dismantle defensiveness: don't whisper to neighbours — raise it inside the team rather than around it; and shift off long emails, which leave room to misread tone and can be used as a shield ('well, I sent the email'). A quick call resolves what an email thread entrenches.", "contributor": "Yasser's table", "derived_from": ["PMI-GEC-LISBON-2026.NO-WHISPER"]}}, "leadership": {"provisions": ["PMI-GEC-LISBON-2026.MODEL-FROM-TOP", "PMI-GEC-LISBON-2026.FAILURE-DAY", "PMI-GEC-LISBON-2026.OPEN-HONEST-CHARTER", "PMI-GEC-LISBON-2026.ASSUME-POSITIVE-INTENT", "PMI-GEC-LISBON-2026.VISIBLE-PRESENCE", "PMI-GEC-LISBON-2026.BE-BRAVE"], "headline": "If leadership does not go first, people hide mistakes — and the delays and overruns arrive later and larger.", "spotlight": {"practice": "A 'failure day', described at the table as modeled on NASA: a document starts with the most senior leaders and passes downward, each person adding their own failures, personal and professional. Seeing that the people at the top failed too and still got there is what makes it safe for everyone below to add a line.", "contributor": "Carolyn & Martina's table", "derived_from": ["PMI-GEC-LISBON-2026.FAILURE-DAY", "PMI-GEC-LISBON-2026.MODEL-FROM-TOP"]}}, "safety": {"provisions": ["PMI-GEC-LISBON-2026.FEAR-BLOCKS", "PMI-GEC-LISBON-2026.FEARLESSNESS", "PMI-GEC-LISBON-2026.SHADOW-COMMITTEE", "PMI-GEC-LISBON-2026.BOTTOM-UP-HARDER", "PMI-GEC-LISBON-2026.PROGRESS-OVER-PERFECTION"], "headline": "Carrying a hard accountability decision alone is the reported experience; the fix is a room of peers, not more courage.", "spotlight": {"practice": "An informal 'shadow steering committee' — a peer forum with no reporting line into it, where people can talk through accountability problems openly. It was described as an answer to loneliness: the difficulty is often not knowing what to do, but having nowhere to say it out loud first.", "contributor": "Carolyn & Martina's table", "derived_from": ["PMI-GEC-LISBON-2026.SHADOW-COMMITTEE", "PMI-GEC-LISBON-2026.BOTTOM-UP-HARDER"]}}, "learning": {"provisions": ["PMI-GEC-LISBON-2026.LESSONS-IMPLEMENTED", "PMI-GEC-LISBON-2026.CROSS-FUNCTIONAL-LESSONS", "PMI-GEC-LISBON-2026.SAFETY-TEAM-PRACTICE", "PMI-GEC-LISBON-2026.LEARNING-NOT-ENOUGH"], "headline": "Lessons learned was named one of the most significant gaps in the broader workshop.", "spotlight": {"practice": "Rename the artifact: 'lessons implemented', not 'lessons learned'. The failure mode described was concrete — a safety failure that never reached the finance team facing the same issue, and separate programs recycling identical failures in silos.", "contributor": "Carolyn & Martina's table, with Ritesh's cross-organization findings", "derived_from": ["PMI-GEC-LISBON-2026.LESSONS-IMPLEMENTED", "PMI-GEC-LISBON-2026.CROSS-FUNCTIONAL-LESSONS"]}}, "feedback": {"provisions": ["PMI-GEC-LISBON-2026.FEEDBACK-TIMING", "PMI-GEC-LISBON-2026.REALTIME-IDEAS", "PMI-GEC-LISBON-2026.EXPLAIN-DECISIONS", "PMI-GEC-LISBON-2026.KAIZEN", "PMI-GEC-LISBON-2026.TEAM-SOLVES"], "headline": "Capture the idea where the work happens, and close the loop even when the answer is no.", "spotlight": {"practice": "Cards placed beside operational tasks so operators can write down suggestions in real time, as they notice them rather than at a retrospective weeks later. Paired with the discipline of explaining why a suggestion was not taken — not every idea can be implemented, and silence is what stops the next one.", "contributor": "Carolyn & Martina's table, with Anna & JP's table", "derived_from": ["PMI-GEC-LISBON-2026.REALTIME-IDEAS", "PMI-GEC-LISBON-2026.EXPLAIN-DECISIONS"]}}, "decisions": {"provisions": ["PMI-GEC-LISBON-2026.ACCOUNTABILITY-MATRIX", "PMI-GEC-LISBON-2026.NOT-ALL-FAILURES", "PMI-GEC-LISBON-2026.SAFETY-OVERRIDES", "PMI-GEC-LISBON-2026.ACT-UNDER-UNCERTAINTY", "PMI-GEC-LISBON-2026.INVESTIGATE-FIRST"], "headline": "The strongest challenge from the room: not everything should be framed as learning.", "spotlight": {"practice": "An accountability matrix used after an incident or quality issue. Investigate what happened; determine whether the cause was human behavior, knowledge and training, or process and system; then respond in kind — coaching, training, process correction, or real consequences where there was negligence. Its purpose is to stop the organization jumping to blame, while still letting it act where action is warranted.", "contributor": "Cecilia's table", "derived_from": ["PMI-GEC-LISBON-2026.ACCOUNTABILITY-MATRIX", "PMI-GEC-LISBON-2026.NOT-ALL-FAILURES", "PMI-GEC-LISBON-2026.INVESTIGATE-FIRST"]}}, "roles": {"provisions": ["PMI-GEC-LISBON-2026.SINGLE-OWNER", "PMI-GEC-LISBON-2026.UPFRONT-ALLOCATION", "PMI-GEC-LISBON-2026.RACI-ALIGNMENT", "PMI-GEC-LISBON-2026.LAYERS", "PMI-GEC-LISBON-2026.NO-TRANSFER", "PMI-GEC-LISBON-2026.REEVALUATE", "PMI-GEC-LISBON-2026.REPORTING-LINES"], "headline": "Everyone is accountable for something; nobody is accountable for everything. The layers have to be explicit.", "spotlight": {"practice": "Assign an owner to every piece of scope at the very beginning, and re-align on that matrix at kickoff with the client and suppliers in the room — the recurring failure is that commercial, client, supplier and delivery teams each read the same RACI differently and only discover it under pressure. Re-run it when a long program changes shape.", "contributor": "Yasser's table, with Matt's table", "derived_from": ["PMI-GEC-LISBON-2026.UPFRONT-ALLOCATION", "PMI-GEC-LISBON-2026.RACI-ALIGNMENT", "PMI-GEC-LISBON-2026.REEVALUATE"]}}, "capability": {"provisions": ["PMI-GEC-LISBON-2026.RIGHT-PEOPLE", "PMI-GEC-LISBON-2026.SKILL-MAP", "PMI-GEC-LISBON-2026.NETWORKS", "PMI-GEC-LISBON-2026.SUPPORTED-NOT-ALONE", "PMI-GEC-LISBON-2026.CAPABILITY-GAPS"], "headline": "You cannot hold people accountable if they are not able to do the job.", "spotlight": {"practice": "A skill map at project start-up, identifying where the skills to carry an accountability actually sit before the accountability is handed out. The question behind it, put plainly at the table: is the company setting these people up to be accountable, or setting them up to fail?", "contributor": "Matt's table", "derived_from": ["PMI-GEC-LISBON-2026.SKILL-MAP", "PMI-GEC-LISBON-2026.RIGHT-PEOPLE"]}}, "governance": {"provisions": ["PMI-GEC-LISBON-2026.WEEKLY-BACKBONE", "PMI-GEC-LISBON-2026.FOLLOW-THROUGH", "PMI-GEC-LISBON-2026.HANDOVER", "PMI-GEC-LISBON-2026.URGENT-INFORMAL", "PMI-GEC-LISBON-2026.AI-HUMAN-IN-LOOP", "PMI-GEC-LISBON-2026.PEER-ACCOUNTABILITY"], "headline": "The weekly report is the backbone — and the test is whether anyone notices when it stops arriving.", "spotlight": {"practice": "The story that made the point: a weekly report was periodically moved so executives could not reach it automatically, and nobody ever noticed or pushed back. The routine existed; the follow-through did not. A governance routine only works if its absence is detected.", "contributor": "recounted at Ritesh's table (individual and employer not identified)", "derived_from": ["PMI-GEC-LISBON-2026.FOLLOW-THROUGH", "PMI-GEC-LISBON-2026.WEEKLY-BACKBONE"]}}, "recognition": {"provisions": ["PMI-GEC-LISBON-2026.INCENTIVES-OVER-REPERCUSSIONS", "PMI-GEC-LISBON-2026.RECOGNISE-OWNERSHIP", "PMI-GEC-LISBON-2026.CALIBRATED-RECOGNITION", "PMI-GEC-LISBON-2026.VISIBILITY-MOTIVATES", "PMI-GEC-LISBON-2026.RECOGNITION-PROGRAMMES", "PMI-GEC-LISBON-2026.ELEPHANT-AWARD", "PMI-GEC-LISBON-2026.POLICIES-NOT-ENOUGH", "PMI-GEC-LISBON-2026.HIGHER-ROLES"], "headline": "Incentives beat repercussions — but over-praising the basic job drains recognition of its meaning.", "spotlight": {"practice": "An 'elephant in the room award': peer recognition for the person willing to name the difficult issue everyone else was avoiding. It rewards the behavior that accountability actually depends on, rather than the outcome — and because it comes from peers rather than management, it is hard to game.", "contributor": "Cecilia's table", "derived_from": ["PMI-GEC-LISBON-2026.ELEPHANT-AWARD", "PMI-GEC-LISBON-2026.RECOGNISE-OWNERSHIP"]}}}, "cross_cutting": {"note": "Points the room made that do not belong to a single element. They are the argument for the model existing at all.", "findings": [{"statement": "The term is widely used and still too vague. Many companies claim to value accountability, but there is no widely shared practical model organizations can apply consistently — which is what reinforced the need for something more actionable than definitions.", "ref": "Cecilia, summary point 8", "derived_from": []}, {"statement": "Accountability is a cultural challenge before it is a process challenge. It fails in culture — people do not feel safe, goals are misaligned, leadership says one thing and rewards another — before it fails in process.", "ref": "JP notes, key takeaway; Cecilia, fit into the Lisbon Bridge Model", "derived_from": []}, {"statement": "Context matters: accountability looks different across industries, cultures, vendors and reporting environments. Identical metrics may reflect different reporting cultures rather than different realities.", "ref": "Cecilia, summary point 6", "derived_from": []}, {"statement": "Accountability should not become control. If management holds it too tightly, teams become less empowered and it has to move closer to where the work happens.", "ref": "Anna & JP, main point 10; Cecilia, fit into the Lisbon Bridge Model", "derived_from": []}]}, "convergence": {"what_it_is": "Every community provision classified by how it sits with the standards corpus. It is analysis layered on the raw layer, not part of it: changing a relation changes nothing a respondent is told.", "relations": {"corroborates": {"label": "Corroborates", "gloss": "The tables reached, from practice, what an instrument already requires. Nobody in the room was reading ISO 37000 — which is why this is the strongest validation the model has."}, "operationalises": {"label": "Operationalizes", "gloss": "The standard says what must be true; the table says what they actually built. This is where the layer earns its place."}, "extends": {"label": "Extends", "gloss": "No instrument in the corpus addresses this at all. Several are among the most practically useful items in the repository — and the most exposed, since nothing authoritative stands behind them."}, "challenges": {"label": "Challenges", "gloss": "Practitioner experience argues with an instrument, or with how it is commonly read. These are preserved rather than smoothed over."}}}}, "bridge": {"schema": "accountability-repository/bridge@1", "updated": "2026-10-04", "note": "Which structural part of the bridge each element is. Geometry lives in the view; this file holds the assignment, so the build can check that all twelve elements are placed exactly once and that none is placed on a part belonging to another part.", "metaphor": {"cables": "Organizational Environment — the suspension cables. They carry the load but only work in tension, and only if the towers hold.", "deck": "Project Conditions — the surface people actually walk on. Where the work happens, and where a weak span is felt first.", "towers": "Structures — the towers and piers. Everything above rests on them; when they are weak nothing else compensates for long."}, "placement": {"cables": {"pillar": "environment", "members": ["vision", "trust", "transparency", "leadership"]}, "deck": {"pillar": "conditions", "members": ["safety", "learning", "feedback", "decisions"]}, "towers": {"pillar": "structures", "members": ["roles", "capability", "governance", "recognition"]}}, "short_labels": {"vision": "Vision", "trust": "Trust", "transparency": "Transparency", "leadership": "Leadership", "safety": "Safety", "learning": "Learning", "feedback": "Feedback", "decisions": "Decisions", "roles": "Roles", "capability": "Capability", "governance": "Governance", "recognition": "Recognition"}, "encoding": {"position": "Which element — fixed, so the same element is always in the same place and two bridges can be compared at a glance.", "fill": "The perception score, as the part's own hue at an opacity floor of 0.18 so nothing disappears. Faint means weakly felt.", "marker": "The evidence state, in the status palette, as a dot on the element. Shown with a legend and never carried by color alone.", "why_not_deform": "An earlier option was to sag the cables and dip the deck by score. Rejected: it reads as decoration, it makes two bridges hard to compare, and it encodes the weakest signal in the model as the most dramatic visual."}}, "artefacts": {"schema": "accountability-repository/artefacts@1", "updated": "2026-10-20", "note": "Plain-language wording of the evidence question asked at each element and step. Each question is the plain reading of an artifact the recommendation ladder lists at that step. 'does_not_count' is a short noun phrase, shown after the label 'Doesn't count'. Revised for v3.2.0: shorter questions that fit Yes, Partly and No; step 4 asks whether people outside the group being assessed can see the thing, so it works for a team, a project or an organization.", "artefacts": {"vision.1": {"ask": "Is there a short written statement of each important outcome, saying what success looks like?", "looks_like": "A one-page note per outcome: what we want to achieve and how we will know it worked.", "does_not_count": "A strategy deck or goals list with no way to tell whether it worked."}, "vision.2": {"ask": "When priorities last changed, did a written note say what was dropped as well as what was added?", "looks_like": "A change note or email: \"we now do X, and Y is stopped\".", "does_not_count": "An announcement that lists only the new priority."}, "vision.3": {"ask": "Has someone checked that where money, people and time went matches the stated priorities?", "looks_like": "A review comparing the stated priorities with the budget, headcount and leadership attention each one received.", "does_not_count": "Assuming the priorities were followed because they were announced."}, "vision.4": {"ask": "Can people outside the group you are assessing see your outcomes and how success is measured?", "looks_like": "Outcomes and success measures on a website, in a report or in a public commitment.", "does_not_count": "Sharing them only inside the group."}, "trust.1": {"ask": "Is there a written list of who can approve what, up to what value or level of risk?", "looks_like": "A table of spend limits, sign-off levels and who holds each.", "does_not_count": "An informal understanding of who approves what."}, "trust.2": {"ask": "Have you written down how much risk people may take without asking, for different kinds of decision?", "looks_like": "A statement such as \"teams may accept a delay of up to two weeks without asking a manager\".", "does_not_count": "A general instruction to \"use good judgment\"."}, "trust.3": {"ask": "Has someone checked a few decisions people made on their own, looking at the reasoning, not the result?", "looks_like": "A review of a few such decisions that asks how each was reasoned, not how it turned out.", "does_not_count": "Judging decisions only by how they turned out."}, "trust.4": {"ask": "Can people outside the group you are assessing see an example of a decision that was backed even though it went badly?", "looks_like": "A shared case study of a decision a leader defended, and why.", "does_not_count": "Examples of decisions that were only praised when they worked."}, "transparency.1": {"ask": "Is there a written rule for when a problem must be raised, and who it goes to?", "looks_like": "A note saying \"if a risk is above X, tell Y within Z days\".", "does_not_count": "A general call to \"raise problems early\"."}, "transparency.2": {"ask": "Are important decisions written up with the reasons and shared with the people they affect?", "looks_like": "A decision note giving the reasons and the options turned down, sent to those affected.", "does_not_count": "Announcing the outcome with no reasons."}, "transparency.3": {"ask": "Has someone outside the team checked whether problems that should have been raised actually were?", "looks_like": "A review by someone outside the team, looking for problems that were not raised.", "does_not_count": "The team checking itself."}, "transparency.4": {"ask": "Can people outside the group you are assessing see an account of a failure and how it was put right?", "looks_like": "A shared account of something that went wrong and what was done about it.", "does_not_count": "Reports that show only successes."}, "leadership.1": {"ask": "Is there a written or minuted account where a leader explains a decision that did not work?", "looks_like": "Minutes, a town-hall record or a note where a named leader sets out what failed and what they learned.", "does_not_count": "A general statement that \"we learn from mistakes\"."}, "leadership.2": {"ask": "Is there a place where people can propose improvements, with a record of what happened to each one?", "looks_like": "A record of each proposal, with the decision and its date.", "does_not_count": "A suggestion box nobody tracks."}, "leadership.3": {"ask": "Do the leaders of the group you are assessing formally review how well they did their own job, including how they responded to bad news?", "looks_like": "A minuted review of the leadership group's own performance.", "does_not_count": "Reviewing the group's results but never the leaders' own conduct."}, "leadership.4": {"ask": "Can people outside the group you are assessing see how leaders are held to account?", "looks_like": "A shared statement of how leaders' performance is reviewed and what happens if they fall short.", "does_not_count": "An internal performance policy that stays inside."}, "safety.1": {"ask": "Is there a written way to raise a concern that does not go through your line manager?", "looks_like": "A named person or channel outside the reporting line, in writing, that people can find.", "does_not_count": "An open-door policy with no other route."}, "safety.2": {"ask": "Is there a written description of what happens after someone raises a concern, with timings?", "looks_like": "A short procedure that says who looks at it and by when.", "does_not_count": "A reporting channel with no stated timings."}, "safety.3": {"ask": "Has someone checked what stops people from raising concerns, such as language, shift patterns or fear?", "looks_like": "A short review of the barriers, with the actions that followed.", "does_not_count": "Assuming the route works because it exists."}, "safety.4": {"ask": "Can people outside the group you are assessing see how well the route for raising concerns works?", "looks_like": "A shared report of how many concerns were raised and how they were handled.", "does_not_count": "Numbers shared only with management or the board."}, "learning.1": {"ask": "When something goes wrong, does your review work out the causes before deciding who was at fault?", "looks_like": "A review template where the causes are filled in before anyone is named as responsible.", "does_not_count": "A review that starts by naming who was at fault."}, "learning.2": {"ask": "Can you point to something that changed because of a lesson learned?", "looks_like": "A record that links a lesson to the procedure, checklist or plan it changed.", "does_not_count": "A lessons-learned list with no link to a change."}, "learning.3": {"ask": "Do you look across several cases to find causes that keep coming back?", "looks_like": "A review of several incidents or projects that names a common cause.", "does_not_count": "Single reviews that are never compared."}, "learning.4": {"ask": "Do you share lessons from problems with peers outside the group you are assessing, including uncomfortable ones?", "looks_like": "A talk, article or shared note describing what went wrong and what you learned.", "does_not_count": "Lessons that stay inside the group."}, "feedback.1": {"ask": "Do you keep a list of open problems, each with one named owner and a date to review it?", "looks_like": "A list of issues, each with an owner and a next review date.", "does_not_count": "A list with no owner or no review date."}, "feedback.2": {"ask": "When someone raises an issue, is the proposed response checked with them before it goes ahead?", "looks_like": "A note or message showing the person who raised it agreed the response.", "does_not_count": "Telling people the outcome after the decision is made."}, "feedback.3": {"ask": "Do you measure how well raising an issue works, such as how long issues take to be resolved?", "looks_like": "A measure such as time to resolve, reviewed at least yearly, with a change made because of it.", "does_not_count": "Collecting feedback and filing the results."}, "feedback.4": {"ask": "Can people outside the group you are assessing see what was raised and what you did about it?", "looks_like": "A \"you said, we did\" note or report that is shared.", "does_not_count": "Keeping the issue list inside the group."}, "decisions.1": {"ask": "Do you have a written way to decide how to respond when something goes wrong, so honest mistakes are treated differently from reckless behavior?", "looks_like": "A short checklist used before deciding a response, such as: was harm intended, was the person supported, was a known risk ignored.", "does_not_count": "Deciding case by case with nothing written down."}, "decisions.2": {"ask": "Do your decision records say what was uncertain at the time?", "looks_like": "A decision note that says what was not known when the call was made.", "does_not_count": "A record of the decision and its reasons that never mentions uncertainty."}, "decisions.3": {"ask": "Do you check that similar cases get similar treatment?", "looks_like": "A review that compares how similar cases were handled.", "does_not_count": "Handling every case on its own and never comparing."}, "decisions.4": {"ask": "Can people outside the group you are assessing see a summary of cases and how each kind was handled, with names removed?", "looks_like": "A shared summary giving, for each kind of case, how many there were and what the response was.", "does_not_count": "Case details that stay inside, or a summary with no responses."}, "roles.1": {"ask": "Is there a list where each important outcome has one owner who has agreed to it?", "looks_like": "A list with one outcome per row, one named owner, and a sign they agreed.", "does_not_count": "A responsibility chart nobody has agreed to."}, "roles.2": {"ask": "Have you checked that each person held accountable has the authority to deliver?", "looks_like": "A review comparing what people answer for with what they can decide and spend.", "does_not_count": "Giving people accountability without checking their authority."}, "roles.3": {"ask": "Is it written down who is responsible when work passes from one team to another?", "looks_like": "A list naming an owner for each point where work passes between teams.", "does_not_count": "Clear ownership inside teams, with nobody owning the gaps."}, "roles.4": {"ask": "Can people outside the group you are assessing see how the group is structured and who is responsible for what?", "looks_like": "A shared description of who does what and who decides.", "does_not_count": "A manual only insiders can read."}, "capability.1": {"ask": "Do you have records showing each accountable owner has the skills for the job?", "looks_like": "Training, qualification or assessment records for the people holding accountability.", "does_not_count": "Assuming skills from job title or seniority."}, "capability.2": {"ask": "Do you review skills on a regular schedule, and also when something changes, such as a new system or role?", "looks_like": "A recurring review, plus triggers such as a new system or a change of role.", "does_not_count": "An annual appraisal on its own."}, "capability.3": {"ask": "Have you checked that people have the resources for what they are responsible for?", "looks_like": "A review comparing budget, time and support with each person's responsibilities.", "does_not_count": "Giving people responsibility without checking their resources."}, "capability.4": {"ask": "Do you offer training or support on accountability to partners or suppliers outside the group you are assessing?", "looks_like": "Training, assessment or support extended to organizations you depend on.", "does_not_count": "Contract clauses that require competence but offer no support."}, "governance.1": {"ask": "Is there a regular meeting to review status, decisions and risks, with a fixed minimum agenda?", "looks_like": "A standing meeting with a written list of items covered every time.", "does_not_count": "A regular meeting with a flexible agenda."}, "governance.2": {"ask": "Do you have written step-by-step guides for situations that keep recurring?", "looks_like": "A guide for things that keep happening, such as a serious incident or a change of leader.", "does_not_count": "Relying on experienced people to know what to do."}, "governance.3": {"ask": "Has whoever oversees the group asked someone independent to review how it is run?", "looks_like": "A review asked for by the overseer and carried out by someone outside the group being reviewed.", "does_not_count": "Management reviewing itself."}, "governance.4": {"ask": "Can people outside the group you are assessing see your written guides for recurring situations?", "looks_like": "Guides shared with partners or peers.", "does_not_count": "Guides kept inside the group."}, "recognition.1": {"ask": "Do you have a record of recognizing someone for how they behaved, whatever the result?", "looks_like": "A note recognizing someone for raising a concern or making a sound call, even when the outcome was poor.", "does_not_count": "Recognition only for successful results."}, "recognition.2": {"ask": "Is there a written process for deciding recognition and pay?", "looks_like": "A documented way of deciding rewards: the criteria, who decides, and how it is recorded.", "does_not_count": "Manager discretion with nothing written down."}, "recognition.3": {"ask": "Have you checked whether what you reward matches what you say you value?", "looks_like": "A review comparing rewards given with the stated values.", "does_not_count": "Setting incentives and never reviewing them."}, "recognition.4": {"ask": "Can people outside the group you are assessing see how recognition and reward are decided?", "looks_like": "A shared statement of how rewards are decided and how they link to long-term results.", "does_not_count": "An internal pay policy that stays inside."}}}, "gaps": {"unmapped_provisions": [{"id": "ISO-37000-2021.P10", "source": "ISO-37000-2021", "ref": "Enabling principle — Social responsibility"}, {"id": "OECD-MNE-2023.DD2", "source": "OECD-MNE-2023", "ref": "Due diligence step 2"}, {"id": "OECD-MNE-2023.VII", "source": "OECD-MNE-2023", "ref": "Chapter VII — Bribery and corruption"}, {"id": "ISO-26000-2010.PR3", "source": "ISO-26000-2010", "ref": "Principle 3"}, {"id": "ISO-26000-2010.PR4", "source": "ISO-26000-2010", "ref": "Principle 4"}, {"id": "UNGPRF-2015.A", "source": "UNGPRF-2015", "ref": "Part A — Governance of respect"}, {"id": "UNGPRF-2015.B", "source": "UNGPRF-2015", "ref": "Part B — Defining the focus of reporting"}, {"id": "UNGPRF-2015.C", "source": "UNGPRF-2015", "ref": "Part C — Management of salient issues"}, {"id": "GS-CSO.C10", "source": "GS-CSO", "ref": "Commitment 10"}, {"id": "ESRS-G1.G1-6", "source": "ESRS-G1", "ref": "Disclosure Requirement G1-6"}], "unmapped_jurisdictions": ["Canada", "United Arab Emirates and the wider Gulf", "China", "Mexico", "Nigeria", "Indonesia", "Switzerland", "Netherlands (beyond the EU baseline)", "Spain and Italy (beyond the EU baseline)"]}, "sources": [{"id": "OECD-MNE-2023", "title": "OECD Guidelines for Multinational Enterprises on Responsible Business Conduct", "issuer": "OECD", "edition": "2023 update", "tier": "A", "applies_to": ["enterprise", "multinational", "supply-chain"], "url": "https://www.oecd.org/content/dam/oecd/en/publications/reports/2023/06/oecd-guidelines-for-multinational-enterprises-on-responsible-business-conduct_a0b49990/81f92357-en.pdf", "verified": true, "note": "Nine topic chapters plus a six-step risk-based due diligence expectation running through all of them.", "verified_via": "reputable-secondary", "verification_note": "Chapter list and six-step due diligence cycle confirmed via a law-firm analysis of the 2023 update; the OECD PDF is linked but was not machine-readable at fetch time. Re-verify against the OECD text before external publication."}, {"id": "OECD-CG-2023", "title": "G20/OECD Principles of Corporate Governance", "issuer": "OECD / G20", "edition": "2023 revision", "tier": "A", "applies_to": ["listed-company", "enterprise", "state-owned"], "url": "https://www.oecd.org/en/publications/g20-oecd-principles-of-corporate-governance-2023_ed750b30-en.html", "verified": true, "note": "Six chapters. Chapter VI (Sustainability and resilience) is new in the 2023 revision.", "verified_via": "official-secondary", "verification_note": "Six chapter titles confirmed from a hosted copy of the OECD publication. Chapter VI content confirmed from the OECD press release and a secondary analysis."}, {"id": "ISO-37000-2021", "title": "ISO 37000:2021 Governance of organizations — Guidance", "issuer": "ISO", "edition": "2021", "tier": "A", "applies_to": ["any-organization"], "url": "https://www.iso.org/standard/65036.html", "verified": true, "note": "The closest thing to a universal, sector-neutral definition of organizational accountability. Anchor standard for this repository.", "verified_via": "primary", "verification_note": "Eleven principles and the accountability definition confirmed from the ISO/TC 309 committee's own presentation of the standard."}, {"id": "ISO-26000-2010", "title": "ISO 26000:2010 Guidance on social responsibility", "issuer": "ISO", "edition": "2010", "tier": "A", "applies_to": ["any-organization"], "url": "https://www.iso.org/iso-26000-social-responsibility.html", "verified": true, "note": "Guidance, not requirements. Names accountability and transparency as the first two principles of social responsibility.", "verified_via": "reputable-secondary", "verification_note": "Seven principles and seven core subjects confirmed via ASQ. Long-established and stable content; ISO's own page does not reproduce them."}, {"id": "ISO-37002-2021", "title": "ISO 37002:2021 Whistleblowing management systems — Guidelines", "issuer": "ISO", "edition": "2021", "tier": "A", "applies_to": ["any-organization"], "url": "https://www.iso.org/standard/65035.html", "verified": true, "verified_via": "reputable-secondary", "verification_note": "Three guiding principles (trust, impartiality, protection) confirmed via a specialist secondary source. Standard text is paywalled."}, {"id": "ISO-21502-2020", "title": "ISO 21502:2020 Project, programme and portfolio management — Guidance on project management", "issuer": "ISO", "edition": "2020", "tier": "A", "applies_to": ["project", "programme"], "url": "https://standards.iteh.ai/catalog/standards/iso/f3deaa3a-e424-42fe-aa82-99fad5c395f5/iso-21502-2020", "verified": true, "note": "Primary source for project-scope accountability: sponsor role, delegated authority, escalation.", "verified_via": "reputable-secondary", "verification_note": "Clause 4.5 and 4.5.4 sponsor accountabilities confirmed via a detailed secondary clause-by-clause commentary. Standard text is paywalled. Verify clause numbering against the standard before citing externally."}, {"id": "AA1000AP-2018", "title": "AA1000 AccountAbility Principles (2018)", "issuer": "AccountAbility", "edition": "2018", "tier": "C", "applies_to": ["any-organization"], "url": "https://www.accountability.org/standards/aa1000-accountability-principles", "verified": true, "note": "The only widely used standard whose explicit subject is accountability itself.", "verified_via": "primary", "verification_note": "Four principles and their requirements confirmed from the AA1000AP (2018) standard document itself."}, {"id": "GRI-2-2021", "title": "GRI 2: General Disclosures 2021", "issuer": "Global Reporting Initiative", "edition": "2021, effective 1 Jan 2023", "tier": "C", "applies_to": ["any-organization"], "url": "https://www.globalreporting.org/publications/documents/english/gri-2-general-disclosures-2021/", "verified": true, "note": "Useful as an evidence checklist: each disclosure names an artefact an assessor can ask to see.", "verified_via": "primary", "verification_note": "All 30 disclosure titles confirmed from the GRI 2 standard PDF."}, {"id": "UNGP-2011", "title": "UN Guiding Principles on Business and Human Rights", "issuer": "United Nations (endorsed by the Human Rights Council)", "edition": "2011", "tier": "A", "applies_to": ["enterprise", "any-organization"], "url": "https://www.ungpreporting.org/resources/the-ungps/", "verified": true, "verified_via": "reputable-secondary", "verification_note": "The eight GP31 effectiveness criteria confirmed via secondary source; these are among the most widely reproduced provisions in the field and are stable."}, {"id": "UNGPRF-2015", "title": "UN Guiding Principles Reporting Framework", "issuer": "Shift / Mazars", "edition": "2015, with 2017 implementation guidance", "tier": "C", "applies_to": ["enterprise"], "url": "https://www.ungpreporting.org/framework-guidance/", "verified": true, "note": "31 questions in three parts; 8 overarching questions form the reporting threshold. A good model for tiered questioning.", "verified_via": "primary", "verification_note": "Three-part structure and the eight overarching questions confirmed from ungpreporting.org."}, {"id": "GS-CSO", "title": "Global Standard for CSO Accountability — 12 Commitments", "issuer": "Global Standard Partnership / Accountable Now / International Civil Society Centre", "edition": "current", "tier": "C", "applies_to": ["ngo", "civil-society", "non-profit"], "url": "https://accountablenow.org/12-commitments/", "verified": true, "note": "Carries the repository when the assessed organization is not a company.", "verified_via": "primary", "verification_note": "All twelve commitments and their three clusters confirmed from Accountable Now."}, {"id": "ESRS-G1", "title": "ESRS G1 Business conduct (European Sustainability Reporting Standards, under CSRD)", "issuer": "EFRAG / European Commission", "edition": "as amended", "tier": "B", "applies_to": ["eu-in-scope-undertaking"], "url": "https://www.efrag.org/sites/default/files/sites/webpublishing/SiteAssets/17%20Draft%20ESRS%20G1%20Business%20Conduct%20November%202022.pdf", "verified": "partial", "note": "G1-1, G1-3 and G1-6 confirmed. G1-2, G1-4 and G1-5 titles not confirmed against the amended text and are deliberately not cited anywhere in this repository.", "verified_via": "partial-secondary", "verification_note": "G1-1, G1-3 and G1-6 confirmed via secondary source. G1-2, G1-4 and G1-5 unconfirmed and cited nowhere in this repository."}, {"id": "PMBOK-7", "title": "A Guide to the Project Management Body of Knowledge (PMBOK Guide), Seventh Edition — the 12 principles", "issuer": "Project Management Institute", "edition": "7th edition", "tier": "C", "applies_to": ["project", "programme", "any-organization"], "url": "https://www.pmi.org/", "verified": true, "note": "Included because the assessed audience is PMI-adjacent; the principles are widely recognised there.", "verified_via": "reputable-secondary", "verification_note": "Twelve principle names confirmed via secondary source; PMBOK 7 is paywalled and has no citable public deep link. Replace the URL with PMI's own page for the edition before external publication."}, {"id": "EDMONDSON-1999", "title": "Edmondson, A. C., 'Psychological Safety and Learning Behavior in Work Teams', Administrative Science Quarterly 44(2), 350-383", "issuer": "Administrative Science Quarterly", "edition": "1999", "tier": "D", "applies_to": ["team"], "url": "https://journals.sagepub.com/doi/10.2307/2666999", "verified": true, "note": "No normative standard defines psychological safety. This is the evidence base the repository leans on instead — and the repository says so rather than dressing it as a standard.", "verified_via": "primary", "verification_note": "Citation confirmed: Administrative Science Quarterly 44(2), 350-383."}, {"id": "REASON-1997", "title": "Reason, J., 'Managing the Risks of Organizational Accidents' — culpability decision tree and the substitution test", "issuer": "Ashgate", "edition": "1997", "tier": "D", "applies_to": ["any-organization"], "url": "https://skybrary.aero/sites/default/files/bookshelf/6141.pdf", "verified": true, "note": "Origin of the 'just culture' distinction between honest error, at-risk behaviour and reckless conduct. Underpins the Responsible Decisions element.", "verified_via": "reputable-secondary", "verification_note": "Substitution test and culpability decision tree confirmed via aviation-safety literature reproducing Reason's model."}, {"id": "WBA-METHOD", "title": "World Benchmarking Alliance scoring approach", "issuer": "World Benchmarking Alliance", "edition": "current", "tier": "M", "applies_to": [], "url": "https://www.worldbenchmarkingalliance.org/about-us/benchmarking-process/scoring-approach", "verified": true, "note": "Method reference only. Binary element scoring, equal weights within a measurement area, redistribution of weight for non-applicable elements, normalisation to 0-100.", "verified_via": "primary", "verification_note": "Scoring approach confirmed from WBA's own methodology page."}, {"id": "PMI-GEC-LISBON-2026", "title": "PMI community recommendations (GEC Lisbon 26)", "issuer": "PMI Global Executive Council — Lisbon Emerging Leaders tabletop conversations", "edition": "GEC Lisbon 2026", "tier": "E", "applies_to": ["any-organization", "project", "programme", "team"], "url": "https://docs.google.com/document/d/1Pa8O2xDtJRuvJeuR_SZI20xEhoengw7JspbKf97hras/edit", "verified": true, "verified_via": "primary", "verification_note": "Read directly from the source document 'Tabletop Conversations – Notes, Transcripts & Summaries'. Contributing tables: Yasser; Inês; Anna & JP; Ritesh; Misbah; Matt; Cecilia; Carolyn & Martina. Ritesh's notes record the broader workshop as covering 10 organizations across 9 countries.", "note": "This is the only source in the repository that is not publicly retrievable. The URL is a Google Doc; anyone outside the group following a citation will hit a permissions wall. Before this layer is used with customers, the conversations need a citable public form — a published paper, a council deliverable, or a stable page — and the URL here should be repointed at it.", "access": "restricted", "release_blocker": true}], "provisions": [{"id": "ISO-37000-2021.P1", "source": "ISO-37000-2021", "ref": "Primary principle — Purpose", "statement": "The organization's purpose is the primary governance principle; everything else is governed in service of it."}, {"id": "ISO-37000-2021.P2", "source": "ISO-37000-2021", "ref": "Foundational principle — Value generation", "statement": "The governing body directs the organization toward the value it exists to generate, for whom, and over what horizon."}, {"id": "ISO-37000-2021.P3", "source": "ISO-37000-2021", "ref": "Foundational principle — Strategy", "statement": "Strategy translates purpose and intended value into direction the organization can act on."}, {"id": "ISO-37000-2021.P4", "source": "ISO-37000-2021", "ref": "Foundational principle — Accountability", "statement": "Accountability is the assignment of, and agreement to, responsibility together with the delegation of authority. The governing body may delegate but remains answerable for fulfilment of its responsibilities.", "keystone": true}, {"id": "ISO-37000-2021.P5", "source": "ISO-37000-2021", "ref": "Foundational principle — Oversight", "statement": "The governing body maintains independent oversight of how delegated responsibility is being discharged."}, {"id": "ISO-37000-2021.P6", "source": "ISO-37000-2021", "ref": "Enabling principle — Stakeholder engagement", "statement": "Those affected by the organization's decisions are engaged in a structured way, not consulted ad hoc."}, {"id": "ISO-37000-2021.P7", "source": "ISO-37000-2021", "ref": "Enabling principle — Leadership", "statement": "Leadership behaviour is a governance instrument: it sets the conditions in which accountability is either credible or theatrical."}, {"id": "ISO-37000-2021.P8", "source": "ISO-37000-2021", "ref": "Enabling principle — Data and decisions", "statement": "Decisions rest on data of known quality, and the basis for a decision is recorded so it can be revisited."}, {"id": "ISO-37000-2021.P9", "source": "ISO-37000-2021", "ref": "Enabling principle — Risk governance", "statement": "Risk-taking is governed, with defined appetite and boundaries, rather than suppressed or left implicit."}, {"id": "ISO-37000-2021.P10", "source": "ISO-37000-2021", "ref": "Enabling principle — Social responsibility", "statement": "The organization accepts responsibility for its effects on society and the environment."}, {"id": "ISO-37000-2021.P11", "source": "ISO-37000-2021", "ref": "Enabling principle — Viability and performance over time", "statement": "Governance sustains the organization's ability to perform over time, not only in the current period."}, {"id": "ISO-37000-2021.TRUST", "source": "ISO-37000-2021", "ref": "Accountability rationale", "statement": "The standard's rationale for the accountability principle is that being answerable builds trust and legitimacy, and that this is shown in practice through reporting, disclosure, stakeholder engagement and acting on improvements — not through the assignment of responsibility alone.", "note": "Paraphrased. The ISO/TC 309 presentation states this in similar terms; the wording here is deliberately not ISO's."}, {"id": "OECD-MNE-2023.DD1", "source": "OECD-MNE-2023", "ref": "Due diligence step 1", "statement": "Embed responsible business conduct into policies and management systems."}, {"id": "OECD-MNE-2023.DD2", "source": "OECD-MNE-2023", "ref": "Due diligence step 2", "statement": "Identify and assess actual and potential adverse impacts in operations, products, services and business relationships."}, {"id": "OECD-MNE-2023.DD3", "source": "OECD-MNE-2023", "ref": "Due diligence step 3", "statement": "Cease, prevent or mitigate identified adverse impacts."}, {"id": "OECD-MNE-2023.DD4", "source": "OECD-MNE-2023", "ref": "Due diligence step 4", "statement": "Track implementation and results."}, {"id": "OECD-MNE-2023.DD5", "source": "OECD-MNE-2023", "ref": "Due diligence step 5", "statement": "Communicate how impacts are addressed."}, {"id": "OECD-MNE-2023.DD6", "source": "OECD-MNE-2023", "ref": "Due diligence step 6", "statement": "Provide for or cooperate in remediation where the enterprise has caused or contributed to an adverse impact."}, {"id": "OECD-MNE-2023.III", "source": "OECD-MNE-2023", "ref": "Chapter III — Disclosure", "statement": "Disclose material responsible business conduct information aligned with the due diligence framework, supported by third-party assurance where possible."}, {"id": "OECD-MNE-2023.VII", "source": "OECD-MNE-2023", "ref": "Chapter VII — Bribery and corruption", "statement": "Scope now covers bribery, trading in influence, embezzlement and misuse of sponsorships; political contributions require senior management approval."}, {"id": "OECD-CG-2023.I", "source": "OECD-CG-2023", "ref": "Chapter I", "statement": "Ensuring the basis for an effective corporate governance framework — roles of authorities must be clear and consistent."}, {"id": "OECD-CG-2023.IV", "source": "OECD-CG-2023", "ref": "Chapter IV", "statement": "Disclosure and transparency: timely and accurate disclosure on all material matters."}, {"id": "OECD-CG-2023.V", "source": "OECD-CG-2023", "ref": "Chapter V", "statement": "The responsibilities of the board, including strategic guidance, effective monitoring of management, and board accountability to the company and shareholders."}, {"id": "OECD-CG-2023.VI", "source": "OECD-CG-2023", "ref": "Chapter VI", "statement": "Sustainability and resilience: the governance framework should consider and incentivise decision-making and ris
