<style>
/* ------------------------------------------------------------------
   The Lisbon Bridge Model — one design system, inlined into every surface.
   Edited here, never in a single template, so the four pages cannot drift.

   Register: a professional instrument. A serif for named things, the
   platform's own UI face for working text, tabular figures everywhere a
   number appears, hairline rules and whitespace instead of nested boxes,
   one radius, one spacing scale.
   ------------------------------------------------------------------ */

:root{
  /* type -------------------------------------------------------------
     Display is a serif: it marks the model's named things and reads as a
     document rather than a dashboard. Text is the platform UI face —
     deliberately not Inter, which is the house style of generated pages.
     No webfont is loaded, so every surface renders identically offline. */
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Charter,"Bitstream Charter",Georgia,"Times New Roman",serif;
  --text:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;

  --t-xs:12px; --t-sm:13.5px; --t-base:16px; --t-lg:18px;
  --t-xl:22px; --t-2xl:28px; --t-3xl:38px;

  /* spacing: a 4px scale, used for everything. Nothing is eyeballed. */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --radius:5px;           /* one radius. Blobs read as generated. */
  --measure:68ch;         /* prose never runs wider than this */

  /* light -----------------------------------------------------------
     A paper ground rather than pure white, ink rather than pure black. */
  --paper:#fcfcfa;
  --panel:#ffffff;
  --sunk:#f4f4f1;
  --ink:#16181c;
  --ink-2:#4a5058;
  --ink-3:#666d76;        /* 4.75:1 on the sunk ground, computed not guessed */
  --rule:#e0e0dc;         /* hairlines */
  --edge:#848c97;         /* 3:1 borders on interactive things, on every ground */

  /* The three parts of the bridge.
     Re-stepped from the original #9f1b69 / #174f78 / #386641, which failed:
     the blue and the magenta were ΔE 3.7 apart under protanopia — the same
     colour to a protanope — and two of the three read as grey. These pass the
     lightness band, chroma floor, all-pairs CVD separation, the normal-vision
     floor and 3:1 against every ground, in both modes. */
  --cables:#a8327d;
  --framework:#2a78d6;
  --pillars:#08a054;

  --accent:var(--cables);
  --on-accent:#fff;
  --focus:#16181c;

  /* The five evidence states.
     Re-stepped after a reviewer reported that two of them were hard to
     tell apart. She was right, and measurement found worse: that pair sat
     at ΔE 13.6 for normal vision (below the 15 floor), and Working↔Fragile —
     the best state and the worst — at ΔE 4.1 for deuteranopes. The set below
     clears every all-pairs floor in both themes and 3:1 on every ground.
     Early moved off amber deliberately: the model calls it the most honest
     place to be, so a warning colour was the wrong signal in the first place.
     Colour is still never the only channel — every mark also has its own
     shape, and every mark ships with its label. */
  --st-fragile:#721f1d;      /* deep red     — feels fine, nothing behind it */
  --st-theatre:#c26c0a;      /* amber-orange — built, not experienced */
  --st-early:#4b24a8;        /* deep violet  — honest gap, nothing to unpick */
  --st-working:#0b7884;      /* teal         — perception and evidence agree */
  --st-unverified:#6c7480;   /* grey         — nobody could say */

  /* the four convergence relations. A different set from the states, so they
     get their own names; they borrow the same four validated hues because the
     two sets never appear in one chart. */
  --rel-corroborates:#0b7884; --rel-operationalises:#4b24a8;
  --rel-extends:#c26c0a;      --rel-challenges:#721f1d;
  --caution:#c26c0a;         /* the legal-advice flag */

  color-scheme:light;
}

@media (prefers-color-scheme:dark){ :root:where(:not([data-theme="light"])){
  --paper:#131519;
  --panel:#191c21;
  --sunk:#20242a;
  --ink:#e9eaec;
  --ink-2:#a8aeb6;
  --ink-3:#848b94;
  --rule:#2a2e35;
  --edge:#6b737d;
  /* the same three hues, stepped for the dark ground */
  --cables:#af4b8a;
  --framework:#2a78d6;
  --pillars:#1baf7a;
  /* the same five hues, stepped for the dark ground */
  --st-fragile:#cc3833; --st-theatre:#ebaf47; --st-early:#9e6ce0;
  --st-working:#3fbfa6; --st-unverified:#8b939e;
  --rel-corroborates:#3fbfa6; --rel-operationalises:#9e6ce0;
  --rel-extends:#ebaf47;      --rel-challenges:#cc3833;
  --caution:#ebaf47;
  --accent:var(--cables);
  --on-accent:#fff;
  --focus:#e9eaec;
  color-scheme:dark;
}}

  --paper:#131519; --panel:#191c21; --sunk:#20242a;
  --ink:#e9eaec; --ink-2:#a8aeb6; --ink-3:#848b94;

  --cables:#af4b8a; --framework:#2a78d6; --pillars:#1baf7a;

  --st-working:#3fbfa6; --st-unverified:#8b939e;

  --rel-extends:#ebaf47;      --rel-challenges:#cc3833;
  --caution:#ebaf47;
  --accent:var(--cables); --on-accent:#fff; --focus:#e9eaec;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font:var(--t-base)/1.62 var(--text);
  font-variant-numeric:tabular-nums;   /* figures line up in every column */
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* --- named things wear the serif ---------------------------------- */
h1,h2,h3,.display{font-family:var(--display);font-weight:600;letter-spacing:-.011em;}
h1{font-size:var(--t-3xl);line-height:1.14;margin:0 0 var(--s3)}
h2{font-size:var(--t-xl);line-height:1.25;margin:0 0 var(--s2)}
h3{font-size:var(--t-lg);line-height:1.3;margin:0 0 var(--s2)}
h4{font-family:var(--text);font-size:var(--t-sm);font-weight:650;margin:0 0 var(--s2);
   letter-spacing:.005em;color:var(--ink)}
p{margin:0 0 var(--s3);max-width:var(--measure)}
a{color:inherit;text-underline-offset:2px;text-decoration-thickness:1px}

/* a section label: small, spaced, quiet. Used instead of a heavier heading. */
.eyebrow{font-family:var(--text);font-size:var(--t-xs);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin:0 0 var(--s3);display:block}

.lede{font-size:var(--t-lg);line-height:1.5;color:var(--ink-2);max-width:60ch}
.small{font-size:var(--t-sm);color:var(--ink-2);line-height:1.55}
.tiny{font-size:var(--t-xs);color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
code,.code{font-family:var(--mono);font-size:.88em;color:var(--ink-2)}

/* --- layout -------------------------------------------------------- */
.wrap{max-width:912px;margin:0 auto;padding:0 var(--s5) var(--s8)}
.wrap-wide{max-width:1120px}

/* A block is separated by a rule and space, not by a border on four sides.
   Boxes inside boxes are the clearest tell of a generated page. */
.block{padding:var(--s6) 0;border-top:1px solid var(--rule)}
.block:first-of-type{border-top:0}

/* A panel is used sparingly, where something genuinely is a separate object. */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);
  padding:var(--s5)}
.sunk{background:var(--sunk);border-radius:var(--radius);padding:var(--s4) var(--s5)}

.cols{display:grid;gap:var(--s5)}
.c2{grid-template-columns:repeat(2,1fr)}
.c3{grid-template-columns:repeat(3,1fr)}
@media(max-width:780px){.c2,.c3{grid-template-columns:1fr}}

/* --- controls ------------------------------------------------------ */
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}

.btn{font:600 var(--t-sm)/1 var(--text);letter-spacing:.01em;
  background:var(--accent);color:var(--on-accent);border:1px solid transparent;
  border-radius:var(--radius);padding:12px 20px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn-quiet{background:transparent;color:var(--ink);border-color:var(--edge)}
.btn-quiet:hover{background:var(--sunk);filter:none}

label{font-size:var(--t-sm);color:var(--ink-2);display:block;margin-bottom:var(--s1)}
input[type=text],select{font:var(--t-base)/1.4 var(--text);color:var(--ink);
  background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius);
  padding:10px 12px;width:100%}
.hint{font-size:var(--t-xs);color:var(--ink-3);margin-top:var(--s1);max-width:56ch}

/* --- tables: rules, never boxes ------------------------------------ */
table{border-collapse:collapse;width:100%;font-size:var(--t-sm)}
th{text-align:left;font-weight:650;color:var(--ink-3);font-size:var(--t-xs);
  text-transform:uppercase;letter-spacing:.07em;padding:0 var(--s3) var(--s2) 0;
  border-bottom:1px solid var(--rule)}
td{padding:var(--s2) var(--s3) var(--s2) 0;border-bottom:1px solid var(--rule);
  vertical-align:top}
tr:last-child td{border-bottom:0}

/* --- the two source classes, told apart everywhere ----------------- */
.cls{display:inline-flex;align-items:center;gap:6px;font-family:var(--text);
  font-size:var(--t-xs);font-weight:650;letter-spacing:.04em;white-space:nowrap}
.cls::before{content:"";width:9px;height:9px;flex:none}
.cls-authority{color:var(--ink-2)}
.cls-authority::before{background:var(--ink-2)}                 /* solid: it binds */
.cls-experience{color:var(--ink-2)}
.cls-experience::before{background:transparent;border:1.5px solid var(--ink-2);border-radius:50%}
/* hollow circle: it is offered, not required. Shape carries the difference,
   so it survives greyscale, colour blindness and a photocopy. */

/* --- the five states: colour, shape and label, always --------------- */
.st-fragile{--st:var(--st-fragile)}   .st-theatre{--st:var(--st-theatre)}
.st-early{--st:var(--st-early)}       .st-working{--st:var(--st-working)}
.st-unverified{--st:var(--st-unverified)}
.statemark{flex:none;vertical-align:-1px}
.statemark .fill{fill:var(--st)}
.statemark .ring{fill:none;stroke:var(--st);stroke-width:2.6}


/* an aside: a rule and an indent, never a tinted box */
.note{border-left:2px solid var(--edge);padding:var(--s2) 0 var(--s2) var(--s4);
  margin:var(--s3) 0;font-size:var(--t-sm);color:var(--ink-2);max-width:var(--measure)}
.note b{color:var(--ink)}
.note.law{border-left-color:var(--caution)}

/* --- misc ---------------------------------------------------------- */
hr{border:0;border-top:1px solid var(--rule);margin:var(--s6) 0}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hide{display:none !important}
footer{margin-top:var(--s7);padding-top:var(--s4);border-top:1px solid var(--rule);
  font-size:var(--t-xs);color:var(--ink-3)}
footer p{max-width:var(--measure)}

/* cross-surface navigation: stays at the top of the window on every page, above everything */
:root{--navh:44px}
html{scroll-padding-top:calc(var(--navh) + var(--s3))}
.xnav{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:var(--s5);
  margin:0;padding:var(--s3) max(var(--s5), calc((100% - 912px) / 2 + var(--s5)));
  background:var(--paper);border-bottom:1px solid var(--rule);font-size:var(--t-sm);line-height:1.4}
@media(max-width:620px){.xnav{gap:var(--s3);padding-left:var(--s4);padding-right:var(--s4);font-size:var(--t-xs)}}
.xnav a{color:var(--ink-3);text-decoration:none}
.xnav a:hover{color:var(--ink)}
.xnav a[aria-current="page"]{color:var(--ink);font-weight:650}

@media print{
  body{background:#fff;color:#000}
  .xnav,.btn{display:none}
  .panel,.sunk{border:1px solid #bbb;background:#fff}
}

/* beta note on the first screen */
.betanote{margin:var(--s5) 0 0;padding:var(--s4) var(--s5);border:1px solid var(--edge);
  border-left:3px solid var(--accent);border-radius:var(--radius);max-width:66ch}
.betanote .eyebrow{margin:0 0 var(--s2)}
.betanote p{margin:0 0 var(--s2)}
.betanote ol{margin:0;padding-left:20px}


nav.tabs{display:flex;flex-wrap:wrap;gap:var(--s4);border-bottom:1px solid var(--rule);
  margin:var(--s5) 0 var(--s6)}
nav.tabs button{font:650 var(--t-sm)/1 var(--text);background:none;border:0;color:var(--ink-3);
  padding:0 0 var(--s3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.cols{display:grid;grid-template-columns:230px 1fr;gap:var(--s6)}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.side{position:sticky;top:var(--navh);align-self:start;max-height:calc(100vh - var(--navh));overflow:auto;z-index:2;
  background:var(--paper);padding:var(--s4) 0}
/* below the two-column breakpoint the sidebar spans the full width, so sticky
   would park it on top of the content scrolling underneath. It stops being sticky. */
@media(max-width:860px){
  .side{position:static;max-height:none;overflow:visible;padding:0 0 var(--s5);
    border-bottom:1px solid var(--rule);margin-bottom:var(--s5)}
}
.side a{display:block;padding:5px 0;font-size:var(--t-sm);color:var(--ink-2);text-decoration:none;
  border-left:2px solid transparent;padding-left:var(--s3)}
.side a:hover{color:var(--ink)}
.side a.on{color:var(--ink);font-weight:650;border-left-color:var(--c)}
.side .grp{font-size:var(--t-xs);font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--c);margin:var(--s4) 0 var(--s2);padding-left:var(--s3)}
.card{border-top:1px solid var(--rule);padding:var(--s5) 0}
.card:first-child{border-top:0}
.def{color:var(--ink-2);font-size:var(--t-sm)}
.tier{display:inline-block;font:700 10px/1 var(--mono);padding:4px 6px;border:1px solid var(--edge);
  border-radius:3px;color:var(--ink-2)}
.cite{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);font-size:var(--t-xs);margin-top:var(--s2)}
.cite a{color:var(--ink-3);text-decoration:none;border-bottom:1px dotted var(--edge)}
.src{color:inherit}
.stepblock{border-top:1px solid var(--rule);padding-top:var(--s4);margin-top:var(--s4)}
.step-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s2)}
.step-n{font-size:var(--t-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;background:var(--c);border-radius:3px;padding:3px 7px}
.step-t{font-weight:650}
.stage-b{font-size:var(--t-xs);color:var(--ink-3)}
.ev{font-size:var(--t-sm);color:var(--ink-2);margin-top:var(--s2)}
.rel{display:inline-block;font-size:var(--t-xs);font-weight:700;padding:2px 7px;border-radius:3px;
  color:#fff;background:var(--c)}
.rel-corroborates{--c:var(--rel-corroborates)} .rel-operationalises{--c:var(--rel-operationalises)}
.rel-extends{--c:var(--rel-extends)} .rel-challenges{--c:var(--rel-challenges)}
.gecbox{border-left:3px solid var(--accent);padding-left:var(--s4);margin:var(--s4) 0}
.item{border-top:1px solid var(--rule);padding:var(--s4) 0}

, "dimension group", "category"], "why": "'Pillar' is the name of one of the three parts. Using it for all three makes the model contradict itself.", "enforce": [], "enforce_note": "Not gated: The Pillars is the name of one of the three parts, so the word is legitimate."}, "element": {"singular": "element", "plural": "elements", "use": "the twelve elements", "not": ["dimension", "factor", "criterion"], "why": "The elements are parts of a structure, which is what the model is about. 'Dimension' is maintainer vocabulary.", "enforce": ["dimension"]}, "plain_mechanics": {"score": "score", "level": "level", "state": "state", "why": "These are deliberately ordinary words. An earlier version called the score the 'Bridge Integrity Score', which reads as a structural engineering verdict and does not survive translation.", "enforce": ["bridge integrity score", "theatre"], "renamed": {"theatre": "Formal only — 'Theatre' was a verdict rather than a description, and it does not survive translation. The state id stays 'theatre' internally; only what a reader sees changed."}}}, "parts": {"environment": {"name": "Our Cables", "gloss": "Organizational Environment", "structure": "The suspension cables. They carry the load, but only in tension, and only if the towers hold.", "meaning": "The conditions the organization sets around the work: what it says it wants, whether people are trusted to act, what is visible, and how leaders behave."}, "conditions": {"name": "The Iron Framework", "gloss": "Project Conditions", "structure": "The surface people actually walk on. This is where the work happens, and where a weak span is felt first.", "meaning": "What it is like to do the work day to day: whether it is safe to speak, whether anything is learned, whether problems move, and what happens when a decision goes wrong."}, "structures": {"name": "The Pillars", "gloss": "Structures", "structure": "The towers and piers. Everything above rests on them; when they are weak, nothing else compensates for long.", "meaning": "The machinery that would still be there if the current people left: who decides what, who is capable of what, what is written down, and what the organization actually rewards."}}, "source_classes": {"note": "The two classes of source do different jobs, and treating them as one is the easiest way for a tool like this to claim authority it has not got. The build enforces the difference rather than leaving it to editorial care.", "authority": {"label": "Authority", "tiers": ["A", "B", "C", "D"], "what_it_is": "Intergovernmental instruments and international standards, binding regulation, professional and multi-stakeholder standards, and the established evidence base.", "what_it_does": "Sets the floor and the expectation. This is what an organization can be held to.", "how_to_cite": "Cite as an expectation, naming the instrument and the provision.", "underwrites_recommendations": true}, "experience": {"label": "Experience", "tiers": ["E"], "what_it_is": "Recorded discussion among named practitioners: the PMI community layer from the GEC Lisbon tables.", "what_it_does": "Supplies the repertoire: what people in this position actually built, and what happened. It has no authority to be measured against, and nobody can be held to it.", "how_to_cite": "Cite as experience, naming the table it came from. Never as a requirement.", "underwrites_recommendations": false}, "method": {"label": "Method", "tiers": ["M"], "what_it_is": "References that informed how this repository scores and structures itself.", "what_it_does": "Shapes the instrument. Never cited as the basis of a recommendation.", "how_to_cite": "Cite in the method view only.", "underwrites_recommendations": false}}, "guarantee": {"headline": "No recommendation rests on community experience.", "body": "Every one of the 48 graded recommendations comes only from authority sources. The community layer is shown alongside, labeled and credited to the table that described it, but no advice rests on it. The build refuses to ship if a recommendation cites an experience-class provision.", "why_it_matters": "It means the community layer can be challenged, replaced or re-run after the next council without any recommendation changing, and it means no practitioner's words are presented to a third party as a requirement."}, "how_the_mapping_is_made": {"headline": "How a statement becomes a sourced recommendation.", "steps": [{"n": 1, "label": "Element", "body": "Each of the twelve elements is defined by what it claims about an organization, and carries the provisions that speak to it."}, {"n": 2, "label": "Statements", "body": "Three statements per element, each tagged with the provisions it is testing. The statements measure perception only."}, {"n": 3, "label": "Evidence question", "body": "After each part of the bridge, one evidence question for each of its elements below Established, written in plain words from something the recommendation ladder lists at that step. It asks what exists, not how it feels. Elements at Established or above are not checked, and their result is assumed from the statements."}, {"n": 4, "label": "Benchmark", "body": "The two answers locate the element against authority: the score says where perception sits, and the evidence answer says what exists."}, {"n": 5, "label": "Recommendation", "body": "The ladder step that matches selects a set of moves, each carrying the provisions it derives from."}, {"n": 6, "label": "Source", "body": "Every provision resolves to a named instrument, with the edition and how it was verified."}], "challengeable": "Each link is inspectable and each can be wrong in a different way: the wrong provision on an element, a statement that does not test what it claims, an evidence question that does not test the thing it names, a ladder step pitched at the wrong level, or a source that has moved on. The mapping view shows all of them."}, "collection": {"note": "Optional submission of a completed assessment to a collection endpoint, so responses can be pooled for analysis. Off unless an endpoint is configured AND the respondent opts in. The tool tells people what leaves their browser, because an accountability instrument that quietly uploads their answers is making the argument against itself.", "enabled": true, "endpoint": "https://script.google.com/macros/s/AKfycbyORaCBhk14Q-Gq7UjUu5nkKJLzRzRlqAOlFNwI_quySS2wkFR3EWs-xFHInS45UfjTjQ/exec", "destination": "a Google Sheet held by the PMI Lisbon Emerging Leaders group", "content_type": "text/plain;charset=utf-8", "content_type_why": "Google Apps Script web apps answer no CORS preflight. 'application/json' is not a CORS-safelisted content type, so the browser sends an OPTIONS request first, Apps Script does not answer it, and the POST never happens. 'text/plain' is safelisted, so the request goes straight through. The body is still JSON — the Apps Script reads it with JSON.parse(e.postData.contents).", "consent": {"default": false, "label": "Send my answers to the research pool", "what_is_sent": "Your answers, the scores computed from them, and the organization profile you typed in — country, sector, legal form and size. Your organization name is sent only if you entered one.", "what_is_not_sent": "No IP address, no account, no cookie, nothing that identifies you personally beyond what you typed.", "withdraw": "Nothing is sent until you finish the assessment, and nothing is sent at all if this box is left unticked."}}, "steps": {"names": ["Write it down", "Put it to use", "Verify it", "Show it"], "meaning": ["The thing is written down.", "It is used in the routine.", "Someone has checked that it works.", "People outside the group being assessed can see it."], "history": "The four steps were first called Establish, Operate, Assure and Lead. Established is also the name of a band, and the verbs did not say what to do. They are now named for what is done."}, "beta": {"headline": "A beta, and what we want challenged", "body": "This is a beta of the Lisbon Bridge Model, put to the PMI Global Executive Council for critique. It has not been piloted, so the score is a structured prompt, not a measurement.", "lead_in": "We would like the council to challenge four things:", "questions": ["whether we are using the right sources", "whether the mapping of answers across sources is correct", "what actually gives experts added value in their work", "whether each statement makes a logical assumption"]}, "known_gaps": {"headline": "What this does not cover yet", "statements_without_evidence": {"why": "Each element asks one evidence question, so some of the 36 statements have no question that asks about them directly. We chose to say so rather than add questions.", "items": [{"id": "Q05", "note": "individuals take ownership of outcomes"}, {"id": "Q15", "note": "people can admit mistakes without expecting blame"}, {"id": "Q17", "note": "lessons are discussed throughout the work, not only after it"}, {"id": "Q19", "note": "feedback is honest, respectful and timely"}, {"id": "Q33", "note": "leadership changes include a consistent handover"}]}, "council_test": {"headline": "How the council can test completeness", "body": "Each table takes one part of the bridge (Our Cables, The Iron Framework or The Pillars) and reads its elements against the sources listed in the corpus. The question for each table is: what does an organization in your experience need here that none of these provisions mentions? Anything the tables name is a candidate gap."}}, "evidence_rewrite": {"date": "2026-10-20", "text": "Version 3.2.0 reworded all 48 evidence questions in plain language. Each now has a short line on what counts and what does not. Ten were swapped for a different item from the same step of the recommendation ladder, and three ladder lists (learning, leadership and governance at step 4) gained a new first item, so the question asked is always the first item the ladder lists for that step. The 36 statements were not changed. Evidence answers given before 3.2.0 cannot be pooled with later ones."}}, "bands": [{"id": "foundational", "label": "Foundational", "min": 0, "max": 49, "entry_stage": 1}, {"id": "developing", "label": "Developing", "min": 50, "max": 69, "entry_stage": 2}, {"id": "established", "label": "Established", "min": 70, "max": 84, "entry_stage": 3}, {"id": "rolemodel", "label": "Role Model", "min": 85, "max": 100, "entry_stage": 4}], "pillars": {"environment": {"name": "Organizational Environment", "metaphor": "Our Cables", "color": "var(--cables)", "token": "cables"}, "conditions": {"name": "Project Conditions", "metaphor": "The Iron Framework", "color": "var(--framework)", "token": "framework"}, "structures": {"name": "Structures", "metaphor": "The Pillars", "color": "var(--pillars)", "token": "pillars"}}, "tier_definitions": {"A": "Intergovernmental instrument or international standard. Highest authority; changes rarely; safe to cite to an external audience.", "B": "Binding or quasi-binding regulatory / reporting requirement in at least one major jurisdiction.", "C": "Professional body standard or multi-stakeholder accountability standard.", "D": "Peer-reviewed or otherwise established evidence base. Used where no normative standard speaks to the behaviour.", "M": "Method reference. Informs how the repository scores and structures itself; never cited as the basis of a recommendation.", "E": "Practitioner community consensus. Recorded discussion among named practitioners; evidence of what works in practice, not a normative instrument and not a peer-reviewed finding. Cite it as experience, never as a requirement."}, "scoring": {"schema": "accountability-repository/scoring@1", "note": "Extracted from the original prototype's calc() so this repository scores identically. Any change here changes every past report, so it is versioned with the corpus rather than living in the UI.", "scale": {"type": "likert-5", "prompt": "How true is this of the team, project or organization you have in mind?", "options": [{"value": 1, "label": "Strongly disagree"}, {"value": 2, "label": "Disagree"}, {"value": 3, "label": "Partly agree"}, {"value": 4, "label": "Agree"}, {"value": 5, "label": "Strongly agree"}], "not_applicable": {"enabled": true, "label": "Not applicable", "note": "Not present in the original prototype. Added because a 12-element corporate instrument applied to a 6-person team will always contain questions that do not apply, and forcing a Likert answer there corrupts the element score. Handled by weight redistribution rather than by scoring zero, which is the method the World Benchmarking Alliance uses."}}, "rules": {"question_to_dimension": "element score = round((mean of the element's answered questions - 1) * 25), on 0-100", "dimension_to_pillar": "part score = round(mean of its 4 element scores)", "pillar_to_overall": "overall score = round(mean of the 3 part scores)", "na_handling": "A question marked Not applicable is dropped from its element's mean and the remaining questions carry the full weight. An element with fewer than 2 answered questions is excluded rather than scored — one answered item is not an element score. A part with fewer than 2 scored elements is excluded, and if fewer than 2 parts survive there is no overall score. Excluded elements and parts are reported as excluded, never as zero.", "minimum_for_dimension_score": 2, "band_boundaries": "score >= 85 Role Model; >= 70 Established; >= 50 Developing; otherwise Foundational", "priority_selection": "the 3 lowest-scoring elements, excluding any that are N/A-excluded; ties broken by part order then element order", "strength_selection": "the 3 highest-scoring elements, excluding any also selected as a priority. Both lists are suppressed when fewer than 6 elements are scored, because they would otherwise name the same element twice.", "minimum_dimensions_for_pillar": 2, "rounding": "Scores are carried unrounded through element, part and overall, and rounded once for display. Rounding at each level compounded by up to a point and could move the overall across a band boundary.", "evidence_handling": "Evidence answers never change a score. They change which ladder step the recommendation enters at, and they determine the element's state. The 0-100 score remains a perception measure and is labeled as one."}, "overall_narrative": {"foundational": {"headline": "Accountability depends on individuals, not on the organization.", "body": "Things get done because particular people care, not because the organization is set up to make them happen. That works until those people leave, get busy or disagree. Trying harder will not fix it, because the problem is that too much of how this works lives in people's heads. Writing it down is what keeps the organization working when they are not there.", "focus": "Pick one element. Complete step 1 fully before starting a second."}, "developing": {"headline": "The structures are in place but they are not yet changing anything.", "body": "This is the most common result and the most frustrating one. Policies, forums and owners exist, and outcomes still slip through the gaps between them. The design is rarely where it goes wrong; the follow-through is. Commitments get recorded but not tracked, owners get named without being given authority, and lessons get captured without being acted on. That work is unglamorous, and it is where the score moves.", "focus": "Stop adding mechanisms. Make the ones you have produce a consequence."}, "established": {"headline": "Accountability works. Nobody independent has tested it yet.", "body": "The organization can describe what it does, and largely does it. What is usually missing is someone outside the responsible team checking whether practice matches the description. Organizations at this level are often surprised by what that check finds.", "focus": "Have someone independent test one element you are confident about."}, "rolemodel": {"headline": "Strong. The risks now are complacency and handover.", "body": "The practice is real, and the main threats come from inside. A system this good is usually held by a small number of experienced people, and it degrades quietly when they move on. The work now is to make it external and durable: publish it, extend it to partners and suppliers, and check it survives a change of leadership. It is also worth asking what the instrument does not measure. A high score here says nothing about your accountability to people outside the organization.", "focus": "Publish it and stress-test it. Assume the score is fragile until it has survived a handover."}}, "pillar_narrative": {"environment": {"foundational": "The cultural conditions are not carrying accountability. Expectations, trust and transparency are being improvised, so effort is being spent on interpretation rather than on delivery.", "developing": "The environment supports accountability near the top and thins with distance. Look for where the message stops traveling — usually one management layer below where leadership assumes it stops.", "established": "The environment is sound. The remaining work is consistency across functions rather than depth in any one.", "rolemodel": "Culture is doing real load-bearing work here. Protect it explicitly during growth and reorganization, which is when it is most often lost."}, "conditions": {"foundational": "Day-to-day conditions are working against accountability. Where speaking up carries cost and failure triggers blame, the organization stops receiving the information it most needs.", "developing": "Conditions vary sharply by team and by manager. That variance is the finding — it means the good behavior is personal, not structural.", "established": "Conditions are healthy. The test still to come is whether they hold under pressure and when the concern involves someone senior.", "rolemodel": "This is the hardest part to score well on and the easiest to lose. It rests on leader behavior, so it needs re-earning with every leadership change."}, "structures": {"foundational": "The formal mechanisms are not in place. Without clear owners, matched authority and reliable governance routines, the other two parts cannot compensate for long.", "developing": "Structures exist but are not yet load-bearing — most often because authority has not been attached to the accountability that was assigned.", "established": "Structures are working. Attention should move to the seams between owners and to continuity across leadership change.", "rolemodel": "Structure is strong. The frontier is disclosure and extension to partners, and confirming that oversight is genuinely independent of delivery."}}, "measurement_caveat": {"headline": "What this score is, and is not.", "body": "This score comes from 36 statements, answered by one person, three per element. The instrument has never been piloted, so there is no evidence it measures anything consistently. There is no comparison group and no second rater. Scores move in steps of about 8 points, so treat any difference under 10 points as noise. What the score supports is this: one person, on one day, reported these perceptions, and the lowest ones are where they think the organization is weakest.", "where_shown": "Results card and the head of every downloaded report."}, "known_limitations": ["All 36 statements are worded so that agreeing is the good answer. People who tend to agree, or who want to look good, push scores up, and nothing corrects for that.", "Several items bundle three or four distinct things; a respondent silently averages them and the recommendation cannot know which part failed.", "Attainable element scores fall on a 13-point lattice in ~8.3-point steps, so the bands contain unequal numbers of reachable values and 'just crossed the line' is not a real state.", "A single one-step answer change can move the overall across a band boundary and swap the entire recommendation step.", "The evidence answers are self-reported too. They are harder to flatter than a rating scale, because you can either show the thing or you cannot, but they are not an audit."], "evidence": {"why": "The 36 statements ask how accountable the organization feels, which cannot tell you what is actually there. For every step, the recommendation ladder names what would show the step was done. The evidence question asks about one of those things, from the step your score points at.", "questions_per_assessment": 12, "selection": "The evidence question for the step the element's score points at. An element with too few answered statements is skipped.", "prompt": "Does this exist in the group you are assessing?", "help": "Answer for what you could actually show if someone asked to see it. \"Not sure\" is a real answer and is reported, not scored against you.", "options": [{"id": "present", "label": "Yes", "stage_delta": 1, "note": "It exists, so this step is done and the next one becomes the work."}, {"id": "partial", "label": "Partly", "stage_delta": 0, "note": "It is under way, so finish it before starting the next one."}, {"id": "absent", "label": "No", "stage_delta": -1, "note": "It is not there. Drop back a step and build what the next step rests on."}, {"id": "unknown", "label": "Not sure", "stage_delta": 0, "counts_as_finding": true, "note": "Not being able to say whether it exists is itself a finding, and is reported as one."}, {"id": "unclear", "label": "This question is unclear to me", "stage_delta": 0, "counts_as_finding": false, "excluded_from_state": true, "note": "This says nothing about the group you are assessing. It tells us the question needs rewriting. It is sent back to us for that only if you chose to share your answers at the start."}], "stage_rule": "actual step = clamp(perception step + stage_delta, 1, 4). Evidence decides which step you are at; perception decides which element you work on first. Each signal does the job it can actually do.", "states": {"working": {"label": "Working", "perception": "high", "evidence": "present", "line": "What people feel and what exists agree. The practice is real and there is something to show for it.", "body": "Feeling and evidence agree, which is the result to aim for. The next work is to have someone independent check it, and to show it to people outside the group."}, "fragile": {"label": "Fragile", "perception": "high", "evidence": "absent", "line": "It feels accountable, but there is nothing to show for it.", "body": "This is the highest-risk result, and the score alone would have called it a strength. People believe it works but nothing shows it, which usually means it depends on particular people and goes when they go. Write it down before that belief is tested."}, "theatre": {"label": "Formal only", "perception": "low", "evidence": "present", "line": "It exists on paper, but people do not experience it.", "body": "Building more will not help, although the score alone would have said to build more. The thing exists, but people do not trust it, do not know about it or do not use it, so the work is getting it used. Find out whether people know it exists and what happens when they use it."}, "early": {"label": "Early", "perception": "low", "evidence": "absent", "line": "People feel it is weak, and nothing exists yet.", "body": "This is the easiest result to act on: start at the step shown and build it, with nothing to undo first."}, "unverified": {"label": "Unverified", "perception": "any", "evidence": "unknown", "line": "Nobody could say whether it exists.", "body": "Where an element matters, this is the finding: if the person answering cannot find it, it is not working in practice, even if it exists somewhere."}}, "state_rule": "High perception means an element score of 70 or more. Evidence 'Yes' with high perception is Working; 'No' with high perception is Fragile. Evidence 'Yes' with low perception is Formal only; 'No' with low perception is Early. 'Partly' takes the perception side. 'Not sure' gives Unverified. 'This question is unclear to me' is not scored and sets no state: it is feedback on the question, not an observation about the organization.", "dominance_rule": "The state highlighted in the summary is the most consequential one present, in the order Fragile, Formal only, Unverified, Early, Working — not the most frequent. Fragile and Formal only are the two the score alone gets wrong, so they are surfaced even when few elements are in them. The bar beside it shows the real distribution."}}, "contexts": {"schema": "accountability-repository/contexts@1", "updated": "2026-08-19", "note": "What the organization's location and profile change. Jurisdiction determines which accountability obligations are legally binding rather than voluntary. Everything here names a source and how it was verified; a regime with no source_url does not build.", "profile_fields": [{"id": "organization", "label": "Organization name", "type": "text", "required": true, "note": "Used to title the report and to look the organization up. Nothing about the organization is inferred from the name alone."}, {"id": "jurisdiction", "label": "Primary country of operation", "type": "select", "source": "jurisdictions", "required": true}, {"id": "sector", "label": "Sector", "type": "select", "source": "sectors", "required": true}, {"id": "legal_form", "label": "Legal form", "type": "select", "required": true, "options": [{"id": "listed", "label": "Listed company", "promotes": ["OECD-CG-2023"]}, {"id": "private", "label": "Private company", "promotes": ["ISO-37000-2021"]}, {"id": "state", "label": "State-owned or public body", "promotes": ["OECD-CG-2023", "ISO-26000-2010"]}, {"id": "ngo", "label": "NGO / non-profit / civil society", "promotes": ["GS-CSO"], "suppresses": ["OECD-CG-2023"]}, {"id": "partnership", "label": "Partnership or professional firm", "promotes": ["ISO-37000-2021"]}]}, {"id": "size", "label": "Employees", "type": "select", "required": true, "options": [{"id": "u50", "label": "Under 50", "employees_max": 49}, {"id": "50-249", "label": "50 – 249", "employees_min": 50, "employees_max": 249}, {"id": "250-499", "label": "250 – 499", "employees_min": 250, "employees_max": 499}, {"id": "500-999", "label": "500 – 999", "employees_min": 500, "employees_max": 999}, {"id": "1000-4999", "label": "1,000 – 4,999", "employees_min": 1000, "employees_max": 4999}, {"id": "5000+", "label": "5,000 or more", "employees_min": 5000}]}, {"id": "multinational", "label": "Operates across borders / has an international supply chain", "type": "boolean", "promotes_when_true": ["OECD-MNE-2023", "UNGP-2011"]}], "sectors": [{"id": "general", "label": "General / other"}, {"id": "financial", "label": "Financial services", "note": "Under EU Directive 2019/1937 the internal reporting channel obligation applies regardless of headcount in financial services and anti-money-laundering scope."}, {"id": "public", "label": "Public sector", "note": "Public bodies are covered by the EU whistleblowing regime on the same threshold, with member-state variation for small municipalities."}, {"id": "safety_critical", "label": "Safety-critical (aviation, healthcare, energy, rail)", "note": "Just-culture practice — separating honest error from reckless violation before deciding a response — is an established expectation in these sectors rather than an optional maturity step. Raises the weight of the Responsible Decisions and Psychological Safety elements."}, {"id": "extractives", "label": "Extractives / heavy industry"}, {"id": "tech", "label": "Technology / digital"}, {"id": "health", "label": "Health and life sciences"}, {"id": "education", "label": "Education and research"}, {"id": "consumer", "label": "Consumer goods / retail"}, {"id": "construction", "label": "Construction and infrastructure"}], "jurisdictions": [{"id": "eu", "label": "European Union (member state not listed separately)", "region": "Europe", "depth": "detailed", "regimes": [{"id": "eu-wb", "name": "Whistleblower Protection Directive (EU) 2019/1937", "binding": true, "applies_when": "50 or more workers; regardless of size for entities within the Union acts in Parts I.B and II of the Annex (financial services, anti-money-laundering, transport safety). Member States may exempt municipalities under 10,000 inhabitants and other public entities with fewer than 50 workers.", "obligation": "A confidential internal reporting channel separate from ordinary HR; acknowledgement of a report within 7 days; feedback to the reporter within 3 months; protection from retaliation, with the burden of proof on the employer to show that detriment was not retaliatory.", "affects": ["safety", "transparency", "feedback", "decisions"], "raises_floor": "Step 1 and 2 of Psychological Safety & Speak-up are not maturity choices here — they are the legal minimum.", "source_url": "https://confidly.eu/eu-directive/", "verified_via": "reputable-secondary", "gate": {"min_employees": 50, "or_sector": ["financial"], "verified_threshold": true}, "transposed_nationally": true}, {"id": "eu-csrd", "name": "CSRD as amended by the Omnibus I Directive", "binding": true, "applies_when": "EU companies with more than 1,000 employees AND more than EUR 450 million net turnover. Non-EU parents with EUR 450 million EU turnover, via an EU subsidiary or branch above EUR 200 million.", "obligation": "Sustainability reporting under ESRS, including governance and business-conduct disclosures. Reporting begins for financial years starting in 2027 for EU companies and 2028 for third-country parents; member-state transposition deadline 19 March 2027.", "affects": ["transparency", "governance", "recognition", "leadership"], "raises_floor": "Step 4 disclosure moves become obligations rather than leadership choices once in scope.", "source_url": "https://www.consilium.europa.eu/en/press/press-releases/2026/02/24/council-signs-off-simplification-of-sustainability-reporting-and-due-diligence-requirements-to-boost-eu-competitiveness/", "verified_via": "primary", "gate": {"min_employees": 1000, "also": "and turnover above EUR 450m — turnover is not collected by this assessment, so treat as indicative", "verified_threshold": true, "excl_legal_form": ["ngo", "partnership"], "turnover_untested": true}, "transposed_nationally": true, "scope_caveat": "Headcount is the only limb this assessment tests. The threshold is conjunctive — it also requires EUR 450 million net turnover — so treat this as *may apply* until turnover is checked."}, {"id": "eu-csddd", "name": "CSDDD (CS3D) as amended by the Omnibus I Directive", "binding": true, "applies_when": "More than 5,000 employees AND more than EUR 1.5 billion net worldwide turnover; non-EU companies on EUR 1.5 billion EU turnover", "obligation": "Risk-based due diligence on adverse impacts, with permitted prioritization toward direct business partners and assessment on reasonably available information. Transposition by 26 July 2028; company application from 26 July 2029. The climate transition plan requirement and the EU harmonized civil liability regime were removed by the Omnibus; penalties are capped at 3% of net worldwide turnover.", "affects": ["learning", "decisions", "governance", "transparency"], "source_url": "https://www.cov.com/en/news-and-insights/insights/2026/02/eu-csddd-csrd-omnibus-published-in-official-journal-transposition-delegated-acts-and-guidelines-are-next", "verified_via": "reputable-secondary", "gate": {"min_employees": 5000, "also": "and turnover above EUR 1.5bn", "verified_threshold": true, "excl_legal_form": ["ngo", "partnership"], "turnover_untested": true}, "transposed_nationally": true, "scope_caveat": "Headcount is the only limb this assessment tests. The threshold is conjunctive — it also requires EUR 1.5 billion net worldwide turnover — so treat this as *may apply* until turnover is checked."}]}, {"id": "pt", "label": "Portugal", "region": "Europe", "depth": "detailed", "inherits": ["eu"], "regimes": [{"id": "pt-93-2021", "name": "Lei n.º 93/2021 — Regime Geral de Proteção de Denunciantes", "binding": true, "applies_when": "Public and private entities with 50 or more employees; municipalities above 10,000 inhabitants; entities in financial services, anti-money-laundering, transport safety and environmental scope regardless of size. Smaller public entities may be exempted, mirroring the Directive's option — this assessment applies the 50-employee floor.", "obligation": "Internal reporting channel guaranteeing confidentiality, and full anonymity on request. Acknowledgement within 7 days with an explanation of admissibility; notification of measures taken or planned within 3 months; the reporter may request the final analysis within 15 days of conclusion. Adverse action within two years of a report is presumed abusive unless the employer proves otherwise. Fines of EUR 1,000–125,000 for grave violations and EUR 10,000–250,000 for very grave ones, including obstructing reports, retaliation and confidentiality breaches.", "affects": ["safety", "transparency", "feedback", "decisions", "recognition"], "raises_floor": "The two-year presumption of abusive retaliation makes the Recognition element's rule — that no consequence lands on the person who reported — a legal test rather than a cultural aspiration.", "source_url": "https://www.macedovitorino.com/xms/files/20220223-Protecao_dos_Denunciantes.pdf", "verified_via": "reputable-secondary", "gate": {"min_employees": 50, "or_sector": ["financial"], "verified_threshold": true}, "transposed_nationally": false}]}, {"id": "de", "label": "Germany", "region": "Europe", "depth": "detailed", "inherits": ["eu"], "regimes": [{"id": "de-lksg", "name": "Lieferkettensorgfaltspflichtengesetz (LkSG) — in transition", "binding": true, "status": "in force but enforcement curtailed", "applies_when": "Enterprises with 1,000 or more employees based in Germany (threshold unchanged since 1 January 2024).", "obligation": "Human rights and environmental due diligence in the supply chain, including a complaints procedure. As of early 2026 the Act remains in force but BAFA suspended reviews of corporate reports from October 2025 and sanctions only particularly serious violations tied to severe human rights breaches. A September 2025 draft amendment proposes abolishing the reporting obligation, with the regime to be replaced by a less bureaucratic transposition of the CSDDD.", "affects": ["learning", "decisions", "governance", "feedback"], "caution": "What is in flux is enforcement and reporting, not scope. BAFA stopped accepting and reviewing the mandatory annual reports in autumn 2025 and now pursues only serious violations; a bill to repeal the reporting duty is before the Bundestag, and a July 2026 coalition proposal to raise the threshold to 5,000 employees and EUR 1.5bn is not enacted. The five core duties — risk analysis, prevention, remediation, complaints procedure, documentation — apply unchanged. Confirm current status before relying on this.", "source_url": "https://liefertreu.de/ratgeber/lksg-aktueller-stand-2026/", "verified_via": "reputable-secondary", "gate": {"min_employees": 1000, "verified_threshold": true}}]}, {"id": "fr", "label": "France", "region": "Europe", "depth": "detailed", "inherits": ["eu"], "regimes": [{"id": "fr-sapin2", "name": "Loi Sapin II, Article 17", "binding": true, "applies_when": "French companies and groups with at least 500 employees AND turnover above EUR 100 million; foreign subsidiaries of covered entities are also caught", "obligation": "Eight required pillars: a code of conduct illustrating prohibited behavior; an internal alert system; a documented corruption risk map prioritized by activity and geography; third-party due diligence covering customers, primary suppliers and intermediaries; accounting controls preventing books being used to conceal corruption; training for exposed managers and staff; a disciplinary regime; and internal monitoring and evaluation of all of the above.", "affects": ["governance", "decisions", "capability", "recognition", "safety"], "raises_floor": "The disciplinary-regime and internal-monitoring parts make Recognition & Consequences step 2 a compliance requirement, not a maturity step.", "source_url": "https://www.ganintegrity.com/reference/sapin-ii/", "verified_via": "reputable-secondary", "gate": {"min_employees": 500, "also": "and turnover above EUR 100m", "verified_threshold": true}}]}, {"id": "no", "label": "Norway", "region": "Europe", "depth": "detailed", "regimes": [{"id": "no-transparency", "name": "Transparency Act (åpenhetsloven)", "binding": true, "applies_when": "Enterprises meeting at least two of three criteria: 50 or more full-time equivalents, NOK 70 million turnover, NOK 35 million balance sheet total. Includes foreign companies offering goods or services in Norway with Norwegian tax obligations.", "obligation": "Risk-based human rights and working-conditions due diligence across operations and supply chain; publish an account of that due diligence by 30 June each year; respond to public information requests, usually within three weeks. In force since 1 July 2022.", "affects": ["transparency", "learning", "governance"], "raises_floor": "The duty to answer any member of the public's question turns Transparency step 4 into an operating requirement at a much lower size threshold than the EU regimes.", "source_url": "https://www.sedex.com/blog/norways-transparency-act-what-you-need-to-know/", "verified_via": "reputable-secondary", "gate": {"min_employees": 50, "also": "meets at least two of three criteria; only the headcount criterion is tested here", "verified_threshold": true}}]}, {"id": "uk", "label": "United Kingdom", "region": "Europe", "depth": "detailed", "regimes": [{"id": "uk-cgc-2024", "name": "UK Corporate Governance Code 2024", "binding": false, "basis": "comply or explain, via the Listing Rules", "applies_when": "Listed companies in the commercial companies or closed-ended investment funds categories, wherever incorporated", "obligation": "Five areas: board leadership and company purpose; division of responsibilities; composition, succession and evaluation; audit, risk and internal control; remuneration. Applies to financial years beginning on or after 1 January 2025. Provision 29 — a board declaration on the effectiveness of material internal controls — applies from 1 January 2026. A new principle asks boards to report the outcomes of their decisions rather than boilerplate.", "affects": ["governance", "roles", "leadership", "recognition", "transparency"], "raises_floor": "Provision 29 is Governance step 3 in legal clothing: the board must assert effectiveness, which is not possible without independent testing.", "source_url": "https://www.frc.org.uk/library/standards-codes-policy/corporate-governance/uk-corporate-governance-code/", "verified_via": "primary", "gate": {"legal_form": ["listed"], "verified_threshold": true}}]}, {"id": "us", "label": "United States", "region": "Americas", "depth": "detailed", "regimes": [{"id": "us-sox-301", "name": "Sarbanes-Oxley Act, Section 301(4)", "binding": true, "applies_when": "Issuers listed on a national securities exchange", "obligation": "The audit committee — not management — must establish procedures for receiving, retaining and treating complaints regarding accounting, internal accounting controls and auditing matters, and for confidential, anonymous submission by employees of concerns about questionable accounting or auditing matters. The audit committee must approve the procedures and maintain independent visibility of complaint data.", "affects": ["safety", "transparency", "governance", "roles"], "raises_floor": "The requirement that the audit committee owns the channel is exactly the Psychological Safety step 1 move — a route that bypasses line management — made mandatory.", "source_url": "https://www.ethico.com/insights/sarbanes-oxley-whistleblower-program-requirements-what-sox-section-301-actually-demands-from-your-hotline-2", "verified_via": "reputable-secondary", "gate": {"legal_form": ["listed"], "verified_threshold": true}}]}, {"id": "br", "label": "Brazil", "region": "Americas", "depth": "detailed", "regimes": [{"id": "br-12846", "name": "Lei 12.846/2013 (Lei Anticorrupção) with Decreto 11.129/2022", "binding": true, "applies_when": "Legal entities in Brazil, for acts against domestic or foreign public administration; strict administrative and civil liability", "obligation": "An effective integrity program mitigates penalties. Decree 11,129/2022 sets the parameters: demonstrated top-management commitment through adequate resourcing; periodic risk assessment with efficient resource allocation; due diligence and monitoring of third parties, expressly including brokers, consultants, commercial representatives and politically exposed persons and their families; and due diligence over donations and sponsorships. The reduction factor for an effective program rose from 4% to 5% of the fine.", "affects": ["governance", "capability", "decisions", "leadership"], "raises_floor": "Resourcing is the test here — a program that exists on paper without allocated resources does not count as commitment under the decree.", "source_url": "https://www.demarest.com.br/decree-no-11129-22-which-regulates-law-no-12846-13-anti-corruption-law-and-revokes-decree-no-8420-15-published/", "verified_via": "reputable-secondary", "gate": {"always": true, "verified_threshold": true}}]}, {"id": "za", "label": "South Africa", "region": "Africa", "depth": "detailed", "regimes": [{"id": "za-king-v", "name": "King V Report on Corporate Governance", "binding": false, "basis": "apply and explain; mandatory for JSE-listed companies via the listing requirements", "applies_when": "All organizations regardless of size or form. Published 31 October 2025 and applies to financial years commencing after 1 January 2026, replacing King IV.", "obligation": "Thirteen principles, consolidated down from King IV's seventeen, directed at governance outcomes including ethical culture, performance and value creation, control, and legitimacy, with strengthened treatment of AI governance and cyber risk. The principles are not optional; what is explained is the practices adopted to achieve them.", "affects": ["leadership", "governance", "roles", "feedback", "vision"], "note": "King IV applied to financial years before this and is the version most South African organizations last reported against, so both may be live in a transition year. Principle numbers differ between the two — do not carry King IV numbering across.", "source_url": "https://www.iodsa.co.za/page/king-v", "verified_via": "reputable-secondary", "gate": {"always": true, "verified_threshold": true}}]}, {"id": "in", "label": "India", "region": "Asia-Pacific", "depth": "outline", "regimes": [{"id": "in-s177", "name": "Companies Act 2013, section 177(9)–(10) — vigil mechanism", "binding": true, "applies_when": "Listed companies; companies accepting public deposits; companies with borrowings from banks or financial institutions above INR 50 crore", "obligation": "A vigil mechanism for directors and employees to report genuine concerns, operated through the audit committee where one is required, with adequate safeguards against victimization and direct access to the audit committee chairperson in exceptional cases. Existence of the mechanism must be disclosed on the website and in the board's report.", "affects": ["safety", "transparency", "governance", "roles"], "source_url": "https://taxguru.in/company-law/whistleblowing-vigil-mechanism-companies-act-2013.html", "verified_via": "reputable-secondary", "gate": {"legal_form": ["listed"], "also": "also applies to deposit-accepting companies and those borrowing above INR 50 crore, which this assessment does not ask about", "verified_threshold": true}}]}, {"id": "jp", "label": "Japan", "region": "Asia-Pacific", "depth": "outline", "regimes": [{"id": "jp-cgc", "name": "Japan's Corporate Governance Code", "binding": false, "basis": "comply or explain, incorporated into Tokyo Stock Exchange listing rules", "applies_when": "TSE-listed companies. Prime and Standard Market companies must explain non-compliance with any principle; Growth Market companies with the General Principles only.", "obligation": "Principles-based governance expectations, revised periodically since 2015.", "affects": ["governance", "roles", "transparency"], "source_url": "https://www.jpx.co.jp/english/equities/listing/cg/", "verified_via": "primary", "gate": {"legal_form": ["listed"], "verified_threshold": true}}]}, {"id": "au", "label": "Australia", "region": "Asia-Pacific", "depth": "detailed", "regimes": [{"id": "au-whistleblower", "name": "Corporations Act 2001, Part 9.4AAA — whistleblower protections", "binding": true, "applies_when": "Public companies, large proprietary companies, and proprietary-company trustees of registrable superannuation entities, since 1 January 2020. Commonwealth public sector bodies fall under the Public Interest Disclosure Act 2013 instead. Relief for not-for-profit companies limited by guarantee with revenue under AUD 1 million.", "obligation": "A whistleblower policy covering: the protections available including those under law; who can receive a disclosure and how; how the company will support whistleblowers and prevent detriment; how protected disclosures will be investigated; fair treatment of employees mentioned in a disclosure; and how the policy is made available to officers and employees. Civil and criminal penalties apply for causing detriment or breaching confidentiality.", "affects": ["safety", "transparency", "decisions", "recognition"], "source_url": "https://www.asic.gov.au/about-asic/asic-investigations-and-enforcement/whistleblowing/protections-for-corporate-sector-whistleblowers/", "verified_via": "primary", "gate": {"legal_form": ["listed"], "or_min_employees": 100, "excl_legal_form": ["state", "partnership"], "verified_threshold": true, "also": "public companies, large proprietary companies and proprietary-company RSE trustees; 'large proprietary' is two of three tests, of which only the 100-employee limb is tested here"}}]}, {"id": "sg", "label": "Singapore", "region": "Asia-Pacific", "depth": "outline", "regimes": [{"id": "sg-cg-2018", "name": "Code of Corporate Governance 2018", "binding": false, "basis": "Principles are mandatory; variations from Provisions are permitted where the company explains how its practices remain consistent with the Principle", "applies_when": "SGX-listed companies", "obligation": "Explanations must be comprehensive and meaningful rather than checklist compliance.", "affects": ["governance", "transparency", "roles"], "source_url": "https://rulebook.sgx.com/rulebook/code-corporate-governance-2018", "verified_via": "primary", "gate": {"legal_form": ["listed"], "verified_threshold": true}}]}, {"id": "other", "label": "Somewhere else / prefer not to say", "region": "—", "depth": "none", "regimes": [], "fallback_note": "No national regime is mapped for this location yet, so the assessment cites only the international instruments — which apply as expectations everywhere, whether or not they are legally binding where you operate. That is a gap in this repository, not a statement that nothing applies to you."}], "not_yet_mapped": {"note": "Named here so the gap is explicit rather than silent. Each needs the same primary-source verification as the entries above before being added.", "jurisdictions": ["Canada", "United Arab Emirates and the wider Gulf", "China", "Mexico", "Nigeria", "Indonesia", "Switzerland", "Netherlands (beyond the EU baseline)", "Spain and Italy (beyond the EU baseline)"]}}, "culture": {"schema": "accountability-repository/culture@1", "updated": "2026-08-19", "stance": {"principle": "Culture changes how a recommendation is implemented. It never changes whether accountability applies.", "what_this_does_not_do": "This repository does not hold national culture scores and does not adjust anything on the basis of the country you selected. Two reasons. First, the country score would be doing the work of a stereotype: Hofstede's own site describes the country maps as rough climate maps with considerable within-country variation and says the scores apply at national level, not to individuals or specific organizations. Second, the widely used country datasets are licensed commercial products and cannot be embedded here. A third reason we previously gave — that individual orientation predicts candour better than nationality — is withdrawn: the study we rely on does not test that comparison, and its one cross-national study used nationality as a strong grouping variable. The honest claim is narrower: the mechanism runs through an individual's own belief about power distance, which is the level a respondent can actually report and act on.", "what_this_does_instead": "Four short calibration questions about the respondent's own context. The answers drive the adaptation, and every adaptation names the research it rests on and is phrased as a hypothesis the respondent can reject.", "location_still_matters": "Location is collected and used — for the legal regime, in contexts.json, which is objective and verifiable. That is where a country genuinely changes what is required of you.", "how_to_read_an_adaptation": "Each one says: here is what the research would predict, here is what to do differently if it holds, and here is how you would know it does not. If it does not describe your organization, discard it — that is the intended use, not a failure of the tool.", "who_is_answering": "One person answers these four questions, and on the hierarchy question that person is often the senior one being described. The cited mechanism runs through an individual's belief about their own upward communication, so using one respondent's answer to predict other people's silence is a step the research does not license. Check the hierarchy answer with two people junior to you before acting on anything it triggers."}, "sources": [{"id": "HOFSTEDE-6D", "title": "Hofstede's six-dimension model of national culture", "issuer": "Geert Hofstede / Gert Jan Hofstede", "tier": "D", "url": "https://geerthofstede.com/culture-geert-hofstede-gert-jan-hofstede/6d-model-of-national-culture/", "verified_via": "primary", "dimensions": [{"id": "individualism", "statement": "The extent to which people feel independent as opposed to interdependent as members of larger wholes."}, {"id": "power_distance", "statement": "The extent to which the less powerful members of organizations and institutions accept and expect that power is distributed unequally."}, {"id": "masculinity", "statement": "The extent to which the use of force is endorsed socially."}, {"id": "uncertainty_avoidance", "statement": "A society's tolerance for uncertainty and ambiguity."}, {"id": "long_term_orientation", "statement": "How societies deal with change."}, {"id": "indulgence", "statement": "How societies relate to the good things in life."}], "stated_caveat": "The author's own framing: the world maps should be seen as rough climate maps of culture, with considerable within-country variation. Scores apply at national or regional level, not to individuals or to specific organizations."}, {"id": "GLOBE-2004", "title": "GLOBE study — Culture, Leadership, and Organizations", "issuer": "House et al., GLOBE Project", "tier": "D", "url": "https://globeproject.com/study_2004_2007", "verified_via": "primary", "dimensions": ["performance orientation", "assertiveness", "future orientation", "humane orientation", "institutional collectivism", "in-group collectivism", "gender egalitarianism", "power distance", "uncertainty avoidance"], "why_it_matters_here": "GLOBE separates practices as they are from values as people think they should be. The gap between the two is often larger than the gap between countries — and it is exactly the gap an accountability intervention works in. People frequently want less power distance than they currently experience."}, {"id": "MEYER-2014", "title": "Erin Meyer, The Culture Map — eight scales", "issuer": "Erin Meyer / INSEAD", "tier": "D", "url": "https://erinmeyer.com/books/the-culture-map/", "verified_via": "reputable-secondary", "scales": [{"id": "communicating", "poles": "low-context (precise, simple, explicit) ↔ high-context (nuanced, layered)"}, {"id": "evaluating", "poles": "direct negative feedback ↔ indirect negative feedback"}, {"id": "persuading", "poles": "principles-first / holistic ↔ applications-first / specific"}, {"id": "leading", "poles": "egalitarian ↔ hierarchical"}, {"id": "deciding", "poles": "top-down ↔ consensual"}, {"id": "trusting", "poles": "task-based ↔ relationship-based"}, {"id": "disagreeing", "poles": "confrontational ↔ avoids confrontation"}, {"id": "scheduling", "poles": "linear time ↔ flexible time"}], "why_it_matters_here": "The Evaluating and Deciding scales bear directly on two elements of this instrument — Feedback & Problem Solving, and Responsible Decisions & Consequences."}, {"id": "PD-FEAR-2022", "title": "Power distance belief and workplace communication: the mediating role of fear of authority", "issuer": "peer-reviewed, published via PMC", "tier": "D", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC8910159/", "verified_via": "primary", "finding": "Across four studies (N=1,063), fear of authority mediated the negative effect of high power distance belief on communication with superiors. The effect was specific to the superior–subordinate relationship: power distance belief showed no significant association with communication with colleagues or with subordinates.", "stated_caveat": "The authors' own limitations: participants recruited online rather than in workplaces, mostly degree-holders, studies 1–3 Chinese-only with cross-cultural comparison only in study 4, self-developed communication scales, and largely correlational designs. They caution against strong conclusions about real-world workplace communication.", "why_it_matters_here": "It is the most useful finding in this file precisely because it is narrow. It says the constraint sits on the vertical channel, not on candour in general — which means the fix is structural (route around the hierarchy) rather than exhortational (ask people to be braver)."}], "calibration": [{"id": "hierarchy", "question": "In this context, how much does seniority shape who speaks and who is heard?", "help": "Answer for what you observe, not what your values statement says.", "options": [{"id": "steep", "label": "Strongly — juniors rarely contradict seniors in the room"}, {"id": "mixed", "label": "It depends on the team or the manager"}, {"id": "flat", "label": "Barely — position carries little weight in discussion"}]}, {"id": "directness", "question": "How is critical feedback normally delivered here?", "options": [{"id": "direct", "label": "Directly and explicitly, sometimes bluntly"}, {"id": "cushioned", "label": "Softened, wrapped in positives"}, {"id": "indirect", "label": "Indirectly — implied, or delivered through a third party"}]}, {"id": "deciding", "question": "How are significant decisions normally reached?", "options": [{"id": "topdown", "label": "One person decides, then it is communicated"}, {"id": "consensus", "label": "Built by consensus before anything is announced"}, {"id": "mixed", "label": "Varies by decision and by leader"}]}, {"id": "language", "question": "Do most people work day to day in their first language?", "options": [{"id": "yes", "label": "Yes, almost everyone"}, {"id": "mixed", "label": "Mixed — a common working language, many second-language speakers"}, {"id": "no", "label": "Mostly not — nearly everyone is working in a second language"}]}], "adaptations": [{"id": "steep-hierarchy", "when": {"hierarchy": ["steep"]}, "affects": ["safety", "transparency", "feedback", "trust"], "headline": "The constraint is on the vertical channel, not on candour.", "prediction": "Where power distance is high, fear of authority suppresses upward communication specifically — the same people communicate normally with peers and with their own reports. So an open invitation to raise concerns in a meeting where a senior person is present will produce silence, and the silence will be misread as agreement.", "do": ["Prioritize the routes that bypass hierarchy: anonymous reporting, skip-level access, an ombuds role. Treat these as primary channels here, not as backups.", "Have the most senior person in the room speak last and ask first, by name, rather than inviting volunteers.", "Give a named person the job of surfacing concerns upward, so raising an issue is someone's role rather than an act of personal courage."], "instead_of": ["Open all-hands invitations to raise concerns.", "Reading low report volume as evidence that things are fine."], "how_you_would_know_this_is_wrong": "Compare where issues actually surface: over your last ten escalations, how many were first raised in an open meeting with a senior person present, versus through a private or written route? If the open route carries at least as many, the vertical channel is not your constraint and this adaptation does not apply.", "derived_from": ["PD-FEAR-2022", "HOFSTEDE-6D", "MEYER-2014"], "confidence": "moderate — the mediating study is largely correlational and single-country for three of its four samples"}, {"id": "flat-hierarchy", "when": {"hierarchy": ["flat"]}, "affects": ["roles", "feedback", "decisions"], "headline": "Open forums will work. Ownership is your risk instead.", "prediction": "Where position carries little weight, concerns surface readily but decisions diffuse. The characteristic failure is an issue that everyone has discussed and nobody owns.", "do": ["Weight the Roles step-1 move heavily: one named owner per outcome, accepted explicitly.", "Name a decider for each decision class, so egalitarian discussion still terminates in someone's decision.", "Close issues in writing with an owner and a date at the moment they are raised."], "instead_of": ["Investing in speak-up machinery you probably do not need."], "how_you_would_know_this_is_wrong": "If your issue log has clear single owners and closes on time, this does not apply.", "derived_from": ["MEYER-2014", "HOFSTEDE-6D"], "confidence": "low — practitioner inference; the diffusion claim is not in either cited source"}, {"id": "indirect-feedback", "when": {"directness": ["cushioned", "indirect"]}, "affects": ["feedback", "learning", "decisions", "recognition"], "headline": "A message delivered is not a message received.", "prediction": "Where negative feedback is softened, the recipient frequently hears approval. The instrument's Feedback element will score reasonably while the substance is not landing — feedback is happening, it is just not arriving.", "do": ["Put the critical part in writing as well as saying it, so it survives the softening.", "Separate the observation from the evaluation, and state the consequence explicitly.", "Check what the person heard rather than confirming what you said — ask them to state the change they will make."], "instead_of": ["Importing a direct-feedback norm wholesale because it works elsewhere in the group.", "Assuming a difficult message landed because it was delivered."], "how_you_would_know_this_is_wrong": "If people can quote back the substance of critical feedback they received last quarter, this is not your problem.", "derived_from": ["MEYER-2014"], "confidence": "moderate"}, {"id": "direct-feedback", "when": {"directness": ["direct"]}, "affects": ["feedback", "safety"], "headline": "Speed is your advantage; range is your risk.", "prediction": "Direct feedback moves fast and is generally heard accurately by people who share the norm. Colleagues from more indirect contexts may read the same delivery as hostility, and the cost shows up as withdrawal rather than as complaint.", "do": ["Keep the directness; add an explicit statement of intent before difficult feedback, which costs nothing and travels well.", "Check psychological safety by team rather than in aggregate — this is where the variance will be."], "instead_of": ["Assuming a norm that works for the majority works for everyone in the room."], "how_you_would_know_this_is_wrong": "If team-level safety scores are uniform across your international teams, this is not an issue for you.", "derived_from": ["MEYER-2014", "EDMONDSON-1999.PS"], "confidence": "low — a plausible extension of the evaluating scale rather than a tested finding"}, {"id": "consensus-deciding", "when": {"deciding": ["consensus"]}, "affects": ["decisions", "roles", "governance"], "headline": "Make the moment of decision explicit.", "prediction": "Consensus cultures decide slowly and implement fast. The characteristic failure is ambiguity about when the decision actually happened, which later makes accountability for it contestable.", "do": ["Say out loud when consensus-building ends and the decision is taken, and record who took it.", "Record the basis at the time — consensus decisions are the hardest to reconstruct afterwards because no single person holds the reasoning.", "Do not mistake absence of objection for agreement; ask each participant to state their position."], "instead_of": ["Treating a long discussion that stopped as a decision that was made."], "how_you_would_know_this_is_wrong": "If you can point to a dated decision record with a named decider for your last three significant decisions, you have already solved this.", "derived_from": ["MEYER-2014", "ISO-37000-2021.P8"], "confidence": "moderate"}, {"id": "topdown-deciding", "when": {"deciding": ["topdown"]}, "affects": ["decisions", "learning", "trust"], "headline": "Fast decisions, thin records.", "prediction": "Top-down decisions are quick and unambiguous about who decided. What is usually missing is the basis — which makes the decision impossible to revisit when conditions change, and impossible to learn from when it turns out badly.", "do": ["Record what was known and unknown at the time, not only what was decided.", "State in advance what would cause the decision to be revisited.", "Before blaming someone for a bad outcome, ask whether another equally qualified person would have decided the same way. The person who decided is unusually easy to identify here."], "instead_of": ["Moving to consensus for its own sake — the speed is a real asset."], "how_you_would_know_this_is_wrong": "If your decision records already capture the reasoning and the trigger for review, this does not apply.", "derived_from": ["MEYER-2014", "ISO-37000-2021.P8", "REASON-1997.SUB"], "confidence": "moderate"}, {"id": "second-language", "when": {"language": ["mixed", "no"]}, "affects": ["safety", "feedback", "transparency", "vision"], "headline": "Fluency is being read as competence, and hedged language as agreement.", "prediction": "Working in a second language costs people precision under pressure — exactly the conditions in which concerns get raised. Nuance disappears first, so a serious reservation surfaces as a mild qualifier and is heard as assent.", "do": ["Allow concerns to be raised in writing and in first language where possible; translate afterwards rather than requiring live fluency.", "Give more time in meetings where difficult issues are discussed, and circulate the question in advance.", "Confirm understanding of expectations by asking people to restate them in their own words, which is also the Vision step-1 comprehension check."], "instead_of": ["Reading hesitancy or brevity as lack of conviction, or fluency as command of the subject."], "how_you_would_know_this_is_wrong": "Count rather than judge: of your last ten escalations, what share were first raised by a second-language speaker, relative to their share of headcount? If it is proportional, this is not your constraint.", "derived_from": ["MEYER-2014", "EDMONDSON-1999.PS"], "confidence": "low — practitioner inference, not directly t
